<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="מה בי״ם — פעילות, חוגים ואירועים לבני נוער">
  <meta name="theme-color" content="#F1F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מה בי״ם">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>מה בי״ם — תצוגת פעילות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
  :root {
    --bg: #F1F4F0;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --ink: #1B2320;
    --ink-soft: #59665C;
    --ink-faint: #8A968C;
    --accent: #DE5A3C;
    --accent-ink: #FFFFFF;
    --line: #DEE5DC;
    --chip-bg: #E9EEE7;
    --shadow: 220 25% 12%;
    --danger: #C0392B;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141815;
      --surface: #1E2420;
      --surface-raised: #232A25;
      --ink: #ECEFEA;
      --ink-soft: #A8B2A9;
      --ink-faint: #6E7A70;
      --accent: #FF7A57;
      --accent-ink: #1A100C;
      --line: #303930;
      --chip-bg: #283029;
      --shadow: 0 0% 0%;
      --danger: #FF6B5E;
    }
  }

  :root[data-theme="dark"] {
    --bg: #141815;
    --surface: #1E2420;
    --surface-raised: #232A25;
    --ink: #ECEFEA;
    --ink-soft: #A8B2A9;
    --ink-faint: #6E7A70;
    --accent: #FF7A57;
    --accent-ink: #1A100C;
    --line: #303930;
    --chip-bg: #283029;
    --shadow: 0 0% 0%;
    --danger: #FF6B5E;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Heebo", "Segoe UI", system-ui, sans-serif;
    direction: rtl;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 12px 40px;
  }

  .frame {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .eyebrow strong {
    color: var(--ink-soft);
    font-weight: 700;
  }

  .greeting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .greeting-row .hi {
    font-family: "Suez One", "Heebo", serif;
    font-size: 17px;
    color: var(--ink);
  }

  .signout-btn {
    border: none;
    background: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .auth-screen {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 8px 4px 32px;
  }

  .auth-logo {
    font-family: "Suez One", "Heebo", serif;
    font-size: 30px;
    color: var(--ink);
    text-align: center;
  }

  .auth-logo span {
    display: block;
    font-family: "Heebo", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  .auth-tabs {
    display: flex;
    width: 100%;
    background: var(--chip-bg);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }

  .auth-tab {
    flex: 1;
    border: none;
    background: none;
    padding: 9px 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .auth-tab[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 4px hsl(var(--shadow) / 0.12);
  }

  .auth-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .auth-field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .auth-field input {
    height: 46px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }

  .auth-field input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }

  .auth-error {
    font-size: 13px;
    color: var(--danger);
    text-align: center;
    min-height: 1em;
  }

  .auth-submit {
    height: 48px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .auth-submit:disabled { opacity: 0.6; cursor: default; }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    color: var(--ink-faint);
    font-size: 12.5px;
  }

  .auth-divider::before, .auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .guest-btn {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .quiz-screen {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 8px 4px 32px;
  }

  .quiz-progress {
    display: flex;
    gap: 5px;
  }

  .quiz-progress span {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: var(--line);
  }

  .quiz-progress span.done { background: var(--accent); }

  .quiz-eyebrow {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  .quiz-title {
    font-family: "Suez One", "Heebo", serif;
    font-size: 23px;
    line-height: 1.3;
    color: var(--ink);
    margin: 4px 0 0;
    text-wrap: balance;
  }

  .quiz-subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 6px 0 0;
  }

  .quiz-body {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .quiz-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .quiz-field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .quiz-field input {
    height: 46px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }

  .quiz-field input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .quiz-options.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .quiz-option {
    width: 100%;
    text-align: right;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.4;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .quiz-option[aria-pressed="true"] {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    font-weight: 700;
  }

  .quiz-section-label {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 4px 0 -2px;
  }

  .quiz-nav {
    display: flex;
    gap: 10px;
  }

  .quiz-btn {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .quiz-btn.primary { background: var(--accent); color: var(--accent-ink); }
  .quiz-btn.primary:disabled { opacity: 0.5; cursor: default; }
  .quiz-btn.secondary { background: var(--chip-bg); color: var(--ink); flex: 0 0 92px; }

  .quiz-result {
    text-align: center;
    padding: 12px 0;
  }

  .quiz-result .emoji { font-size: 40px; }

  .search-bar {
    position: relative;
    width: 100%;
  }

  .search-bar .search-ic {
    position: absolute;
    inset-inline-start: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    stroke: var(--ink-faint);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .search-bar input {
    width: 100%;
    height: 44px;
    padding-inline-start: 40px;
    padding-inline-end: 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
  }

  .search-bar input::placeholder { color: var(--ink-faint); }
  .search-bar input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip-row {
    display: flex;
    gap: 8px;
    width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .chip-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .chip[aria-pressed="true"] {
    background: var(--chip-color, var(--accent));
    border-color: var(--chip-color, var(--accent));
    color: #fff;
  }

  .chip-row--topics .chip { font-weight: 500; font-size: 12.5px; padding: 6px 12px; }

  .stage {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .stage.is-empty .arrow-btn { display: none; }

  .card.is-empty {
    text-align: center;
    padding: 40px 24px;
    color: var(--ink-soft);
    font-size: 14.5px;
  }

  .card.is-empty .clear-btn {
    margin-top: 14px;
    border: none;
    background: var(--chip-bg);
    color: var(--ink);
    font-family: inherit;
    font-weight: 700;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
  }

  .arrow-btn {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 10px hsl(var(--shadow) / 0.08);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .arrow-btn:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .arrow-btn:active {
    transform: translateY(0) scale(0.96);
  }

  .arrow-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .arrow-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card {
    position: relative;
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 20px 20px;
    box-shadow: 0 10px 30px hsl(var(--shadow) / 0.10);
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset-inline-start: 0;
    inset-block: 0;
    width: 6px;
    background: var(--cat-color, var(--accent));
  }

  .card.fade-in { animation: cardIn 0.22s ease; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card.fade-in { animation: none; }
    .arrow-btn { transition: none; }
  }

  .kind-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .kind-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--cat-color, var(--accent));
    color: #fff;
  }

  .category-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--chip-bg);
    padding: 5px 11px;
    border-radius: 999px;
  }

  h1 {
    font-family: "Suez One", "Heebo", serif;
    font-weight: 400;
    font-size: 24px;
    line-height: 1.25;
    text-wrap: balance;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .short-desc {
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0 0 16px;
  }

  .facts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }

  .fact {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--ink);
  }

  .fact .ic {
    flex: none;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    stroke: var(--ink-faint);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fact b {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .fact .sub {
    color: var(--ink-faint);
    font-size: 12.5px;
  }

  .desc {
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink);
    margin: 0 0 16px;
  }

  .cta-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .cta {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    font-size: 14.5px;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    transition: filter 0.15s ease;
  }

  .cta:hover { filter: brightness(1.06); }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cta.secondary {
    background: var(--chip-bg);
    color: var(--ink);
  }

  .cta.disabled {
    background: var(--chip-bg);
    color: var(--ink-faint);
    cursor: default;
    pointer-events: none;
  }

  .dots {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dots button {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    border: none;
    padding: 0;
    background: var(--line);
    cursor: pointer;
  }

  .dots button[aria-current="true"] {
    width: 22px;
    background: var(--accent);
  }

  .counter {
    font-size: 12.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .note {
    max-width: 420px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
    line-height: 1.6;
  }
  </style>
</head>
<body>
  <div class="frame" id="authScreen" hidden>
    <div class="auth-screen">
      <div class="auth-logo">מה בי״ם<span>פעילות, חוגים ואירועים לבני נוער</span></div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab" id="tabLogin" role="tab" aria-selected="true">התחברות</button>
        <button type="button" class="auth-tab" id="tabSignup" role="tab" aria-selected="false">הרשמה</button>
      </div>

      <form class="auth-form" id="authForm">
        <div class="auth-field">
          <label for="authUsername">שם משתמש</label>
          <input type="text" id="authUsername" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="authPassword">סיסמה</label>
          <input type="password" id="authPassword" autocomplete="current-password" required minlength="6">
        </div>
        <p class="auth-error" id="authError"></p>
        <button type="submit" class="auth-submit" id="authSubmit">התחברות</button>
      </form>

      <div class="auth-divider">או</div>

      <button type="button" class="guest-btn" id="guestBtn">המשך כאורח</button>
    </div>
  </div>

  <div class="frame" id="quizScreen" hidden>
    <div class="quiz-screen" id="quizContent"></div>
  </div>

  <div class="frame" id="appRoot" hidden>
    <div class="greeting-row">
      <span class="hi" id="userGreeting"></span>
      <button type="button" class="signout-btn" id="signoutBtn">התנתקות</button>
    </div>

    <div class="eyebrow">מה בי״ם <strong>· תצוגת נתונים מהדאטהבייס</strong></div>

    <div class="search-bar">
      <svg class="search-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="חיפוש לפי שם, תיאור או ארגון…" aria-label="חיפוש פעילות">
    </div>

    <div class="chip-row" id="categoryChips" aria-label="סינון לפי קטגוריה"></div>
    <div class="chip-row chip-row--topics" id="topicChips" aria-label="סינון לפי נושא" hidden></div>

    <div class="stage">
      <button class="arrow-btn" id="btnRight" aria-label="הפעילות הקודמת">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="card fade-in" id="card"></div>

      <button class="arrow-btn" id="btnLeft" aria-label="הפעילות הבאה">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <div class="dots" id="dots"></div>
    <div class="counter" id="counter"></div>

    <p class="note">דמו סטטי לבדיקת עיצוב — הנתונים הם צילום מצב נוכחי של טבלת activities בסופאבייס, לא חיבור חי.</p>
  </div>

  <script>
  const activities = [
    {
      item_kind: "activity", schedule_type: "recurring", category: "tech",
      topics: ["רובוטיקה", "תכנות"],
      title: "חוג רובוטיקה לנוער",
      short_description: "בונים ומתכנתים רובוטים בסביבה תומכת לבני נוער",

  // exactly once; guests skip it entirely, since guest data is never collected.
  async function proceedAfterAuth(userId, greetingName) {
    const { data: prefs } = await sb.from("user_preferences").select("user_id").eq("user_id", userId).maybeSingle();
    if (prefs) {

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = authUsernameEl.value.trim();
    const password = authPasswordEl.value;
    if (!username || !password) return;

    authSubmitEl.disabled = true;
    authErrorEl.textContent = "";
    const email = usernameToEmail(username);

    try {
      if (authMode === "signup") {
        const { data: existing } = await sb.from("users").select("id").eq("username", username).maybeSingle();
        if (existing) {
          authErrorEl.textContent = "שם המשתמש הזה תפוס, נסה שם אחר.";
          return;
        }
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { username, full_name: username } }
        });
        if (error) throw error;
        if (!data.session) {
          authErrorEl.textContent = "ההרשמה בוצעה, אך נדרש עוד אימות. פנה למנהל המערכת.";

          </div>
          <div class="quiz-field">
            <span class="quiz-section-label">באיזה אזור בירושלים אתה גר?</span>
            ${pillOptionsHtml("area", AREA_OPTIONS, quiz.area, false)}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">הקודם</button>
          <button type="button" class="quiz-btn primary" id="qNext" ${quiz.ageRange && quiz.grade && quiz.area ? "" : "disabled"}>הבא</button>
        </div>
      `;
    } else if (s >= 2 && s <= 6) {
      const qIndex = s - 2;
      const q = VIBE_QUESTIONS[qIndex];
      const selected = quiz.vibeAnswers[qIndex];
      html = `
        ${quizProgressHtml(s)}
        <p class="quiz-eyebrow">שאלה ${qIndex + 1} מ-5</p>
        <h1 class="quiz-title">${q.prompt}</h1>
        <div class="quiz-options">
          ${q.options.map(opt => `
            <button type="button" class="quiz-option" aria-pressed="${selected === opt.vibe}" data-vibe-opt="${opt.vibe}">${opt.text}</button>
          `).join("")}
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">הקודם</button>
          <button type="button" class="quiz-btn primary" id="qNext" ${selected ? "" : "disabled"}>הבא</button>
        </div>
      `;
    } else if (s === 7) {
      html = `
        ${quizProgressHtml(7)}
        <h1 class="quiz-title">מה מעניין אותך?</h1>
        <p class="quiz-subtitle">בחר את כל מה שרלוונטי</p>
        <div class="quiz-body">
          <div class="quiz-field">
            <span class="quiz-section-label">אילו סוגי פעילויות הכי מעניינים אותך?</span>
            ${pillOptionsHtml("atype", ACTIVITY_TYPE_OPTIONS, quiz.activityTypes, true)}
          </div>
          <div class="quiz-field">
            <span class="quiz-section-label">באילו תחומים?</span>
            ${pillOptionsHtml("topic", TOPIC_OPTIONS, quiz.interestTopics, true)}
            <input type="text" id="qOther" value="${quiz.interestOther}" placeholder="אחר (טקסט חופשי)">
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">הקודם</button>
          <button type="button" class="quiz-btn primary" id="qNext">סיימתי</button>
        </div>
      `;
    } else if (s === 8) {
      html = `
        <div class="quiz-result">
          <div class="emoji">🎉</div>
          <h1 class="quiz-title">מעולה, סיימנו!</h1>
          <p class="quiz-subtitle">האפליקציה מוכנה בשבילך, מותאמת אישית</p>
        </div>
        <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="qEnter">כניסה לאפליקציה</button></div>
      `;
    }

    quizContentEl.innerHTML = html;
    wireQuizStep();
  }

  function wireQuizStep() {
    const s = quiz.step;
    const nextBtn = document.getElementById("qNext");
    const backBtn = document.getElementById("qBack");
    const enterBtn = document.getElementById("qEnter");

    if (backBtn) backBtn.addEventListener("click", () => { quiz.step--; renderQuiz(); });
    if (enterBtn) enterBtn.addEventListener("click", () => showApp(quiz.greetingName));

    if (s === 1) {
      document.getElementById("qFirstName").addEventListener("input", e => quiz.firstName = e.target.value);
      document.getElementById("qLastName").addEventListener("input", e => quiz.lastName = e.target.value);
      quizContentEl.querySelectorAll("[data-age]").forEach(btn =>
        btn.addEventListener("click", () => { quiz.ageRange = btn.dataset.age; renderQuiz(); }));
      quizContentEl.querySelectorAll("[data-grade]").forEach(btn =>
        btn.addEventListener("click", () => { quiz.grade = btn.dataset.grade; renderQuiz(); }));
      quizContentEl.querySelectorAll("[data-area]").forEach(btn =>
        btn.addEventListener("click", () => { quiz.area = btn.dataset.area; renderQuiz(); }));
      if (nextBtn) nextBtn.addEventListener("click", () => { quiz.step++; renderQuiz(); });
    } else if (s >= 2 && s <= 6) {
      const qIndex = s - 2;
      quizContentEl.querySelectorAll("[data-vibe-opt]").forEach(btn =>
        btn.addEventListener("click", () => { quiz.vibeAnswers[qIndex] = btn.dataset.vibeOpt; renderQuiz(); }));
      if (nextBtn) nextBtn.addEventListener("click", () => { quiz.step++; renderQuiz(); });
    } else if (s === 7) {
      quizContentEl.querySelectorAll("[data-atype]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.atype;
          const i = quiz.activityTypes.indexOf(v);
          if (i === -1) quiz.activityTypes.push(v); else quiz.activityTypes.splice(i, 1);
          renderQuiz();
        }));
      quizContentEl.querySelectorAll("[data-topic]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topic;
          const i = quiz.interestTopics.indexOf(v);
          if (i === -1) quiz.interestTopics.push(v); else quiz.interestTopics.splice(i, 1);
          renderQuiz();
        }));
      document.getElementById("qOther").addEventListener("input", e => quiz.interestOther = e.target.value);
      if (nextBtn) nextBtn.addEventListener("click", finishQuiz);
    } else if (s === 0) {
      if (nextBtn) nextBtn.addEventListener("click", () => { quiz.step = 1; renderQuiz(); });
    }
  }

  function computeVibeResult() {
    const counts = { energetic: 0, balanced: 0, serious: 0 };
    quiz.vibeAnswers.forEach(v => counts[v]++);
    const max = Math.max(counts.energetic, counts.balanced, counts.serious);
    const winners = Object.keys(counts).filter(k => counts[k] === max);
    if (winners.length === 1) return winners[0];
    const tieBreak = { "12-13": "energetic", "14-15": "energetic", "16-17": "balanced", "18+": "serious" };
    return tieBreak[quiz.ageRange] || "balanced";
  }

  async function finishQuiz() {
    const vibeResult = computeVibeResult();
    await sb.from("user_preferences").insert({
      user_id: quiz.userId,
      first_name: quiz.firstName || null,
      last_name: quiz.lastName || null,
      age_range: quiz.ageRange,
      grade: quiz.grade,
      area: quiz.area,
      vibe_q1: quiz.vibeAnswers[0], vibe_q2: quiz.vibeAnswers[1], vibe_q3: quiz.vibeAnswers[2],
      vibe_q4: quiz.vibeAnswers[3], vibe_q5: quiz.vibeAnswers[4],
      vibe_result: vibeResult,
      activity_types: quiz.activityTypes,
      interest_topics: quiz.interestTopics,
      interest_other: quiz.interestOther || null
    });
    quiz.step = 8;
    renderQuiz();
  }
  </script>
</body>
</html>
