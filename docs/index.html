<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="מה בי״ם — פעילות, חוגים ואירועים לבני נוער">
  <meta name="theme-color" content="#F1F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מה בי״ם">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>מה בי״ם — תצוגת פעילות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
  :root {
    --bg: #F1F4F0;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --ink: #1B2320;
    --ink-soft: #59665C;
    --ink-faint: #8A968C;
    --accent: #DE5A3C;
    --accent-ink: #FFFFFF;
    --line: #DEE5DC;
    --chip-bg: #E9EEE7;
    --shadow: 220 25% 12%;
    --danger: #C0392B;
    --text-scale: 1;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141815;
      --surface: #1E2420;
      --surface-raised: #232A25;
      --ink: #ECEFEA;
      --ink-soft: #A8B2A9;
      --ink-faint: #6E7A70;
      --accent: #FF7A57;
      --accent-ink: #1A100C;
      --line: #303930;
      --chip-bg: #283029;
      --shadow: 0 0% 0%;
      --danger: #FF6B5E;
    }
  }

  :root[data-theme="dark"] {
    --bg: #141815;
    --surface: #1E2420;
    --surface-raised: #232A25;
    --ink: #ECEFEA;
    --ink-soft: #A8B2A9;
    --ink-faint: #6E7A70;
    --accent: #FF7A57;
    --accent-ink: #1A100C;
    --line: #303930;
    --chip-bg: #283029;
    --shadow: 0 0% 0%;
    --danger: #FF6B5E;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Heebo", "Segoe UI", system-ui, sans-serif;
    direction: rtl;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 12px 40px;
  }

  .frame {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: calc(12px * var(--text-scale));
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .eyebrow strong {
    color: var(--ink-soft);
    font-weight: 700;
  }

  .greeting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .greeting-row .hi {
    font-family: "Suez One", "Heebo", serif;
    font-size: calc(17px * var(--text-scale));
    color: var(--ink);
  }

  body.has-bottom-nav { padding-bottom: 88px; }

  .bottom-nav {
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
    z-index: 50;
  }

  .bottom-nav-inner {
    display: flex;
    width: 100%;
    max-width: 420px;
    justify-content: space-around;
  }

  .bottom-nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: none;
    background: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: calc(11.5px * var(--text-scale));
    font-weight: 600;
    cursor: pointer;
    padding: 6px 4px;
    border-radius: 10px;
  }

  .bottom-nav-btn .nav-icon { font-size: calc(20px * var(--text-scale)); line-height: 1; }
  .bottom-nav-btn[aria-current="true"] { color: var(--accent); }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .signout-btn {
    border: none;
    background: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: calc(12.5px * var(--text-scale));
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .auth-screen {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 8px 4px 32px;
  }

  .auth-logo {
    font-family: "Suez One", "Heebo", serif;
    font-size: calc(30px * var(--text-scale));
    color: var(--ink);
    text-align: center;
  }

  .auth-logo span {
    display: block;
    font-family: "Heebo", sans-serif;
    font-size: calc(13px * var(--text-scale));
    font-weight: 600;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  .auth-tabs {
    display: flex;
    width: 100%;
    background: var(--chip-bg);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }

  .auth-tab {
    flex: 1;
    border: none;
    background: none;
    padding: 9px 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: calc(14px * var(--text-scale));
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .auth-tab[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 4px hsl(var(--shadow) / 0.12);
  }

  .auth-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .auth-field label {
    font-size: calc(13px * var(--text-scale));
    font-weight: 600;
    color: var(--ink-soft);
  }

  .auth-field input {
    height: 46px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: calc(15px * var(--text-scale));
    outline: none;
  }

  .auth-field input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }

  .auth-error {
    font-size: calc(13px * var(--text-scale));
    color: var(--danger);
    text-align: center;
    min-height: 1em;
  }

  .auth-submit {
    height: 48px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: calc(15px * var(--text-scale));
    font-weight: 700;
    cursor: pointer;
  }

  .auth-submit:disabled { opacity: 0.6; cursor: default; }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    color: var(--ink-faint);
    font-size: calc(12.5px * var(--text-scale));
  }

  .auth-divider::before, .auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .guest-btn {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: calc(14.5px * var(--text-scale));
    font-weight: 700;
    cursor: pointer;
  }

  .quiz-screen {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 8px 4px 32px;
  }

  .quiz-progress {
    display: flex;
    gap: 5px;
  }

  .quiz-progress span {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: var(--line);
  }

  .quiz-progress span.done { background: var(--accent); }

  .quiz-eyebrow {
    font-size: calc(12.5px * var(--text-scale));
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  .quiz-title {
    font-family: "Suez One", "Heebo", serif;
    font-size: calc(23px * var(--text-scale));
    line-height: 1.3;
    color: var(--ink);
    margin: 4px 0 0;
    text-wrap: balance;
  }

  .quiz-subtitle {
    font-size: calc(14px * var(--text-scale));
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 6px 0 0;
  }

  .quiz-body {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .quiz-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .quiz-field label {
    font-size: calc(13px * var(--text-scale));
    font-weight: 600;
    color: var(--ink-soft);
  }

  .quiz-field input {
    height: 46px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: calc(15px * var(--text-scale));
    outline: none;
  }

  .quiz-field input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }

  .quiz-options {
    display: flex;
    flex-flow: row wrap;
    justify-content: center;
    gap: 10px;
  }

  .seg {
    display: flex;
    gap: 8px;
    width: 100%;
    margin: 4px 0 8px;
  }

  .seg .quiz-option { flex: 1; }

  .quiz-option {
    flex: 0 0 auto;
    text-align: center;
    padding: 11px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: calc(14.5px * var(--text-scale));
    line-height: 1.4;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .quiz-select-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .quiz-select-field label {
    font-size: calc(13px * var(--text-scale));
    font-weight: 600;
    color: var(--ink-soft);
  }

  .quiz-select-field select {
    width: 100%;
    max-width: 260px;
    height: 48px;
    padding: 0 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: calc(15px * var(--text-scale));
    text-align: center;
    text-align-last: center;
    cursor: pointer;
  }

  .quiz-select-field select:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }

  .quiz-option[aria-pressed="true"] {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    font-weight: 700;
  }

  .quiz-section-label {
    font-size: calc(13.5px * var(--text-scale));
    font-weight: 700;
    color: var(--ink);
    margin: 4px 0 -2px;
  }

  .quiz-nav {
    display: flex;
    gap: 10px;
  }

  .quiz-btn {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: calc(15px * var(--text-scale));
    font-weight: 700;
    cursor: pointer;
  }

  .quiz-btn.primary { background: var(--accent); color: var(--accent-ink); }
  .quiz-btn.primary:disabled { opacity: 0.5; cursor: default; }
  .quiz-btn.secondary { background: var(--chip-bg); color: var(--ink); flex: 0 0 92px; }

  .quiz-result {
    text-align: center;
    padding: 12px 0;
  }

  .quiz-result .emoji { font-size: calc(40px * var(--text-scale)); }

  .profile-header-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    width: 100%;
  }

  .profile-icon-btn {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: none;
    background: var(--chip-bg);
    font-size: calc(18px * var(--text-scale));
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .profile-icon-badge {
    position: absolute;
    top: 3px;
    inset-inline-end: 3px;
    min-width: 15px;
    height: 15px;
    padding: 0 3px;
    border-radius: 999px;
    background: var(--danger);
    color: #fff;
    font-size: calc(10px * var(--text-scale));
    font-weight: 700;
    line-height: 15px;
    text-align: center;
  }

  .profile-avatar-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .profile-avatar {
    width: 84px;
    height: 84px;
    border-radius: 999px;
    background: var(--chip-bg) center/cover no-repeat;
    border: 1px solid var(--line);
  }

  .profile-username {
    font-family: "Suez One", "Heebo", serif;
    font-size: calc(18px * var(--text-scale));
    color: var(--ink);
  }

  .profile-stats-row {
    display: flex;
    gap: 28px;
    margin-top: 4px;
  }

  .profile-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 4px;
  }

  .profile-stat b {
    font-size: calc(16px * var(--text-scale));
    font-weight: 700;
    color: var(--ink);
  }

  .profile-stat span {
    font-size: calc(12px * var(--text-scale));
    color: var(--ink-faint);
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    background: none;
    border-inline: none;
    border-top: none;
    text-align: inherit;
    cursor: pointer;
  }

  .user-row-avatar {
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 999px;
    background: var(--chip-bg) center/cover no-repeat;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(16px * var(--text-scale));
  }

  .user-row-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .user-row-name {
    font-weight: 600;
    font-size: calc(14.5px * var(--text-scale));
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .user-row-sub {
    font-size: calc(12.5px * var(--text-scale));
    color: var(--ink-faint);
  }

  .follow-btn {
    flex: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-weight: 700;
    font-size: calc(13px * var(--text-scale));
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }

  .follow-btn.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .follow-btn.danger {
    color: var(--danger);
    border-color: var(--danger);
    background: none;
  }

  .locked-profile {
    text-align: center;
    padding: 32px 20px;
    color: var(--ink-soft);
  }

  .locked-profile .lock-emoji {
    font-size: calc(34px * var(--text-scale));
    display: block;
    margin-bottom: 10px;
  }

  .profile-view-list {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .profile-view-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    font-size: calc(14px * var(--text-scale));
  }

  .profile-view-item span { color: var(--ink-faint); }
  .profile-view-item b { color: var(--ink); font-weight: 600; }

  .quiz-option.static { cursor: default; }

  .settings-list {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 16px 2px;
    border: none;
    border-bottom: 1px solid var(--line);
    background: none;
    color: var(--ink);
    font-family: inherit;
    font-size: calc(14.5px * var(--text-scale));
    text-align: inherit;
  }

  .settings-row--nav { cursor: pointer; }
  .settings-row--stack { flex-wrap: wrap; }

  .settings-chevron {
    color: var(--ink-faint);
    font-size: calc(18px * var(--text-scale));
  }

  .settings-select {
    height: 40px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: calc(14px * var(--text-scale));
    cursor: pointer;
  }

  .quiz-option.compact {
    padding: 8px 12px;
    font-size: calc(13px * var(--text-scale));
  }

  .signout-row {
    margin-top: 24px;
    width: 100%;
    height: 46px;
    border: 1px solid var(--danger);
    border-radius: 12px;
    background: none;
    color: var(--danger);
    font-family: inherit;
    font-weight: 700;
    font-size: calc(14.5px * var(--text-scale));
    cursor: pointer;
  }

  .settings-back {
    align-self: flex-start;
    border: none;
    background: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: calc(13px * var(--text-scale));
    font-weight: 600;
    cursor: pointer;
    padding: 4px;
    margin-bottom: 6px;
  }

  .quiz-add-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .quiz-add-row input {
    flex: 1;
    height: 42px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: calc(14px * var(--text-scale));
    outline: none;
  }

  .quiz-add-btn {
    flex: 0 0 auto;
    height: 42px;
    padding: 0 18px;
  }

  .quiz-skip {
    display: block;
    margin: 0 auto;
    border: none;
    background: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: calc(13px * var(--text-scale));
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .search-bar {
    position: relative;
    width: 100%;
  }

  .search-bar .search-ic {
    position: absolute;
    inset-inline-start: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    stroke: var(--ink-faint);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .search-bar input {
    width: 100%;
    height: 44px;
    padding-inline-start: 40px;
    padding-inline-end: 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: calc(14.5px * var(--text-scale));
    outline: none;
  }

  .search-bar input::placeholder { color: var(--ink-faint); }
  .search-bar input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip-row {
    display: flex;
    gap: 8px;
    width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .chip-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: calc(13px * var(--text-scale));
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .chip[aria-pressed="true"] {
    background: var(--chip-color, var(--accent));
    border-color: var(--chip-color, var(--accent));
    color: #fff;
  }

  .chip-row--topics .chip { font-weight: 500; font-size: calc(12.5px * var(--text-scale)); padding: 6px 12px; }

  .stage {
    position: relative;
    width: 100%;
    display: flex;

    list.filter(a => a.category === cat).forEach(a => (a.topics || []).forEach(t => set.add(t)));
    return [...set];
  }

  function renderCategoryChips() {
    const chips = [{ key: null, label: L().chipAll }, ...CATEGORY_ORDER.map(c => ({ key: c, label: L().categories[c] || c, color: CATEGORY_COLOR[c] }))];
    categoryChipsEl.innerHTML = chips.map(c => `
      <button type="button" class="chip" aria-pressed="${state.category === c.key}" data-cat="${c.key ?? ""}"${c.color ? ` style="--chip-color:${c.color}"` : ""}>${c.label}</button>
    `).join("");
  }

  function renderTopicChips() {
    const topics = state.category ? topicsForCategory(activities, state.category) : [];
    if (!topics.length) {
      topicChipsEl.hidden = true;
      topicChipsEl.innerHTML = "";
      return;
    }
    topicChipsEl.hidden = false;
    const chips = [{ key: null, label: L().topicsAllChip }, ...topics.map(t => ({ key: t, label: t }))];
    topicChipsEl.innerHTML = chips.map(c => `
      <button type="button" class="chip" aria-pressed="${state.topic === c.key}" data-topic="${c.key ?? ""}">${c.label}</button>
    `).join("");
  }

  function clearFilters() {
    state.q = ""; state.category = null; state.topic = null;
    searchInput.value = "";
    index = 0;
    renderCategoryChips();
    renderTopicChips();
    render();
  }

  function activityDetailHtml(a) {
    const when = whenText(a);
    const cta = ctaInfo(a);
    const canFavorite = !isGuestMode() && a.id;
    const isFav = a.id && favoriteIds.has(a.id);
    return `
      <div class="kind-row">
        <div class="kind-row-left">
          <span class="kind-badge">${kindLabel(a)}</span>
          <span class="category-label">${L().categories[a.category] || a.category}</span>
        </div>
        ${canFavorite ? `<button type="button" class="fav-star-btn" data-fav-id="${a.id}" aria-pressed="${isFav}" aria-label="${isFav ? L().unfavoriteLabel : L().favoriteLabel}">${isFav ? "⭐" : "☆"}</button>` : ""}
      </div>
      <h1>${a.title}</h1>
      <p class="short-desc">${a.short_description || ""}</p>
      <div class="facts">
        <div class="fact">
          <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <div><b>${when.main}</b><br><span class="sub">${when.sub}</span></div>
        </div>
        <div class="fact">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <div><b>${a.location_name}</b>${a.neighborhood ? `<br><span class="sub">${a.neighborhood}</span>` : ""}</div>
        </div>
        <div class="fact">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.3 14.2c2.9.4 4.7 2.4 4.7 5.8"/></svg>
          <div><b>${ageText(a)}</b></div>
        </div>
        <div class="fact">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 2v20M17 6.5c0-1.9-2.2-3.5-5-3.5s-5 1.6-5 3.5S9.2 10 12 10s5 1.6 5 3.5-2.2 3.5-5 3.5-5-1.6-5-3.5"/></svg>
          <div><b>${priceText(a)}</b>${a.capacity ? `<br><span class="sub">נותרו ${a.spots_left ?? "—"} מתוך ${a.capacity} מקומות</span>` : ""}</div>
        </div>
      </div>
      <p class="desc">${a.description}</p>
      <div class="cta-row">
        ${cta.href
          ? `<a class="cta ${cta.kind === "secondary" ? "secondary" : ""}" href="${cta.href}" target="_blank" rel="noopener">${cta.label}</a>`
          : `<span class="cta disabled">${cta.label}</span>`}
      </div>
    `;
  }

  function render() {
    const list = visibleActivities();
    stageEl.classList.toggle("is-empty", list.length === 0);

    if (!list.length) {
      cardEl.classList.add("is-empty");
      cardEl.innerHTML = `
        <p>${L().emptyStateMsg}</p>
        <button type="button" class="clear-btn" id="clearFiltersBtn">${L().clearFiltersBtn}</button>
      `;
      document.getElementById("clearFiltersBtn").addEventListener("click", clearFilters);
      dotsEl.innerHTML = "";
      counterEl.textContent = "";
      return;
    }

    if (index >= list.length) index = 0;
    const a = list[index];
    const color = CATEGORY_COLOR[a.category] || "var(--accent)";

    cardEl.classList.remove("is-empty");
    cardEl.style.setProperty("--cat-color", color);
    cardEl.classList.remove("fade-in");
    void cardEl.offsetWidth;
    cardEl.classList.add("fade-in");

    cardEl.innerHTML = activityDetailHtml(a);
    const favBtn = cardEl.querySelector(".fav-star-btn");
    if (favBtn) favBtn.addEventListener("click", () => toggleFavorite(favBtn.dataset.favId));

    dotsEl.innerHTML = list.map((_, i) =>
      `<button aria-current="${i === index}" aria-label="עבור לפעילות ${i + 1}" data-i="${i}"></button>`
    ).join("");
    counterEl.textContent = `${index + 1} מתוך ${list.length}`;
  }

  function go(delta) {
    const list = visibleActivities();
    if (!list.length) return;
    index = (index + delta + list.length) % list.length;
    render();
  }

  document.getElementById("btnRight").addEventListener("click", () => go(-1));
  document.getElementById("btnLeft").addEventListener("click", () => go(1));
  dotsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-i]");
    if (btn) { index = Number(btn.dataset.i); render(); }
  });

  categoryChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-cat]");
    if (!btn) return;
    const val = btn.dataset.cat || null;
    state.category = state.category === val ? null : val;
    state.topic = null;
    index = 0;
    renderCategoryChips();
    renderTopicChips();
    render();
  });

  topicChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-topic]");
    if (!btn) return;
    const val = btn.dataset.topic || null;
    state.topic = state.topic === val ? null : val;
    index = 0;
    renderTopicChips();
    render();
  });

  searchInput.addEventListener("input", (e) => {
    state.q = e.target.value.trim();
    index = 0;
    render();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") go(1);
    if (e.key === "ArrowRight") go(-1);
  });

  let touchX = null;
  stageEl.addEventListener("touchstart", (e) => {
    touchX = e.touches[0].clientX;
  }, { passive: true });
  stageEl.addEventListener("touchend", (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) go(dx > 0 ? -1 : 1);
    touchX = null;
  });

  function initAppUI() {
    renderCategoryChips();
    renderTopicChips();
    render();
  }

  // ---- Favorites ----
  async function loadFavorites() {
    favoriteIds = new Set();
    favoritedAt = new Map();
    if (isGuestMode() || !currentUserId) return;
    const { data } = await sb.from("favorites").select("activity_id, created_at").eq("user_id", currentUserId);
    (data || []).forEach(row => {
      favoriteIds.add(row.activity_id);
      favoritedAt.set(row.activity_id, row.created_at);
    });
  }

  async function toggleFavorite(activityId) {
    if (!currentUserId) return;
    const wasFav = favoriteIds.has(activityId);
    if (wasFav) { favoriteIds.delete(activityId); favoritedAt.delete(activityId); }
    else { favoriteIds.add(activityId); favoritedAt.set(activityId, new Date().toISOString()); }
    refreshFavoriteAffectedUI();
    try {
      const { error } = wasFav
        ? await sb.from("favorites").delete().eq("user_id", currentUserId).eq("activity_id", activityId)
        : await sb.from("favorites").insert({ user_id: currentUserId, activity_id: activityId });
      if (error) throw error;
    } catch (err) {
      if (wasFav) { favoriteIds.add(activityId); favoritedAt.set(activityId, new Date().toISOString()); }
      else { favoriteIds.delete(activityId); favoritedAt.delete(activityId); }
      refreshFavoriteAffectedUI();
      console.error(err);
    }
  }

  function refreshFavoriteAffectedUI() {
    if (appStarted && !appRootEl.hidden) render();
    if (!favoritesScreenEl.hidden) renderFavorites();
    if (!favDetailOverlayEl.hidden) renderFavDetailOverlay();
  }

  function baseFavorites() {
    return activities.filter(a => a.id && favoriteIds.has(a.id));
  }

  function visibleFavorites() {
    return baseFavorites().filter(a =>
      matchesQuery(a, favState.q) &&
      (!favState.category || a.category === favState.category) &&
      (!favState.topic || (a.topics || []).includes(favState.topic))
    );
  }

  function activityTimestamp(a) {
    const t = new Date(`${a.start_date}T${a.start_time || "00:00:00"}`).getTime();
    return Number.isNaN(t) ? Infinity : t;
  }

  function activityStatusInfo(a) {
    const status = a.status || "open";
    return { status, label: L().activityStatus[status] || status };
  }

  function sortFavorites(list, sortKey) {
    const collator = new Intl.Collator(LOCALE_TAG[currentLang] || "he-IL");
    const sorted = [...list];
    if (sortKey === "recent") sorted.sort((a, b) => new Date(favoritedAt.get(b.id) || 0) - new Date(favoritedAt.get(a.id) || 0));
    else if (sortKey === "category") sorted.sort((a, b) => CATEGORY_ORDER.indexOf(a.category) - CATEGORY_ORDER.indexOf(b.category) || collator.compare(a.title, b.title));
    else if (sortKey === "name") sorted.sort((a, b) => collator.compare(a.title, b.title));
    else sorted.sort((a, b) => activityTimestamp(a) - activityTimestamp(b));
    return sorted;
  }

  function favRowHtml(a, opts) {
    const readOnly = opts && opts.readOnly;
    const when = whenText(a);
    const statusInfo = activityStatusInfo(a);
    return `
      <div class="fav-row" role="button" tabindex="0" data-open-id="${a.id}">
        <div class="fav-row-main">
          <div class="fav-row-top">
            <span class="category-label">${L().categories[a.category] || a.category}</span>
            <span class="fav-status-badge fav-status-${statusInfo.status}">${statusInfo.label}</span>
          </div>
          <h3 class="fav-row-title">${a.title}</h3>
          <p class="fav-row-meta">${when.main} · ${when.sub}</p>
          <p class="fav-row-meta">${a.location_name}${a.neighborhood ? " · " + a.neighborhood : ""}</p>
          ${a.capacity != null ? `<p class="fav-row-meta">${L().spotsLeftText(a.spots_left ?? 0, a.capacity)}</p>` : ""}
        </div>
        ${readOnly ? "" : `<button type="button" class="fav-star-btn" data-fav-id="${a.id}" aria-pressed="true" aria-label="${L().unfavoriteLabel}">⭐</button>`}
      </div>
    `;
  }

  function clearFavFilters() {
    favState.q = ""; favState.category = null; favState.topic = null;
    favSearchInputEl.value = "";
    renderFavorites();
  }

  function renderFavorites() {
    const all = baseFavorites();

    if (!all.length) {
      document.getElementById("favFiltersWrap").hidden = true;
      favListEl.innerHTML = `
        <div class="fav-empty">
          <p>${L().favEmptyNoFavoritesMsg}</p>
          <button type="button" class="clear-btn" id="favGoHomeBtn">${L().favEmptyNoFavoritesCta}</button>
        </div>
      `;
      document.getElementById("favGoHomeBtn").addEventListener("click", () => showApp(userProfile?.username || null));
      return;
    }

    document.getElementById("favFiltersWrap").hidden = false;

    const categoriesPresent = new Set(all.map(a => a.category));
    if (favState.category && !categoriesPresent.has(favState.category)) {
      favState.category = null;
      favState.topic = null;
    }

    const favCategoryOrder = CATEGORY_ORDER.filter(c => categoriesPresent.has(c));
    const catChips = [{ key: null, label: L().chipAll }, ...favCategoryOrder.map(c => ({ key: c, label: L().categories[c] || c, color: CATEGORY_COLOR[c] }))];
    favCategoryChipsEl.innerHTML = catChips.map(c => `
      <button type="button" class="chip" aria-pressed="${favState.category === c.key}" data-cat="${c.key ?? ""}"${c.color ? ` style="--chip-color:${c.color}"` : ""}>${c.label}</button>
    `).join("");

    const topics = favState.category ? topicsForCategory(all, favState.category) : [];
    if (!topics.length) {
      favTopicChipsEl.hidden = true;
      favTopicChipsEl.innerHTML = "";
    } else {
      favTopicChipsEl.hidden = false;
      const topicChips = [{ key: null, label: L().topicsAllChip }, ...topics.map(t => ({ key: t, label: t }))];
      favTopicChipsEl.innerHTML = topicChips.map(c => `
        <button type="button" class="chip" aria-pressed="${favState.topic === c.key}" data-topic="${c.key ?? ""}">${c.label}</button>
      `).join("");
    }

    favSortSelectEl.innerHTML = [
      ["soonest", L().favSortSoonest], ["recent", L().favSortRecent],
      ["category", L().favSortCategory], ["name", L().favSortName]
    ].map(([v, label]) => `<option value="${v}" ${favState.sort === v ? "selected" : ""}>${label}</option>`).join("");

    const list = sortFavorites(visibleFavorites(), favState.sort);
    if (!list.length) {
      favListEl.innerHTML = `
        <div class="fav-empty">
          <p>${L().emptyStateMsg}</p>
          <button type="button" class="clear-btn" id="favClearFiltersBtn">${L().clearFiltersBtn}</button>
        </div>
      `;
      document.getElementById("favClearFiltersBtn").addEventListener("click", clearFavFilters);
      return;
    }

    favListEl.innerHTML = list.map(favRowHtml).join("");
  }

  favSearchInputEl.addEventListener("input", (e) => {
    favState.q = e.target.value.trim();
    renderFavorites();
  });

  favCategoryChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-cat]");
    if (!btn) return;
    const val = btn.dataset.cat || null;
    favState.category = favState.category === val ? null : val;
    favState.topic = null;
    renderFavorites();
  });

  favTopicChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-topic]");
    if (!btn) return;
    const val = btn.dataset.topic || null;
    favState.topic = favState.topic === val ? null : val;
    renderFavorites();
  });

  favSortRowEl.addEventListener("change", (e) => {
    if (e.target.id !== "favSortSelect") return;
    favState.sort = e.target.value;
    renderFavorites();
  });

  favListEl.addEventListener("click", (e) => {
    const starBtn = e.target.closest(".fav-star-btn");
    if (starBtn) { toggleFavorite(starBtn.dataset.favId); return; }
    const row = e.target.closest(".fav-row[data-open-id]");
    if (row) openFavDetail(row.dataset.openId);
  });

  favListEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest(".fav-row[data-open-id]");
    if (!row) return;
    e.preventDefault();
    openFavDetail(row.dataset.openId);
  });

  function openFavDetail(id) {
    favDetailOpenId = id;
    renderFavDetailOverlay();
    favDetailOverlayEl.hidden = false;
  }

  function closeFavDetail() {
    favDetailOpenId = null;
    favDetailOverlayEl.hidden = true;
    favDetailCardEl.innerHTML = "";
  }

  function renderFavDetailOverlay() {
    if (!favDetailOpenId) return;
    const a = activities.find(x => x.id === favDetailOpenId);
    if (!a) { closeFavDetail(); return; }
    favDetailCardEl.style.setProperty("--cat-color", CATEGORY_COLOR[a.category] || "var(--accent)");
    favDetailCardEl.innerHTML = activityDetailHtml(a);
    const favBtn = favDetailCardEl.querySelector(".fav-star-btn");
    if (favBtn) favBtn.addEventListener("click", () => toggleFavorite(favBtn.dataset.favId));
  }

  favDetailCloseBtnEl.addEventListener("click", closeFavDetail);
  favDetailBackdropEl.addEventListener("click", closeFavDetail);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !favDetailOverlayEl.hidden) closeFavDetail();
  });

  function showFavorites() {
    appRootEl.hidden = true;
    profileScreenEl.hidden = true;
    settingsScreenEl.hidden = true;
    accessibilityScreenEl.hidden = true;
    notificationsScreenEl.hidden = true;
    userSearchScreenEl.hidden = true;
    otherProfileScreenEl.hidden = true;
    followListScreenEl.hidden = true;
    favoritesScreenEl.hidden = false;
    bottomNavEl.hidden = false;
    setActiveTab("favorites");
    renderFavorites();
  }

  // ---- Social (follow system) ----
  // Note on scope: profile-picture/detail privacy is enforced here only at the UI
  // layer (we simply don't fetch/render a photo or the favorites list when the
  // viewer isn't allowed to see them). The `avatars` storage bucket is already
  // fully public-read regardless of any flag, and Postgres RLS can't hide one
  // column while exposing others on the same `users` row — real hardening would
  // need a private bucket with signed URLs and/or a dedicated view. Not done here.

  async function getRelationship(otherUserId) {
    if (!currentUserId || otherUserId === currentUserId) return null;
    const { data } = await sb.from("follows").select("status")
      .eq("follower_id", currentUserId).eq("followee_id", otherUserId).maybeSingle();
    return data ? data.status : null;
  }

  async function followUser(otherUserId, otherIsPrivate) {
    if (!currentUserId) return;
    const { error } = await sb.from("follows").insert({
      follower_id: currentUserId,
      followee_id: otherUserId,
      status: otherIsPrivate ? "pending" : "accepted"
    });
    if (error) console.error(error);
  }

  async function unfollowOrCancel(otherUserId) {
    if (!currentUserId) return;
    const { error } = await sb.from("follows").delete()
      .eq("follower_id", currentUserId).eq("followee_id", otherUserId);
    if (error) console.error(error);
  }

  async function approveRequest(followerId) {
    if (!currentUserId) return;
    const { error } = await sb.from("follows").update({ status: "accepted" })
      .eq("follower_id", followerId).eq("followee_id", currentUserId);
    if (error) console.error(error);
  }

  async function denyOrRemove(followerId) {
    if (!currentUserId) return;
    const { error } = await sb.from("follows").delete()
      .eq("follower_id", followerId).eq("followee_id", currentUserId);
    if (error) console.error(error);
  }

  function canViewProfile(targetUser, relationship) {
    if (!targetUser) return false;
    return targetUser.id === currentUserId || targetUser.is_private === false || relationship === "accepted";
  }

  async function loadFavoritesFor(userId) {
    const { data } = await sb.from("favorites").select("activity_id").eq("user_id", userId);
    const ids = new Set((data || []).map(r => r.activity_id));
    return activities.filter(a => a.id && ids.has(a.id));
  }

  async function loadSocialCounts(userId) {
    const [followersRes, followingRes, pendingRes] = await Promise.all([
      sb.from("follows").select("id", { count: "exact", head: true }).eq("followee_id", userId).eq("status", "accepted"),
      sb.from("follows").select("id", { count: "exact", head: true }).eq("follower_id", userId).eq("status", "accepted"),
      userId === currentUserId
        ? sb.from("follows").select("id", { count: "exact", head: true }).eq("followee_id", userId).eq("status", "pending")
        : Promise.resolve({ count: 0 })
    ]);
    return { followers: followersRes.count || 0, following: followingRes.count || 0, pending: pendingRes.count || 0 };
  }

  async function searchUsers(query) {
    if (!query) return [];
    const { data } = await sb.from("users")
      .select("id, username, avatar_url, is_private")
      .ilike("username", query + "%")
      .neq("id", currentUserId)
      .limit(20);
    const rows = data || [];
    if (!rows.length) return rows;
    const ids = rows.map(r => r.id);
    const { data: rel } = await sb.from("follows").select("followee_id, status")
      .eq("follower_id", currentUserId).in("followee_id", ids);
    const relMap = new Map((rel || []).map(r => [r.followee_id, r.status]));
    return rows.map(r => ({ ...r, relationship: relMap.get(r.id) || null }));
  }

  function userAvatarStyle(u) {
    return !u.is_private && u.avatar_url ? `background-image:url('${u.avatar_url}')` : "";
  }

  function followBtnHtml(userId, isPrivate, relationship) {
    if (relationship === "accepted") {
      return `<button type="button" class="follow-btn" data-unfollow="${userId}">${L().followingBtn}</button>`;
    }
    if (relationship === "pending") {
      return `<button type="button" class="follow-btn" data-unfollow="${userId}">${L().requestedBtn}</button>`;
    }
    return `<button type="button" class="follow-btn primary" data-follow="${userId}" data-private="${!!isPrivate}">${L().followBtn}</button>`;
  }

  function userRowHtml(u, actionHtml) {
    return `
      <div class="user-row" data-open-user="${u.id}">
        <div class="user-row-avatar" style="${userAvatarStyle(u)}"></div>
        <div class="user-row-main"><span class="user-row-name">${u.username}${u.is_private ? " 🔒" : ""}</span></div>
        ${actionHtml}
      </div>
    `;
  }

  // ---- Notifications (follow requests inbox today; the shape can grow to
  // other notification types later without a redesign — no generic
  // notifications table yet since there's exactly one live-queryable type) ----
  function showNotifications() {
    appRootEl.hidden = true;
    favoritesScreenEl.hidden = true;
    profileScreenEl.hidden = true;
    settingsScreenEl.hidden = true;
    accessibilityScreenEl.hidden = true;
    userSearchScreenEl.hidden = true;
    otherProfileScreenEl.hidden = true;
    followListScreenEl.hidden = true;
    notificationsScreenEl.hidden = false;
    bottomNavEl.hidden = false;
    renderNotifications();
  }

  async function renderNotifications() {
    const t = L();
    notificationsContentEl.innerHTML = `
      <button type="button" class="settings-back" id="notifBack">${LANG_DIR[currentLang] === "rtl" ? "› " + t.profileTitle : "‹ " + t.profileTitle}</button>
      <h1 class="quiz-title">${t.notificationsLabel}</h1>
      <div id="notifList"><p class="quiz-subtitle">…</p></div>
    `;
    document.getElementById("notifBack").addEventListener("click", showProfile);
    const listEl = document.getElementById("notifList");
    if (!currentUserId) { listEl.innerHTML = ""; return; }
    const { data: pendingRows } = await sb.from("follows").select("follower_id, created_at")
      .eq("followee_id", currentUserId).eq("status", "pending").order("created_at", { ascending: false });
    const rows = pendingRows || [];
    if (!rows.length) { listEl.innerHTML = `<p class="quiz-subtitle">${t.noRequestsMsg}</p>`; return; }
    const ids = rows.map(r => r.follower_id);
    const { data: users } = await sb.from("users").select("id, username, avatar_url, is_private").in("id", ids);
    const usersById = new Map((users || []).map(u => [u.id, u]));
    listEl.innerHTML = rows.map(r => {
      const u = usersById.get(r.follower_id);
      if (!u) return "";
      return userRowHtml(u, `
        <div style="display:flex;gap:6px">

    if (denyBtn) { await denyOrRemove(denyBtn.dataset.deny); renderNotifications(); return; }

  function showUserSearch() {

    notificationsScreenEl.hidden = true;
    otherProfileScreenEl.hidden = true;
    followListScreenEl.hidden = true;
    userSearchScreenEl.hidden = false;
    bottomNavEl.hidden = false;
    userSearchState.q = "";
    renderUserSearch();
  }

  function renderUserSearch() {
    const t = L();
    userSearchContentEl.innerHTML = `
      <button type="button" class="settings-back" id="usBack">${LANG_DIR[currentLang] === "rtl" ? "› " + t.profileTitle : "‹ " + t.profileTitle}</button>
      <h1 class="quiz-title">${t.searchUsersLabel}</h1>
      <div class="search-bar">
        <svg class="search-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="usInput" placeholder="${t.userSearchPlaceholder}">
      </div>
      <div id="usResults"></div>
    `;
    document.getElementById("usBack").addEventListener("click", showProfile);
    const input = document.getElementById("usInput");
    input.addEventListener("input", async (e) => {
      const q = e.target.value.trim();
      userSearchState.q = q;
      const results = q ? await searchUsers(q) : [];
      // Guard against out-of-order responses: only render if this request's own
      // query is still the current one (a later keystroke may have resolved first).
      if (userSearchState.q === q) renderUserSearchResults(results);
    });
    input.focus();
    renderUserSearchResults([]);
  }

  function renderUserSearchResults(results) {
    const t = L();
    const el = document.getElementById("usResults");
    if (!el) return;
    if (!userSearchState.q) { el.innerHTML = ""; return; }
    if (!results.length) { el.innerHTML = `<p class="quiz-subtitle">${t.noUsersFoundMsg}</p>`; return; }
    el.innerHTML = results.map(u => userRowHtml(u, followBtnHtml(u.id, u.is_private, u.relationship))).join("");
  }

  userSearchContentEl.addEventListener("click", async (e) => {
    const followBtn = e.target.closest("[data-follow]");
    if (followBtn) {
      await followUser(followBtn.dataset.follow, followBtn.dataset.private === "true");
      renderUserSearchResults(await searchUsers(userSearchState.q));
      return;
    }
    const unfollowBtn = e.target.closest("[data-unfollow]");
    if (unfollowBtn) {
      await unfollowOrCancel(unfollowBtn.dataset.unfollow);
      renderUserSearchResults(await searchUsers(userSearchState.q));
      return;
    }
    const row = e.target.closest("[data-open-user]");
    if (row) showOtherProfile(row.dataset.openUser);
  });

  // ---- Other user's profile ----
  function showOtherProfile(userId) {
    if (userId === currentUserId) { showProfile(); return; }
    appRootEl.hidden = true;
    favoritesScreenEl.hidden = true;
    profileScreenEl.hidden = true;
    settingsScreenEl.hidden = true;
    accessibilityScreenEl.hidden = true;
    notificationsScreenEl.hidden = true;
    userSearchScreenEl.hidden = true;
    followListScreenEl.hidden = true;
    otherProfileScreenEl.hidden = false;
    bottomNavEl.hidden = false;
    otherProfileUserId = userId;
    renderOtherProfile();
  }

  async function renderOtherProfile() {
    const t = L();
    const userId = otherProfileUserId;
    otherProfileContentEl.innerHTML = `<p class="quiz-subtitle">…</p>`;
    const [{ data: targetUser }, relationship, counts] = await Promise.all([
      sb.from("users").select("id, username, avatar_url, is_private").eq("id", userId).maybeSingle(),
      getRelationship(userId),
      loadSocialCounts(userId)
    ]);
    if (otherProfileUserId !== userId) return; // navigated away while loading
    if (!targetUser) { otherProfileContentEl.innerHTML = `<p class="quiz-subtitle">${t.noUsersFoundMsg}</p>`; return; }
    const visible = canViewProfile(targetUser, relationship);
    const avatarStyle = visible && targetUser.avatar_url ? `background-image:url('${targetUser.avatar_url}')` : "";

    let bodyHtml;
    if (visible) {
      const favs = await loadFavoritesFor(userId);
      if (otherProfileUserId !== userId) return;
      bodyHtml = `
        <p class="quiz-section-label">${t.favoritesOfUser(targetUser.username)}</p>
        ${favs.length ? favs.map(a => favRowHtml(a, { readOnly: true })).join("") : `<p class="quiz-subtitle">${t.noFavoritesForUserMsg}</p>`}
      `;
    } else {
      bodyHtml = `<div class="locked-profile"><span class="lock-emoji">🔒</span><p>${t.lockedProfileMsg}</p></div>`;
    }

    otherProfileContentEl.innerHTML = `
      <button type="button" class="settings-back" id="opBack">${LANG_DIR[currentLang] === "rtl" ? "› " + t.profileTitle : "‹ " + t.profileTitle}</button>
      <div class="profile-avatar-row">
        <div class="profile-avatar" style="${avatarStyle}"></div>
        <div class="profile-username">${targetUser.username}${targetUser.is_private ? " 🔒" : ""}</div>
        <div class="profile-stats-row">
          ${visible
            ? `<button type="button" class="profile-stat" data-open-follow-list="followers"><b>${counts.followers}</b><span>${t.followersLabel}</span></button>
               <button type="button" class="profile-stat" data-open-follow-list="following"><b>${counts.following}</b><span>${t.followingLabel}</span></button>`
            : `<span class="profile-stat"><b>${counts.followers}</b><span>${t.followersLabel}</span></span>
               <span class="profile-stat"><b>${counts.following}</b><span>${t.followingLabel}</span></span>`}
        </div>
        ${followBtnHtml(targetUser.id, targetUser.is_private, relationship)}
      </div>
      ${bodyHtml}
    `;
    document.getElementById("opBack").addEventListener("click", () => { otherProfileUserId = null; showProfile(); });
  }

  otherProfileContentEl.addEventListener("click", async (e) => {
    const followBtn = e.target.closest("[data-follow]");
    if (followBtn) { await followUser(followBtn.dataset.follow, followBtn.dataset.private === "true"); renderOtherProfile(); return; }
    const unfollowBtn = e.target.closest("[data-unfollow]");

  async function renderFollowList() {
    const t = L();
    const kind = followListKind, userId = followListUserId;
    followListContentEl.innerHTML = `
      <button type="button" class="settings-back" id="flBack">${LANG_DIR[currentLang] === "rtl" ? "› " + t.profileTitle : "‹ " + t.profileTitle}</button>
      <div class="seg" id="flSeg">

      </div>
      <div id="flList"><p class="quiz-subtitle">…</p></div>
    `;
    document.getElementById("flBack").addEventListener("click", () => {
      if (userId === currentUserId) showProfile(); else showOtherProfile(userId);
    });
    const filterCol = kind === "followers" ? "followee_id" : "follower_id";
    const targetCol = kind === "followers" ? "follower_id" : "followee_id";
    const { data: relRows } = await sb.from("follows").select(targetCol).eq(filterCol, userId).eq("status", "accepted");
    if (followListUserId !== userId || followListKind !== kind) return;
    const ids = (relRows || []).map(r => r[targetCol]);
    if (!ids.length) { renderFollowListRows([]); return; }
    const { data: users } = await sb.from("users").select("id, username, avatar_url, is_private").in("id", ids);
    if (followListUserId !== userId || followListKind !== kind) return;
    renderFollowListRows(users || []);
  }

  async function renderFollowListRows(users) {
    const t = L();
    const el = document.getElementById("flList");
    if (!el) return;
    if (!users.length) {
      el.innerHTML = `<p class="quiz-subtitle">${followListKind === "followers" ? t.noFollowersMsg : t.noFollowingMsg}</p>`;
      return;
    }
    const isOwnFollowers = followListKind === "followers" && followListUserId === currentUserId;
    let relMap = new Map();
    if (!isOwnFollowers) {
      const ids = users.map(u => u.id);
      const { data: rel } = await sb.from("follows").select("followee_id, status")
        .eq("follower_id", currentUserId).in("followee_id", ids);
      relMap = new Map((rel || []).map(r => [r.followee_id, r.status]));
    }
    el.innerHTML = users.map(u => userRowHtml(u, isOwnFollowers
      ? `<button type="button" class="follow-btn danger" data-remove-follower="${u.id}">${t.removeFollowerBtn}</button>`
      : followBtnHtml(u.id, u.is_private, relMap.get(u.id) || null))).join("");
  }

  });

  let currentLang = localStorage.getItem("mb_lang") || "he";
  function L() { return STRINGS[currentLang]; }

  function applyDocLang() {
    document.documentElement.lang = currentLang;
    document.documentElement.dir = LANG_DIR[currentLang];
  }

  function applyStaticText() {
    const t = L();
    document.getElementById("authTitleText").textContent = t.appTitle;
    document.getElementById("authTaglineText").textContent = t.appTagline;
    document.getElementById("tabLogin").textContent = t.tabLogin;
    document.getElementById("tabSignup").textContent = t.tabSignup;
    document.getElementById("authUsernameLabel").textContent = t.usernameLabel;
    document.getElementById("authPasswordLabel").textContent = t.passwordLabel;
    document.getElementById("authSubmit").textContent = authMode === "signup" ? t.tabSignup : t.tabLogin;
    document.getElementById("authOrText").textContent = t.or;
    document.getElementById("guestBtn").textContent = t.guestBtn;
    document.getElementById("guestExitBtn").textContent = t.guestExitBtn;
    document.getElementById("navHomeLabel").textContent = t.homeTab;
    document.getElementById("navFavoritesLabel").textContent = t.favoritesBtn;
    document.getElementById("navProfileLabel").textContent = t.profileBtn;
    document.getElementById("navSettingsLabel").textContent = t.settingsBtn;
    document.getElementById("eyebrowTitle").textContent = t.appTitle;
    document.getElementById("eyebrowSubText").textContent = t.eyebrowSub;
    document.getElementById("searchInput").placeholder = t.searchPlaceholder;
    document.getElementById("noteTextEl").textContent = t.noteText;
    document.getElementById("favoritesTitleText").textContent = t.favoritesTitle;
    document.getElementById("favSearchInput").placeholder = t.searchPlaceholder;
    document.getElementById("favSortLabel").textContent = t.favSortLabel;
    document.getElementById("favDetailCloseBtn").setAttribute("aria-label", t.favDetailCloseLabel);
  }

  function applyTheme(pref) {
    const root = document.documentElement;
    if (pref === "light" || pref === "dark") root.setAttribute("data-theme", pref);
    else root.removeAttribute("data-theme");

      applyTheme(userProfile.theme_pref || "system");
      applyTextSize(userProfile.text_size || "medium");

  function usernameToEmail(username) {
    return username.trim().toLowerCase().replace(/\s+/g, "_") + "@mahbaim.app";

  function setAuthMode(mode) {
    authMode = mode;
    tabLoginEl.setAttribute("aria-selected", mode === "login");

    authSubmitEl.textContent = mode === "login" ? L().tabLogin : L().tabSignup;

    quizScreenEl.hidden = true;

  // Registered users (login or signup) answer the onboarding questionnaire
  // exactly once; guests skip it entirely, since guest data is never collected.
  async function proceedAfterAuth(userId, greetingName) {
    await loadAndApplyProfile(userId);
    await loadFavorites();
    // On a fresh page load, showApp()'s first-run initAppUI() renders the card after this
    // point anyway. On a re-login within the same session (sign out -> sign back in without
    // a reload), appStarted is already true and nothing would otherwise refresh stale
    // favorite state onto the Home card / Favorites list, so do it explicitly here.
    if (appStarted) { render(); renderFavorites(); }
    const { data: prefs } = await sb.from("user_preferences").select("user_id").eq("user_id", userId).maybeSingle();
    if (prefs) {
      showApp(greetingName);
    } else {
      showQuiz(userId, greetingName);
    }
  }

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = authUsernameEl.value.trim();
    const password = authPasswordEl.value;
    if (!username || !password) return;

    authSubmitEl.disabled = true;
    authErrorEl.textContent = "";

    try {
      if (authMode === "signup") {
        const email = usernameToEmail(username);
        if (!USERNAME_RE.test(username)) {
          authErrorEl.textContent = L().errUsernameFormat;
          return;
        }
        if (password.length < 6 || password.length > 10) {
          authErrorEl.textContent = L().errPasswordLength;
          return;
        }
        const { data: existing } = await sb.from("users").select("id").eq("username", username).maybeSingle();
        if (existing) {
          authErrorEl.textContent = L().errUsernameTaken;
          return;
        }
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { username, full_name: username } }
        });
        if (error) throw error;
        if (!data.session) {
          authErrorEl.textContent = L().errSignupNeedsVerification;
          return;
        }
        localStorage.removeItem("mb_guest");
        await proceedAfterAuth(data.user.id, username);
      } else {
        const { data: existing } = await sb.from("users").select("email").eq("username", username).maybeSingle();
        if (!existing) throw new Error("not found");
        const { data, error } = await sb.auth.signInWithPassword({ email: existing.email, password });
        if (error) throw error;
        localStorage.removeItem("mb_guest");
        const name = data.user?.user_metadata?.username || username;
        await proceedAfterAuth(data.user.id, name);
      }
    } catch (err) {
      authErrorEl.textContent = authMode === "login" ? L().errLoginFailed : L().errSignupFailed;
    } finally {
      authSubmitEl.disabled = false;
    }
  });

  guestBtnEl.addEventListener("click", () => {
    localStorage.setItem("mb_guest", "1");

    favoriteIds = new Set();
    favoritedAt = new Map();

  });

  guestExitBtnEl.addEventListener("click", doSignOut);

  async function doSignOut() {
    localStorage.removeItem("mb_guest");
    currentUserId = null;
    userProfile = null;
    favoriteIds = new Set();
    favoritedAt = new Map();
    socialCounts = { followers: 0, following: 0, pending: 0 };
    otherProfileUserId = null;
    followListUserId = null;
    closeFavDetail();
    const { data: { session } } = await sb.auth.getSession();
    if (session) await sb.auth.signOut();
    showAuth();
  }

  let profileMode = "view";

    appRootEl.hidden = true;

    };

    return `<div class="quiz-options">${values.map(v => `<span class="quiz-option static" aria-pressed="true">${v}</span>`).join("")}</div>`;
  }

            <button type="button" class="profile-stat" id="pFollowingBtn"><b>${socialCounts.following}</b><span>${t.followingLabel}</span></button>

      document.getElementById("pFollowingBtn").addEventListener("click", () => showFollowList("following", currentUserId));
      return;
    }

    profileContentEl.innerHTML = `
      <div class="profile-header-row">
        <button type="button" class="profile-icon-btn" id="pNotifBtn" aria-label="${t.notificationsLabel}">🔔${socialCounts.pending > 0 ? `<span class="profile-icon-badge">${socialCounts.pending}</span>` : ""}</button>
        <button type="button" class="profile-icon-btn" id="pSearchBtn" aria-label="${t.searchUsersLabel}">🔍</button>
        <button type="button" class="profile-icon-btn" id="pSettingsBtn" aria-label="${t.settingsBtn}">⚙️</button>
      </div>
      <div class="profile-avatar-row">
        <div class="profile-avatar" style="${avatarStyle}"></div>

  async function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file || !currentUserId) return;
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = `${currentUserId}/avatar.${ext}`;
    const { error } = await sb.storage.from("avatars").upload(path, file, { upsert: true });
    if (error) return;
    const { data } = sb.storage.from("avatars").getPublicUrl(path);
    const url = data.publicUrl + "?t=" + Date.now();
    await sb.from("users").update({ avatar_url: url }).eq("id", currentUserId);
    if (userProfile) userProfile.avatar_url = url;
    renderProfile();
  }

  function wireProfileEdit() {
    const t = L();
    document.getElementById("pNotifBtn").addEventListener("click", showNotifications);
    document.getElementById("pSearchBtn").addEventListener("click", showUserSearch);
    document.getElementById("pSettingsBtn").addEventListener("click", showSettings);
    document.getElementById("pCancel").addEventListener("click", () => { profileMode = "view"; showProfile(); });
    document.getElementById("avatarBtn").addEventListener("click", () => document.getElementById("avatarInput").click());
    document.getElementById("avatarInput").addEventListener("change", handleAvatarUpload);
    document.getElementById("pFirstName").addEventListener("input", e => profileState.firstName = e.target.value);
    document.getElementById("pLastName").addEventListener("input", e => profileState.lastName = e.target.value);
    document.getElementById("pAge").addEventListener("change", e => profileState.ageRange = e.target.value || null);
    document.getElementById("pGrade").addEventListener("change", e => {
      const match = t.gradeOptions.find(g => g[1] === e.target.value);
      profileState.grade = match ? match[0] : null;
      profileState.gradeLabel = e.target.value;
    });
    document.getElementById("pArea").addEventListener("change", e => profileState.area = e.target.value || null);
    profileContentEl.querySelectorAll("[data-ptopic]").forEach(btn => btn.addEventListener("click", () => {
      const v = btn.dataset.ptopic;
      const i = profileState.interestTopics.indexOf(v);
      if (i === -1) profileState.interestTopics.push(v); else profileState.interestTopics.splice(i, 1);
      renderProfile();
    }));
    profileContentEl.querySelectorAll("[data-ptopic-remove]").forEach(btn => btn.addEventListener("click", () => {
      profileState.interestTopics = profileState.interestTopics.filter(x => x !== btn.dataset.ptopicRemove);
      renderProfile();
    }));
    document.getElementById("pAddTopicBtn").addEventListener("click", () => {
      const input = document.getElementById("pAddTopic");
      const v = input.value.trim();
      if (v && !profileState.interestTopics.includes(v)) profileState.interestTopics.push(v);
      renderProfile();
    });
    profileContentEl.querySelectorAll("[data-patype]").forEach(btn => btn.addEventListener("click", () => {
      const v = btn.dataset.patype;
      const i = profileState.activityTypes.indexOf(v);
      if (i === -1) profileState.activityTypes.push(v); else profileState.activityTypes.splice(i, 1);
      renderProfile();
    }));

    document.getElementById("pSave").addEventListener("click", async () => {
      const savedMsgEl = document.getElementById("pSavedMsg");
      const uMsgEl = document.getElementById("pUsernameMsg");
      const pMsgEl = document.getElementById("pPasswordMsg");
      uMsgEl.textContent = ""; pMsgEl.textContent = "";

      const newUsername = document.getElementById("pNewUsername").value.trim();
      if (newUsername && newUsername !== userProfile?.username) {
        if (!USERNAME_RE.test(newUsername)) { uMsgEl.textContent = t.errUsernameFormat; return; }
        const { data: existing } = await sb.from("users").select("id").eq("username", newUsername).maybeSingle();
        if (existing) { uMsgEl.textContent = t.errUsernameTaken; return; }
        const { error } = await sb.auth.updateUser({ data: { username: newUsername, full_name: newUsername } });
        if (error) { uMsgEl.textContent = t.errSignupFailed; return; }
        await sb.from("users").update({ username: newUsername }).eq("id", currentUserId);
        userProfile.username = newUsername;
      }

      const newPassword = document.getElementById("pNewPassword").value;
      if (newPassword) {
        if (newPassword.length < 6 || newPassword.length > 10) { pMsgEl.textContent = t.errPasswordLength; return; }
        const { error } = await sb.auth.updateUser({ password: newPassword });
        if (error) { pMsgEl.textContent = t.errSignupFailed; return; }
      }

      await sb.from("user_preferences").upsert({
        user_id: currentUserId,
        first_name: profileState.firstName || null, last_name: profileState.lastName || null,
        age_range: profileState.ageRange || null, grade: profileState.grade || null, area: profileState.area || null,
        activity_types: profileState.activityTypes, interest_topics: profileState.interestTopics
      });

      savedMsgEl.textContent = t.savedMsg;
      userGreetingEl.textContent = L().greeting(userProfile?.username);
      setTimeout(() => { profileMode = "view"; showProfile(); }, 600);
    });
  }

    if (currentUserId) {
      await sb.from("users").update({ [field]: value }).eq("id", currentUserId);
    } else if (isGuestMode()) {
      localStorage.setItem("mb_guest_" + field, value);

  function wireSettings() {
    document.getElementById("goAccessibility").addEventListener("click", showAccessibility);
    document.getElementById("sSignOut").addEventListener("click", doSignOut);
    const backBtn = document.getElementById("sBackToProfile");
    if (backBtn) backBtn.addEventListener("click", showProfile);

    document.getElementById("sLangSelect").addEventListener("change", async (e) => {
      const v = e.target.value;
      setLanguage(v);
      await saveProfileField("language", v);
      renderSettings();
    });

    settingsContentEl.querySelectorAll("[data-theme-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.themeOpt;
      applyTheme(v);
      await saveProfileField("theme_pref", v);
      renderSettings();
    }));

    settingsContentEl.querySelectorAll("[data-privacy-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.privacyOpt === "true";
      await saveProfileField("is_private", v);
      renderSettings();
    }));
  }

  function showAccessibility() {
    settingsScreenEl.hidden = true;
    accessibilityScreenEl.hidden = false;
    renderAccessibility();
  }

  function renderAccessibility() {
    const t = L();
    const size = userProfile?.text_size || "medium";
    accessibilityContentEl.innerHTML = `
      <button type="button" class="settings-back" id="accBack">${LANG_DIR[currentLang] === "rtl" ? "› " + t.settingsTitle : "‹ " + t.settingsTitle}</button>
      <h1 class="quiz-title">${t.accessibilityTitle}</h1>
      <div class="settings-row settings-row--stack">
        <span>${t.textSizeLabel}</span>
        <div class="quiz-options">
          <button type="button" class="quiz-option compact" aria-pressed="${size === "small"}" data-size-opt="small">${t.textSizeSmall}</button>
          <button type="button" class="quiz-option compact" aria-pressed="${size === "medium"}" data-size-opt="medium">${t.textSizeMedium}</button>
          <button type="button" class="quiz-option compact" aria-pressed="${size === "large"}" data-size-opt="large">${t.textSizeLarge}</button>
        </div>
      </div>
    `;
    document.getElementById("accBack").addEventListener("click", () => { accessibilityScreenEl.hidden = true; settingsScreenEl.hidden = false; });
    accessibilityContentEl.querySelectorAll("[data-size-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.sizeOpt;
      applyTextSize(v);
      await saveProfileField("text_size", v);
      renderAccessibility();
    }));
  }

  // ---- Onboarding questionnaire ----
  const quizScreenEl = document.getElementById("quizScreen");
  const quizContentEl = document.getElementById("quizContent");

  let quiz = null;

  function showQuiz(userId, greetingName) {
    quiz = {
      userId, greetingName, step: 0,
      firstName: "", lastName: "", ageRange: null, grade: null, gradeLabel: "", area: null,
      activityTypes: [], interestTopics: [], interestOther: ""
    };
    appRootEl.hidden = true;
    authScreenEl.hidden = true;
    quizScreenEl.hidden = false;
    renderQuiz();
  }

  const TOTAL_QUIZ_STEPS = 4; // name, demographics, topics, activity types (intro + outro aren't counted)

  function quizProgressHtml(step) {
    let dots = "";
    for (let i = 1; i <= TOTAL_QUIZ_STEPS; i++) {
      dots += `<span class="${i <= step ? "done" : ""}"></span>`;
    }
    return `<div class="quiz-progress">${dots}</div>`;
  }

  function pillOptionsHtml(name, options, selected, multi) {
    return `<div class="quiz-options">${options.map(opt => {
      const v = typeof opt === "string" ? opt : opt.v;
      const l = typeof opt === "string" ? opt : opt.l;
      const isSel = multi ? selected.includes(v) : selected === v;
      return `<button type="button" class="quiz-option" aria-pressed="${isSel}" data-${name}="${v}">${l}</button>`;
    }).join("")}</div>`;
  }

  function selectFieldHtml(id, labelText, options, value) {
    return `
      <div class="quiz-select-field">
        <label for="${id}">${labelText}</label>
        <select id="${id}">
          <option value="" ${!value ? "selected" : ""}>${L().selectPlaceholder}</option>
          ${options.map(o => `<option value="${o}" ${value === o ? "selected" : ""}>${o}</option>`).join("")}
        </select>
      </div>
    `;
  }

  function customTagsHtml(name, presetOptions, selected) {
    const custom = selected.filter(v => !presetOptions.includes(v));
    if (!custom.length) return "";
    return `<div class="quiz-options">${custom.map(v =>
      `<button type="button" class="quiz-option" aria-pressed="true" data-${name}-remove="${v}">${v} ✕</button>`
    ).join("")}</div>`;
  }

  function addCustomRowHtml(inputId, btnId) {
    return `
      <div class="quiz-add-row">
        <input type="text" id="${inputId}" placeholder="${L().addCustomTopicPlaceholder}">
        <button type="button" id="${btnId}" class="quiz-btn secondary quiz-add-btn">${L().addBtn}</button>
      </div>
    `;
  }

  function skipLinkHtml() {
    return `<button type="button" class="quiz-skip" id="qSkip">${L().skipLink}</button>`;
  }

  function renderQuiz() {
    const s = quiz.step;
    const t = L();
    let html = "";

    if (s === 0) {
      html = `
        <div class="quiz-eyebrow">${t.appTitle}</div>
        <h1 class="quiz-title">${t.quizIntroTitle}</h1>
        <p class="quiz-subtitle">${t.quizIntroSubtitle}</p>
        <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="qNext">${t.startBtn}</button></div>
        ${skipLinkHtml()}
      `;
    } else if (s === 1) {
      html = `
        ${quizProgressHtml(1)}
        <h1 class="quiz-title">${t.nameTitle}</h1>
        <div class="quiz-body">
          <div class="quiz-field">
            <label for="qFirstName">${t.firstNameLabel}</label>
            <input type="text" id="qFirstName" value="${quiz.firstName}">
          </div>
          <div class="quiz-field">
            <label for="qLastName">${t.lastNameLabel}</label>
            <input type="text" id="qLastName" value="${quiz.lastName}">
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 2) {
      html = `
        ${quizProgressHtml(2)}
        <h1 class="quiz-title">${t.demoTitle}</h1>
        <p class="quiz-subtitle">${t.demoSubtitle}</p>
        <div class="quiz-body">
          ${selectFieldHtml("qAge", t.ageQLabel, AGE_VALUES, quiz.ageRange)}
          ${selectFieldHtml("qGrade", t.gradeQLabel, t.gradeOptions.map(g => g[1]), quiz.gradeLabel)}
          ${selectFieldHtml("qArea", t.areaQLabel, t.areaOptions, quiz.area)}
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 3) {
      html = `
        ${quizProgressHtml(3)}
        <h1 class="quiz-title">${t.topicsTitle}</h1>
        <p class="quiz-subtitle">${t.topicsSubtitle}</p>
        <div class="quiz-body">
          <div class="quiz-field">
            ${pillOptionsHtml("topic", t.topicOptions, quiz.interestTopics, true)}
            ${customTagsHtml("topic", t.topicOptions, quiz.interestTopics)}
            ${addCustomRowHtml("qAddTopic", "qAddTopicBtn")}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 4) {
      html = `
        ${quizProgressHtml(4)}
        <h1 class="quiz-title">${t.activityTypesTitle}</h1>
        <p class="quiz-subtitle">${t.topicsSubtitle}</p>
        <div class="quiz-body">
          <div class="quiz-field">
            ${pillOptionsHtml("atype", t.activityTypeOptions, quiz.activityTypes, true)}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.finishBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 5) {
      html = `
        <div class="quiz-result">
          <div class="emoji">🎉</div>
          <h1 class="quiz-title">${t.outroTitle}</h1>
          <p class="quiz-subtitle">${t.outroSubtitle}</p>
        </div>
        <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="qEnter">${t.enterAppBtn}</button></div>
      `;
    }

    quizContentEl.innerHTML = html;
    wireQuizStep();
  }

  function wireQuizStep() {
    const s = quiz.step;
    const t = L();
    const nextBtn = document.getElementById("qNext");
    const backBtn = document.getElementById("qBack");
    const enterBtn = document.getElementById("qEnter");
    const skipBtn = document.getElementById("qSkip");

    if (backBtn) backBtn.addEventListener("click", () => { quiz.step--; renderQuiz(); });
    if (enterBtn) enterBtn.addEventListener("click", () => showApp(quiz.greetingName));
    if (skipBtn) skipBtn.addEventListener("click", async () => { await saveQuizProgress(); showApp(quiz.greetingName); });

    if (s === 1) {
      document.getElementById("qFirstName").addEventListener("input", e => quiz.firstName = e.target.value);
      document.getElementById("qLastName").addEventListener("input", e => quiz.lastName = e.target.value);
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 2; renderQuiz(); });
    } else if (s === 2) {
      document.getElementById("qAge").addEventListener("change", e => quiz.ageRange = e.target.value || null);
      document.getElementById("qGrade").addEventListener("change", e => {
        quiz.gradeLabel = e.target.value;
        const match = t.gradeOptions.find(g => g[1] === e.target.value);
        quiz.grade = match ? match[0] : null;
      });
      document.getElementById("qArea").addEventListener("change", e => quiz.area = e.target.value || null);
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 3; renderQuiz(); });
    } else if (s === 3) {
      quizContentEl.querySelectorAll("[data-topic]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topic;
          const i = quiz.interestTopics.indexOf(v);
          if (i === -1) quiz.interestTopics.push(v); else quiz.interestTopics.splice(i, 1);
          renderQuiz();
        }));
      quizContentEl.querySelectorAll("[data-topic-remove]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topicRemove;
          quiz.interestTopics = quiz.interestTopics.filter(x => x !== v);
          renderQuiz();
        }));
      document.getElementById("qAddTopicBtn").addEventListener("click", () => {
        const input = document.getElementById("qAddTopic");
        const v = input.value.trim();
        if (v && !quiz.interestTopics.includes(v)) quiz.interestTopics.push(v);
        renderQuiz();
      });
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 4; renderQuiz(); });
    } else if (s === 4) {
      quizContentEl.querySelectorAll("[data-atype]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.atype;
          const i = quiz.activityTypes.indexOf(v);
          if (i === -1) quiz.activityTypes.push(v); else quiz.activityTypes.splice(i, 1);
          renderQuiz();
        }));
      if (nextBtn) nextBtn.addEventListener("click", finishQuiz);
    } else if (s === 0) {
      if (nextBtn) nextBtn.addEventListener("click", () => { quiz.step = 1; renderQuiz(); });
    }
  }

  async function saveQuizProgress() {
    await sb.from("user_preferences").upsert({
      user_id: quiz.userId,
      first_name: quiz.firstName || null,
      last_name: quiz.lastName || null,
      age_range: quiz.ageRange || null,
      grade: quiz.grade || null,
      area: quiz.area || null,
      activity_types: quiz.activityTypes,
      interest_topics: quiz.interestTopics,
      interest_other: quiz.interestOther || null
    });
  }

  async function finishQuiz() {
    await saveQuizProgress();
    quiz.step = 5;
    renderQuiz();
  }

  (async function boot() {
    applyStaticText();
    try {
      if (localStorage.getItem("mb_guest") === "1") {
        currentUserId = null;
        loadGuestSettings();
        showApp(null);
        return;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const name = session.user?.user_metadata?.username || session.user?.email;
        await proceedAfterAuth(session.user.id, name);
      } else {
        showAuth();
      }
    } catch (err) {
      showAuth();
    }
  })();
  </script>
</body>
</html>
