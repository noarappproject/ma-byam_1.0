<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="מה בי״ם — פעילות, חוגים ואירועים לבני נוער">
  <meta name="theme-color" content="#F1F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מה בי״ם">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>מה בי״ם — תצוגת פעילות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
  :root {
    --bg: #F1F4F0;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --ink: #1B2320;
    --ink-soft: #59665C;
    --ink-faint: #8A968C;
    --accent: #DE5A3C;
    --accent-ink: #FFFFFF;
    --line: #DEE5DC;
    --chip-bg: #E9EEE7;
    --shadow: 220 25% 12%;
    --danger: #C0392B;
    --text-scale: 1;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141815;
      --surface: #1E2420;
      --surface-raised: #232A25;
      --ink: #ECEFEA;
      --ink-soft: #A8B2A9;
      --ink-faint: #6E7A70;
      --accent: #FF7A57;
      --accent-ink: #1A100C;
      --line: #303930;
      --chip-bg: #283029;
      --shadow: 0 0% 0%;
      --danger: #FF6B5E;
    }
  }

  :root[data-theme="dark"] {
    --bg: #141815;
    --surface: #1E2420;
    --surface-raised: #232A25;
    --ink: #ECEFEA;
    --ink-soft: #A8B2A9;
    --ink-faint: #6E7A70;
    --accent: #FF7A57;
    --accent-ink: #1A100C;
    --line: #303930;
    --chip-bg: #283029;
    --shadow: 0 0% 0%;
    --danger: #FF6B5E;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Heebo", "Segoe UI", system-ui, sans-serif;
    direction: rtl;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 12px 40px;
  }

  .frame {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .eyebrow strong {
    color: var(--ink-soft);
    font-weight: 700;
  }

  .greeting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .greeting-row .hi {
    font-family: "Suez One", "Heebo", serif;
    font-size: calc(17px * var(--text-scale));
    color: var(--ink);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .signout-btn {
    border: none;
    background: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .auth-screen {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 8px 4px 32px;
  }

  .auth-logo {
    font-family: "Suez One", "Heebo", serif;
    font-size: 30px;
    color: var(--ink);
    text-align: center;
  }

  .auth-logo span {
    display: block;
    font-family: "Heebo", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  .auth-tabs {
    display: flex;
    width: 100%;
    background: var(--chip-bg);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }

  .auth-tab {
    flex: 1;
    border: none;
    background: none;
    padding: 9px 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .auth-tab[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 4px hsl(var(--shadow) / 0.12);
  }

  .auth-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .auth-field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .auth-field input {
    height: 46px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }

  .auth-field input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }

  .auth-error {
    font-size: 13px;
    color: var(--danger);
    text-align: center;
    min-height: 1em;
  }

  .auth-submit {
    height: 48px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .auth-submit:disabled { opacity: 0.6; cursor: default; }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    color: var(--ink-faint);
    font-size: 12.5px;
  }

  .auth-divider::before, .auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .guest-btn {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .quiz-screen {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 8px 4px 32px;
  }

  .quiz-progress {
    display: flex;
    gap: 5px;
  }

  .quiz-progress span {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: var(--line);
  }

  .quiz-progress span.done { background: var(--accent); }

  .quiz-eyebrow {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  .quiz-title {
    font-family: "Suez One", "Heebo", serif;
    font-size: calc(23px * var(--text-scale));
    line-height: 1.3;
    color: var(--ink);
    margin: 4px 0 0;
    text-wrap: balance;
  }

  .quiz-subtitle {
    font-size: calc(14px * var(--text-scale));
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 6px 0 0;
  }

  .quiz-body {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .quiz-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .quiz-field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .quiz-field input {
    height: 46px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }

  .quiz-field input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .quiz-options.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .quiz-option {
    width: 100%;
    text-align: right;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.4;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .quiz-option[aria-pressed="true"] {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    font-weight: 700;
  }

  .quiz-section-label {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 4px 0 -2px;
  }

  .quiz-nav {
    display: flex;
    gap: 10px;
  }

  .quiz-btn {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .quiz-btn.primary { background: var(--accent); color: var(--accent-ink); }
  .quiz-btn.primary:disabled { opacity: 0.5; cursor: default; }
  .quiz-btn.secondary { background: var(--chip-bg); color: var(--ink); flex: 0 0 92px; }

  .quiz-result {
    text-align: center;
    padding: 12px 0;
  }

  .quiz-result .emoji { font-size: 40px; }

  .profile-avatar-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .profile-avatar {
    width: 84px;
    height: 84px;
    border-radius: 999px;
    background: var(--chip-bg) center/cover no-repeat;
    border: 1px solid var(--line);
  }

  .quiz-add-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .quiz-add-row input {
    flex: 1;
    height: 42px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }

  .quiz-add-btn {
    flex: 0 0 auto;
    height: 42px;
    padding: 0 18px;
  }

  .quiz-skip {
    display: block;
    margin: 0 auto;
    border: none;
    background: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .search-bar {
    position: relative;
    width: 100%;
  }

  .search-bar .search-ic {
    position: absolute;
    inset-inline-start: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    stroke: var(--ink-faint);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .search-bar input {
    width: 100%;
    height: 44px;
    padding-inline-start: 40px;
    padding-inline-end: 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
  }

  .search-bar input::placeholder { color: var(--ink-faint); }
  .search-bar input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip-row {
    display: flex;
    gap: 8px;
    width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .chip-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .chip[aria-pressed="true"] {
    background: var(--chip-color, var(--accent));
    border-color: var(--chip-color, var(--accent));
    color: #fff;
  }

  .chip-row--topics .chip { font-weight: 500; font-size: 12.5px; padding: 6px 12px; }

  .stage {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .stage.is-empty .arrow-btn { display: none; }

  .card.is-empty {
    text-align: center;
    padding: 40px 24px;
    color: var(--ink-soft);
    font-size: 14.5px;
  }

  .card.is-empty .clear-btn {
    margin-top: 14px;
    border: none;
    background: var(--chip-bg);
    color: var(--ink);
    font-family: inherit;
    font-weight: 700;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
  }

  .arrow-btn {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 10px hsl(var(--shadow) / 0.08);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .arrow-btn:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .arrow-btn:active {
    transform: translateY(0) scale(0.96);
  }

  .arrow-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .arrow-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card {
    position: relative;
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 20px 20px;
    box-shadow: 0 10px 30px hsl(var(--shadow) / 0.10);
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset-inline-start: 0;
    inset-block: 0;
    width: 6px;
    background: var(--cat-color, var(--accent));
  }

  .card.fade-in { animation: cardIn 0.22s ease; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card.fade-in { animation: none; }
    .arrow-btn { transition: none; }
  }

  .kind-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .kind-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--cat-color, var(--accent));
    color: #fff;
  }

  .category-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--chip-bg);
    padding: 5px 11px;
    border-radius: 999px;
  }

  h1 {
    font-family: "Suez One", "Heebo", serif;
    font-weight: 400;
    font-size: calc(24px * var(--text-scale));
    line-height: 1.25;
    text-wrap: balance;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .short-desc {
    font-size: calc(14.5px * var(--text-scale));
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0 0 16px;
  }

  .facts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }

  .fact {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: calc(14px * var(--text-scale));
    color: var(--ink);
  }

  .fact .ic {
    flex: none;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    stroke: var(--ink-faint);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fact b {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .fact .sub {
    color: var(--ink-faint);
    font-size: 12.5px;
  }

  .desc {
    font-size: calc(14px * var(--text-scale));
    line-height: 1.65;
    color: var(--ink);
    margin: 0 0 16px;
  }

  .cta-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .cta {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    font-size: calc(14.5px * var(--text-scale));
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    transition: filter 0.15s ease;
  }

  .cta:hover { filter: brightness(1.06); }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cta.secondary {
    background: var(--chip-bg);
    color: var(--ink);
  }

  .cta.disabled {
    background: var(--chip-bg);
    color: var(--ink-faint);
    cursor: default;
    pointer-events: none;
  }

  .dots {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dots button {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    border: none;
    padding: 0;
    background: var(--line);
    cursor: pointer;
  }

  .dots button[aria-current="true"] {
    width: 22px;
    background: var(--accent);
  }

  .counter {
    font-size: 12.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .note {
    max-width: 420px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
    line-height: 1.6;
  }
  </style>
</head>
<body>
  <div class="frame" id="authScreen" hidden>
    <div class="auth-screen">
      <div class="auth-logo"><span id="authTitleText"></span><span id="authTaglineText"></span></div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab" id="tabLogin" role="tab" aria-selected="true"></button>
        <button type="button" class="auth-tab" id="tabSignup" role="tab" aria-selected="false"></button>
      </div>

      <form class="auth-form" id="authForm">
        <div class="auth-field">
          <label for="authUsername" id="authUsernameLabel"></label>
          <input type="text" id="authUsername" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="authPassword" id="authPasswordLabel"></label>
          <input type="password" id="authPassword" autocomplete="current-password" required minlength="6" maxlength="10">
        </div>
        <p class="auth-error" id="authError"></p>
        <button type="submit" class="auth-submit" id="authSubmit"></button>
      </form>

      <div class="auth-divider" id="authOrText"></div>

      <button type="button" class="guest-btn" id="guestBtn"></button>
    </div>
  </div>

  <div class="frame" id="quizScreen" hidden>
    <div class="quiz-screen" id="quizContent"></div>
  </div>

  <div class="frame" id="appRoot" hidden>
    <div class="greeting-row">
      <span class="hi" id="userGreeting"></span>
      <div class="nav-links">
        <button type="button" class="signout-btn" id="profileBtn"></button>
        <button type="button" class="signout-btn" id="settingsBtn"></button>
        <button type="button" class="signout-btn" id="signoutBtn"></button>
      </div>
    </div>

    <div class="eyebrow"><span id="eyebrowTitle"></span> <strong>· <span id="eyebrowSubText"></span></strong></div>

    <div class="search-bar">
      <svg class="search-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="searchInput" aria-label="Search">
    </div>

    <div class="chip-row" id="categoryChips" aria-label="Filter by category"></div>
    <div class="chip-row chip-row--topics" id="topicChips" aria-label="Filter by topic" hidden></div>

    <div class="stage">
      <button class="arrow-btn" id="btnRight">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>

  }

  let currentLang = localStorage.getItem("mb_lang") || "he";
  function L() { return STRINGS[currentLang]; }

  function applyDocLang() {
    document.documentElement.lang = currentLang;
    document.documentElement.dir = LANG_DIR[currentLang];
  }

  function applyStaticText() {
    const t = L();
    document.getElementById("authTitleText").textContent = t.appTitle;
    document.getElementById("authTaglineText").textContent = t.appTagline;
    document.getElementById("tabLogin").textContent = t.tabLogin;
    document.getElementById("tabSignup").textContent = t.tabSignup;
    document.getElementById("authUsernameLabel").textContent = t.usernameLabel;
    document.getElementById("authPasswordLabel").textContent = t.passwordLabel;
    document.getElementById("authSubmit").textContent = authMode === "signup" ? t.tabSignup : t.tabLogin;
    document.getElementById("authOrText").textContent = t.or;
    document.getElementById("guestBtn").textContent = t.guestBtn;
    document.getElementById("profileBtn").textContent = t.profileBtn;
    document.getElementById("settingsBtn").textContent = t.settingsBtn;
    document.getElementById("signoutBtn").textContent = t.signOut;
    document.getElementById("eyebrowTitle").textContent = t.appTitle;
    document.getElementById("eyebrowSubText").textContent = t.eyebrowSub;
    document.getElementById("searchInput").placeholder = t.searchPlaceholder;
    document.getElementById("noteTextEl").textContent = t.noteText;
  }

  function applyTheme(pref) {
    const root = document.documentElement;
    if (pref === "light" || pref === "dark") root.setAttribute("data-theme", pref);
    else root.removeAttribute("data-theme");
  }

  function applyTextSize(size) {
    const scale = { small: "0.9", medium: "1", large: "1.2" }[size] || "1";
    document.documentElement.style.setProperty("--text-scale", scale);
  }

  let userProfile = null;
  let currentUserId = null;

  async function loadAndApplyProfile(userId) {
    currentUserId = userId;
    const { data } = await sb.from("users")
      .select("username, avatar_url, theme_pref, text_size, language")
      .eq("id", userId).maybeSingle();
    userProfile = data || null;
    if (userProfile) {
      setLanguage(userProfile.language || "he");
      applyTheme(userProfile.theme_pref || "system");
      applyTextSize(userProfile.text_size || "medium");
    }
  }

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("mb_lang", lang);
    applyDocLang();
    applyStaticText();
    if (categoryChipsEl) { renderCategoryChips(); renderTopicChips(); }
    if (cardEl && appStarted) render();
    if (quiz && !quizScreenEl.hidden) renderQuiz();
  }

  applyDocLang();

  const authScreenEl = document.getElementById("authScreen");
  const appRootEl = document.getElementById("appRoot");
  const userGreetingEl = document.getElementById("userGreeting");
  const authForm = document.getElementById("authForm");
  const authUsernameEl = document.getElementById("authUsername");
  const authPasswordEl = document.getElementById("authPassword");
  const authErrorEl = document.getElementById("authError");
  const authSubmitEl = document.getElementById("authSubmit");
  const tabLoginEl = document.getElementById("tabLogin");
  const tabSignupEl = document.getElementById("tabSignup");
  const guestBtnEl = document.getElementById("guestBtn");
  const signoutBtnEl = document.getElementById("signoutBtn");
  const profileBtnEl = document.getElementById("profileBtn");
  const settingsBtnEl = document.getElementById("settingsBtn");
  const profileScreenEl = document.getElementById("profileScreen");
  const settingsScreenEl = document.getElementById("settingsScreen");
  const profileContentEl = document.getElementById("profileContent");
  const settingsContentEl = document.getElementById("settingsContent");

  let authMode = "login";
  let appStarted = false;

  const USERNAME_RE = /^[A-Za-zא-ת][A-Za-zא-ת0-9_]*$/;

  function usernameToEmail(username) {
    return username.trim().toLowerCase().replace(/\s+/g, "_") + "@mahbaim.app";
  }

  function setAuthMode(mode) {
    authMode = mode;
    tabLoginEl.setAttribute("aria-selected", mode === "login");
    tabSignupEl.setAttribute("aria-selected", mode === "signup");
    authSubmitEl.textContent = mode === "login" ? L().tabLogin : L().tabSignup;
    authPasswordEl.setAttribute("autocomplete", mode === "login" ? "current-password" : "new-password");
    authErrorEl.textContent = "";
  }

  tabLoginEl.addEventListener("click", () => setAuthMode("login"));
  tabSignupEl.addEventListener("click", () => setAuthMode("signup"));

  function showApp(greetingName) {
    quizScreenEl.hidden = true;
    authScreenEl.hidden = true;
    profileScreenEl.hidden = true;
    settingsScreenEl.hidden = true;
    appRootEl.hidden = false;
    userGreetingEl.textContent = greetingName ? L().greeting(greetingName) : L().guestGreeting;
    const isGuest = localStorage.getItem("mb_guest") === "1";
    profileBtnEl.hidden = isGuest;
    settingsBtnEl.hidden = isGuest;
    if (!appStarted) { appStarted = true; initAppUI(); }
  }

  function showAuth() {
    appRootEl.hidden = true;
    quizScreenEl.hidden = true;
    profileScreenEl.hidden = true;
    settingsScreenEl.hidden = true;
    authScreenEl.hidden = false;
    authForm.reset();
    setAuthMode("login");
  }

  // Registered users (login or signup) answer the onboarding questionnaire
  // exactly once; guests skip it entirely, since guest data is never collected.
  async function proceedAfterAuth(userId, greetingName) {
    await loadAndApplyProfile(userId);
    const { data: prefs } = await sb.from("user_preferences").select("user_id").eq("user_id", userId).maybeSingle();
    if (prefs) {
      showApp(greetingName);
    } else {
      showQuiz(userId, greetingName);
    }
  }

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = authUsernameEl.value.trim();
    const password = authPasswordEl.value;
    if (!username || !password) return;

    authSubmitEl.disabled = true;
    authErrorEl.textContent = "";

    try {
      if (authMode === "signup") {
        const email = usernameToEmail(username);
        if (!USERNAME_RE.test(username)) {
          authErrorEl.textContent = L().errUsernameFormat;
          return;
        }
        if (password.length < 6 || password.length > 10) {
          authErrorEl.textContent = L().errPasswordLength;
          return;
        }
        const { data: existing } = await sb.from("users").select("id").eq("username", username).maybeSingle();
        if (existing) {
          authErrorEl.textContent = L().errUsernameTaken;
          return;
        }
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { username, full_name: username } }
        });
        if (error) throw error;
        if (!data.session) {
          authErrorEl.textContent = L().errSignupNeedsVerification;
          return;
        }
        localStorage.removeItem("mb_guest");
        await proceedAfterAuth(data.user.id, username);
      } else {
        const { data: existing } = await sb.from("users").select("email").eq("username", username).maybeSingle();
        if (!existing) throw new Error("not found");
        const { data, error } = await sb.auth.signInWithPassword({ email: existing.email, password });
        if (error) throw error;
        localStorage.removeItem("mb_guest");
        const name = data.user?.user_metadata?.username || username;
        await proceedAfterAuth(data.user.id, name);
      }
    } catch (err) {
      authErrorEl.textContent = authMode === "login" ? L().errLoginFailed : L().errSignupFailed;
    } finally {
      authSubmitEl.disabled = false;
    }
  });

  guestBtnEl.addEventListener("click", () => {
    localStorage.setItem("mb_guest", "1");
    showApp(null);
  });

  signoutBtnEl.addEventListener("click", async () => {
    localStorage.removeItem("mb_guest");
    const { data: { session } } = await sb.auth.getSession();
    if (session) await sb.auth.signOut();
    showAuth();
  });

  // ---- Profile ----
  let profileState = null;

  async function showProfile() {
    appRootEl.hidden = true;
    profileScreenEl.hidden = false;
    const { data: prefs } = await sb.from("user_preferences").select("*").eq("user_id", currentUserId).maybeSingle();
    const gradeMatch = L().gradeOptions.find(g => g[0] === prefs?.grade);
    profileState = {
      firstName: prefs?.first_name || "", lastName: prefs?.last_name || "",
      ageRange: prefs?.age_range || "", grade: prefs?.grade || null,
      gradeLabel: gradeMatch ? gradeMatch[1] : (prefs?.grade || ""),
      area: prefs?.area || "",
      activityTypes: prefs?.activity_types || [], interestTopics: prefs?.interest_topics || []
    };
    renderProfile();
  }

  function renderProfile() {
    const t = L();
    profileContentEl.innerHTML = `
      <h1 class="quiz-title">${t.profileTitle}</h1>
      <div class="profile-avatar-row">
        <div class="profile-avatar" id="avatarPreview" style="${userProfile?.avatar_url ? `background-image:url('${userProfile.avatar_url}')` : ""}"></div>
        <button type="button" class="quiz-btn secondary" id="avatarBtn">${t.avatarChange}</button>
        <input type="file" id="avatarInput" accept="image/*" hidden>
      </div>
      <div class="quiz-body">
        <div class="quiz-field"><label for="pFirstName">${t.firstNameLabel}</label><input type="text" id="pFirstName" value="${profileState.firstName}"></div>
        <div class="quiz-field"><label for="pLastName">${t.lastNameLabel}</label><input type="text" id="pLastName" value="${profileState.lastName}"></div>
        ${comboFieldHtml("pAge", t.ageQLabel, ["12-13", "14-15", "16-17", "18+"], profileState.ageRange)}
        ${comboFieldHtml("pGrade", t.gradeQLabel, t.gradeOptions.map(g => g[1]), profileState.gradeLabel)}
        ${comboFieldHtml("pArea", t.areaQLabel, t.areaOptions, profileState.area)}
        <div class="quiz-field">
          <span class="quiz-section-label">${t.topicsTitle}</span>
          ${pillOptionsHtml("ptopic", t.topicOptions, profileState.interestTopics, true)}
          ${customTagsHtml("ptopic", t.topicOptions, profileState.interestTopics)}
          ${addCustomRowHtml("pAddTopic", "pAddTopicBtn")}
        </div>
        <div class="quiz-field">
          <span class="quiz-section-label">${t.activityTypesTitle}</span>
          ${pillOptionsHtml("patype", t.activityTypeOptions, profileState.activityTypes, true)}
        </div>
      </div>
      <div class="quiz-nav">
        <button type="button" class="quiz-btn secondary" id="pBack">${t.backToApp}</button>
        <button type="button" class="quiz-btn primary" id="pSave">${t.saveBtn}</button>
      </div>
      <p class="quiz-subtitle" id="pSavedMsg" style="text-align:center"></p>
    `;
    wireProfile();
  }

  async function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file || !currentUserId) return;
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = `${currentUserId}/avatar.${ext}`;
    const { error } = await sb.storage.from("avatars").upload(path, file, { upsert: true });
    if (error) return;
    const { data } = sb.storage.from("avatars").getPublicUrl(path);
    const url = data.publicUrl + "?t=" + Date.now();
    await sb.from("users").update({ avatar_url: url }).eq("id", currentUserId);
    if (userProfile) userProfile.avatar_url = url;
    renderProfile();
  }

  function wireProfile() {
    const t = L();
    document.getElementById("pBack").addEventListener("click", () => { profileScreenEl.hidden = true; appRootEl.hidden = false; });
    document.getElementById("avatarBtn").addEventListener("click", () => document.getElementById("avatarInput").click());
    document.getElementById("avatarInput").addEventListener("change", handleAvatarUpload);
    document.getElementById("pFirstName").addEventListener("input", e => profileState.firstName = e.target.value);
    document.getElementById("pLastName").addEventListener("input", e => profileState.lastName = e.target.value);
    document.getElementById("pAge").addEventListener("input", e => profileState.ageRange = e.target.value);
    document.getElementById("pGrade").addEventListener("input", e => {
      const match = t.gradeOptions.find(g => g[1] === e.target.value);
      profileState.grade = match ? match[0] : (e.target.value || null);
    });
    document.getElementById("pArea").addEventListener("input", e => profileState.area = e.target.value);
    profileContentEl.querySelectorAll("[data-ptopic]").forEach(btn => btn.addEventListener("click", () => {
      const v = btn.dataset.ptopic;
      const i = profileState.interestTopics.indexOf(v);
      if (i === -1) profileState.interestTopics.push(v); else profileState.interestTopics.splice(i, 1);
      renderProfile();
    }));
    profileContentEl.querySelectorAll("[data-ptopic-remove]").forEach(btn => btn.addEventListener("click", () => {
      profileState.interestTopics = profileState.interestTopics.filter(x => x !== btn.dataset.ptopicRemove);
      renderProfile();
    }));
    document.getElementById("pAddTopicBtn").addEventListener("click", () => {
      const input = document.getElementById("pAddTopic");
      const v = input.value.trim();
      if (v && !profileState.interestTopics.includes(v)) profileState.interestTopics.push(v);
      renderProfile();
    });
    profileContentEl.querySelectorAll("[data-patype]").forEach(btn => btn.addEventListener("click", () => {
      const v = btn.dataset.patype;
      const i = profileState.activityTypes.indexOf(v);
      if (i === -1) profileState.activityTypes.push(v); else profileState.activityTypes.splice(i, 1);
      renderProfile();
    }));
    document.getElementById("pSave").addEventListener("click", async () => {
      await sb.from("user_preferences").upsert({
        user_id: currentUserId,
        first_name: profileState.firstName || null, last_name: profileState.lastName || null,
        age_range: profileState.ageRange || null, grade: profileState.grade || null, area: profileState.area || null,
        activity_types: profileState.activityTypes, interest_topics: profileState.interestTopics
      });
      document.getElementById("pSavedMsg").textContent = t.savedMsg;
    });
  }

  profileBtnEl.addEventListener("click", showProfile);

  // ---- Settings ----
  async function saveProfileField(field, value) {
    if (!userProfile) userProfile = {};
    userProfile[field] = value;
    if (currentUserId) await sb.from("users").update({ [field]: value }).eq("id", currentUserId);
  }

  function showSettings() {
    appRootEl.hidden = true;
    settingsScreenEl.hidden = false;
    renderSettings();
  }

  function renderSettings() {
    const t = L();
    const theme = userProfile?.theme_pref || "system";
    const size = userProfile?.text_size || "medium";
    settingsContentEl.innerHTML = `
      <h1 class="quiz-title">${t.settingsTitle}</h1>
      <div class="quiz-body">
        <div class="quiz-field">
          <span class="quiz-section-label">${t.themeLabel}</span>
          <div class="quiz-options">
            <button type="button" class="quiz-option" aria-pressed="${theme === "light"}" data-theme-opt="light">${t.themeLight}</button>
            <button type="button" class="quiz-option" aria-pressed="${theme === "dark"}" data-theme-opt="dark">${t.themeDark}</button>
            <button type="button" class="quiz-option" aria-pressed="${theme === "system"}" data-theme-opt="system">${t.themeSystem}</button>
          </div>
        </div>
        <div class="quiz-field">
          <span class="quiz-section-label">${t.textSizeLabel}</span>
          <div class="quiz-options">
            <button type="button" class="quiz-option" aria-pressed="${size === "small"}" data-size-opt="small">${t.textSizeSmall}</button>
            <button type="button" class="quiz-option" aria-pressed="${size === "medium"}" data-size-opt="medium">${t.textSizeMedium}</button>
            <button type="button" class="quiz-option" aria-pressed="${size === "large"}" data-size-opt="large">${t.textSizeLarge}</button>
          </div>
        </div>
        <div class="quiz-field">
          <span class="quiz-section-label">${t.languageLabel}</span>
          <div class="quiz-options">
            ${Object.keys(LANG_NAME).map(l => `<button type="button" class="quiz-option" aria-pressed="${currentLang === l}" data-lang-opt="${l}">${LANG_NAME[l]}</button>`).join("")}
          </div>
        </div>
        <div class="quiz-field">
          <label for="sNewUsername">${t.changeUsernameLabel}</label>
          <input type="text" id="sNewUsername" placeholder="${t.newUsernamePlaceholder}">
          <button type="button" class="quiz-btn secondary" id="sUsernameBtn">${t.updateBtn}</button>
          <p class="auth-error" id="sUsernameMsg"></p>
        </div>
        <div class="quiz-field">
          <label for="sNewPassword">${t.changePasswordLabel}</label>
          <input type="password" id="sNewPassword" placeholder="${t.newPasswordPlaceholder}" minlength="6" maxlength="10">
          <button type="button" class="quiz-btn secondary" id="sPasswordBtn">${t.updateBtn}</button>
          <p class="auth-error" id="sPasswordMsg"></p>
        </div>
      </div>
      <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="sBack">${t.backToApp}</button></div>
    `;
    wireSettings();
  }

  function wireSettings() {
    const t = L();
    document.getElementById("sBack").addEventListener("click", () => { settingsScreenEl.hidden = true; appRootEl.hidden = false; });

    settingsContentEl.querySelectorAll("[data-theme-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.themeOpt;
      applyTheme(v);
      await saveProfileField("theme_pref", v);
      renderSettings();
    }));

    settingsContentEl.querySelectorAll("[data-size-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.sizeOpt;
      applyTextSize(v);
      await saveProfileField("text_size", v);
      renderSettings();
    }));

    settingsContentEl.querySelectorAll("[data-lang-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.langOpt;
      setLanguage(v);
      await saveProfileField("language", v);
      renderSettings();
    }));

    document.getElementById("sUsernameBtn").addEventListener("click", async () => {
      const msgEl = document.getElementById("sUsernameMsg");
      const newUsername = document.getElementById("sNewUsername").value.trim();
      if (!USERNAME_RE.test(newUsername)) { msgEl.textContent = t.errUsernameFormat; return; }
      const { data: existing } = await sb.from("users").select("id").eq("username", newUsername).maybeSingle();
      if (existing) { msgEl.textContent = t.errUsernameTaken; return; }
      const { error } = await sb.auth.updateUser({ data: { username: newUsername, full_name: newUsername } });
      if (error) { msgEl.textContent = t.errSignupFailed; return; }
      await sb.from("users").update({ username: newUsername }).eq("id", currentUserId);
      msgEl.style.color = "var(--accent)";
      msgEl.textContent = t.usernameUpdated;
      userGreetingEl.textContent = L().greeting(newUsername);
    });

    document.getElementById("sPasswordBtn").addEventListener("click", async () => {
      const msgEl = document.getElementById("sPasswordMsg");
      const newPassword = document.getElementById("sNewPassword").value;
      if (newPassword.length < 6 || newPassword.length > 10) { msgEl.textContent = t.errPasswordLength; return; }
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) { msgEl.textContent = t.errSignupFailed; return; }
      msgEl.style.color = "var(--accent)";
      msgEl.textContent = t.passwordUpdated;
      document.getElementById("sNewPassword").value = "";
    });
  }

  settingsBtnEl.addEventListener("click", showSettings);

  (async function boot() {
    applyStaticText();
    try {
      if (localStorage.getItem("mb_guest") === "1") {
        showApp(null);
        return;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const name = session.user?.user_metadata?.username || session.user?.email;
        await proceedAfterAuth(session.user.id, name);
      } else {
        showAuth();
      }
    } catch (err) {
      showAuth();
    }
  })();

  // ---- Onboarding questionnaire ----
  const quizScreenEl = document.getElementById("quizScreen");
  const quizContentEl = document.getElementById("quizContent");

  const AGE_OPTIONS = ["12-13", "14-15", "16-17", "18+"];
  const GRADE_OPTIONS = [
    { v: "ז", l: "ז׳" }, { v: "ח", l: "ח׳" }, { v: "ט", l: "ט׳" },
    { v: "י", l: "י׳" }, { v: "יא", l: "י\"א" }, { v: "יב", l: "י\"ב" },
    { v: "not_studying", l: "לא לומד/ת כרגע" }
  ];
  const AREA_OPTIONS = ["מרכז", "צפון", "דרום", "מזרח", "מערב"];
  const ACTIVITY_TYPE_OPTIONS = ["קורסים", "הרצאות", "חוגים", "הופעות", "התנדבות", "מקומות תעסוקה"];
  const TOPIC_OPTIONS = ["ספורט", "אמנות ועיצוב", "טכנולוגיה", "מוזיקה", "בישול", "מדעים", "קולנוע וצילום", "יזמות ועסקים", "חברה וקהילה"];


  let quiz = null;

  function showQuiz(userId, greetingName) {
    quiz = {
      userId, greetingName, step: 0,
      firstName: "", lastName: "", ageRange: null, grade: null, gradeLabel: "", area: null,
      activityTypes: [], interestTopics: [], interestOther: ""
    };
    appRootEl.hidden = true;
    authScreenEl.hidden = true;
    quizScreenEl.hidden = false;
    renderQuiz();
  }

  const TOTAL_QUIZ_STEPS = 4; // name, demographics, topics, activity types (intro + outro aren't counted)

  function quizProgressHtml(step) {
    let dots = "";
    for (let i = 1; i <= TOTAL_QUIZ_STEPS; i++) {
      dots += `<span class="${i <= step ? "done" : ""}"></span>`;
    }
    return `<div class="quiz-progress">${dots}</div>`;
  }

  function pillOptionsHtml(name, options, selected, multi) {
    return `<div class="quiz-options">${options.map(opt => {
      const v = typeof opt === "string" ? opt : opt.v;
      const l = typeof opt === "string" ? opt : opt.l;
      const isSel = multi ? selected.includes(v) : selected === v;
      return `<button type="button" class="quiz-option" aria-pressed="${isSel}" data-${name}="${v}">${l}</button>`;
    }).join("")}</div>`;
  }

  function comboFieldHtml(id, labelText, options, value) {
    return `
      <div class="quiz-field">
        <label for="${id}">${labelText}</label>
        <input type="text" id="${id}" list="${id}List" value="${value || ""}" placeholder="${L().typeOrPick}">
        <datalist id="${id}List">${options.map(o => `<option value="${o}"></option>`).join("")}</datalist>
      </div>
    `;
  }

  function customTagsHtml(name, presetOptions, selected) {
    const custom = selected.filter(v => !presetOptions.includes(v));
    if (!custom.length) return "";
    return `<div class="quiz-options">${custom.map(v =>
      `<button type="button" class="quiz-option" aria-pressed="true" data-${name}-remove="${v}">${v} ✕</button>`
    ).join("")}</div>`;
  }

  function addCustomRowHtml(inputId, btnId) {
    return `
      <div class="quiz-add-row">
        <input type="text" id="${inputId}" placeholder="${L().addCustomTopicPlaceholder}">
        <button type="button" id="${btnId}" class="quiz-btn secondary quiz-add-btn">${L().addBtn}</button>
      </div>
    `;
  }

  function skipLinkHtml() {
    return `<button type="button" class="quiz-skip" id="qSkip">${L().skipLink}</button>`;
  }

  function renderQuiz() {
    const s = quiz.step;
    const t = L();
    let html = "";

    if (s === 0) {
      html = `
        <div class="quiz-eyebrow">${t.appTitle}</div>
        <h1 class="quiz-title">${t.quizIntroTitle}</h1>
        <p class="quiz-subtitle">${t.quizIntroSubtitle}</p>
        <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="qNext">${t.startBtn}</button></div>
        ${skipLinkHtml()}
      `;
    } else if (s === 1) {
      html = `
        ${quizProgressHtml(1)}
        <h1 class="quiz-title">${t.nameTitle}</h1>
        <div class="quiz-body">
          <div class="quiz-field">
            <label for="qFirstName">${t.firstNameLabel}</label>
            <input type="text" id="qFirstName" value="${quiz.firstName}">
          </div>
          <div class="quiz-field">
            <label for="qLastName">${t.lastNameLabel}</label>
            <input type="text" id="qLastName" value="${quiz.lastName}">
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 2) {
      html = `
        ${quizProgressHtml(2)}
        <h1 class="quiz-title">${t.demoTitle}</h1>
        <p class="quiz-subtitle">${t.demoSubtitle}</p>
        <div class="quiz-body">
          ${comboFieldHtml("qAge", t.ageQLabel, ["12-13", "14-15", "16-17", "18+"], quiz.ageRange)}
          ${comboFieldHtml("qGrade", t.gradeQLabel, t.gradeOptions.map(g => g[1]), quiz.gradeLabel)}
          ${comboFieldHtml("qArea", t.areaQLabel, t.areaOptions, quiz.area)}
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 3) {
      html = `
        ${quizProgressHtml(3)}
        <h1 class="quiz-title">${t.topicsTitle}</h1>
        <p class="quiz-subtitle">${t.topicsSubtitle}</p>
        <div class="quiz-body">
          <div class="quiz-field">
            ${pillOptionsHtml("topic", t.topicOptions, quiz.interestTopics, true)}
            ${customTagsHtml("topic", t.topicOptions, quiz.interestTopics)}
            ${addCustomRowHtml("qAddTopic", "qAddTopicBtn")}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 4) {
      html = `
        ${quizProgressHtml(4)}
        <h1 class="quiz-title">${t.activityTypesTitle}</h1>
        <p class="quiz-subtitle">${t.topicsSubtitle}</p>
        <div class="quiz-body">
          <div class="quiz-field">
            ${pillOptionsHtml("atype", t.activityTypeOptions, quiz.activityTypes, true)}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.finishBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 5) {
      html = `
        <div class="quiz-result">
          <div class="emoji">🎉</div>
          <h1 class="quiz-title">${t.outroTitle}</h1>
          <p class="quiz-subtitle">${t.outroSubtitle}</p>
        </div>
        <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="qEnter">${t.enterAppBtn}</button></div>
      `;
    }

    quizContentEl.innerHTML = html;
    wireQuizStep();
  }

  function wireQuizStep() {
    const s = quiz.step;
    const t = L();
    const nextBtn = document.getElementById("qNext");
    const backBtn = document.getElementById("qBack");
    const enterBtn = document.getElementById("qEnter");
    const skipBtn = document.getElementById("qSkip");

    if (backBtn) backBtn.addEventListener("click", () => { quiz.step--; renderQuiz(); });
    if (enterBtn) enterBtn.addEventListener("click", () => showApp(quiz.greetingName));
    if (skipBtn) skipBtn.addEventListener("click", async () => { await saveQuizProgress(); showApp(quiz.greetingName); });

    if (s === 1) {
      document.getElementById("qFirstName").addEventListener("input", e => quiz.firstName = e.target.value);
      document.getElementById("qLastName").addEventListener("input", e => quiz.lastName = e.target.value);
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 2; renderQuiz(); });
    } else if (s === 2) {
      document.getElementById("qAge").addEventListener("input", e => quiz.ageRange = e.target.value);
      document.getElementById("qGrade").addEventListener("input", e => {
        quiz.gradeLabel = e.target.value;
        const match = t.gradeOptions.find(g => g[1] === e.target.value);
        quiz.grade = match ? match[0] : e.target.value || null;
      });
      document.getElementById("qArea").addEventListener("input", e => quiz.area = e.target.value);
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 3; renderQuiz(); });
    } else if (s === 3) {
      quizContentEl.querySelectorAll("[data-topic]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topic;
          const i = quiz.interestTopics.indexOf(v);
          if (i === -1) quiz.interestTopics.push(v); else quiz.interestTopics.splice(i, 1);
          renderQuiz();
        }));
      quizContentEl.querySelectorAll("[data-topic-remove]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topicRemove;
          quiz.interestTopics = quiz.interestTopics.filter(x => x !== v);
          renderQuiz();
        }));
      document.getElementById("qAddTopicBtn").addEventListener("click", () => {
        const input = document.getElementById("qAddTopic");
        const v = input.value.trim();
        if (v && !quiz.interestTopics.includes(v)) quiz.interestTopics.push(v);
        renderQuiz();
      });
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 4; renderQuiz(); });
    } else if (s === 4) {
      quizContentEl.querySelectorAll("[data-atype]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.atype;
          const i = quiz.activityTypes.indexOf(v);
          if (i === -1) quiz.activityTypes.push(v); else quiz.activityTypes.splice(i, 1);
          renderQuiz();
        }));
      if (nextBtn) nextBtn.addEventListener("click", finishQuiz);
    } else if (s === 0) {
      if (nextBtn) nextBtn.addEventListener("click", () => { quiz.step = 1; renderQuiz(); });
    }
  }

  async function saveQuizProgress() {
    await sb.from("user_preferences").upsert({
      user_id: quiz.userId,
      first_name: quiz.firstName || null,
      last_name: quiz.lastName || null,
      age_range: quiz.ageRange || null,
      grade: quiz.grade || null,
      area: quiz.area || null,
      activity_types: quiz.activityTypes,
      interest_topics: quiz.interestTopics,
      interest_other: quiz.interestOther || null
    });
  }

  async function finishQuiz() {
    await saveQuizProgress();
    quiz.step = 5;
    renderQuiz();
  }
  </script>
</body>
</html>
