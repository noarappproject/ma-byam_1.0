  <script>
  // ---- Activities come from the database, not from this file. ----
  // scrape-activities refreshes the table every morning and the app reads
  // whatever it last wrote. The last good copy is kept on the device so the
  // catalog still shows while the free-tier project is paused. Only the
  // columns the screens actually read are fetched and stored, which keeps that
  // copy to a few dozen KB instead of a mirror of the whole 48-column table.
  const ACTIVITY_COLS = [
    "id", "item_kind", "schedule_type", "category", "topics", "title",
    "short_description", "description", "organization_name", "location_name",
    "neighborhood", "start_date", "end_date", "start_time", "end_time",
    "recurrence_freq", "recurrence_days", "sessions_count", "age_min", "age_max",
    "is_accessible", "price", "price_period", "registration_required",
    "registration_url", "registration_deadline", "capacity", "spots_left",
    "source_url", "source_name", "status", "image_url", "created_at"
  ].join(",");
  const ACTIVITIES_CACHE_KEY = "mb_activities_v1";

  // Every activity field is now written by the scraper from third-party sites,
  // and every screen renders it through innerHTML. Escaping once here, where
  // rows enter the app, covers all of those screens at the seam instead of at
  // each of a dozen templates. Nothing sets activity text via textContent, so
  // nothing double-escapes; URLs end up in href/src attributes, where the HTML
  // parser decodes the entities back.
  function htmlSafeActivity(a) {
    const out = {};
    for (const [k, v] of Object.entries(a)) {
      out[k] = typeof v === "string" ? escHtml(v) : Array.isArray(v) ? v.map(x => typeof x === "string" ? escHtml(x) : x) : v;
    }
    return out;
  }

  function readActivitiesCache() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ACTIVITIES_CACHE_KEY) || "null");
      return Array.isArray(parsed?.rows) ? parsed.rows.map(htmlSafeActivity) : [];
    } catch { return []; }
  }

  let activities = readActivitiesCache();
  // "ready" as soon as there is anything to show, from either source. The
  // other three only ever describe a device with nothing on it: still asking
  // ("loading"), asked and could not reach the server ("unavailable"), or
  // reached it and it genuinely has nothing published ("empty").
  let activitiesStatus = activities.length ? "ready" : "loading";

  const CATEGORY_COLOR = {
    sport: "#E8353F", tech: "#1B5EE8", art: "#FF3D8B", music: "#7B3FD9",
    stage: "#FF5117", nature: "#16A34A", volunteer: "#0E9594", leadership: "#B07908",
    learning: "#0E7FB8", gaming: "#C026A3", wellbeing: "#6E9E1F"
  };

  const LOCALE_TAG = { he: "he-IL", ar: "ar-IL", en: "en-GB", ru: "ru-RU" };

  // ---- Icons. One drawn set, one stroke weight; nothing here is an emoji. ----
  const ICONS = {
    calendar: '<rect x="3.2" y="5" width="17.6" height="16" rx="2.6"/><path d="M8 3v4M16 3v4M3.2 10h17.6"/>',
    repeat: '<path d="M4 9.5A5.5 5.5 0 0 1 9.5 4h9M18.5 14.5A5.5 5.5 0 0 1 13 20H4"/><path d="M15.5 1.5 18.5 4l-3 2.5M8.5 17.5 5.5 20l3 2.5"/>',
    pin: '<path d="M12 21.2s-7-6.3-7-11.3a7 7 0 1 1 14 0c0 5-7 11.3-7 11.3z"/><circle cx="12" cy="9.9" r="2.6"/>',
    clock: '<circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2"/>',
    users: '<circle cx="9.2" cy="8" r="3.4"/><path d="M2.8 20c0-3.7 2.9-6.1 6.4-6.1s6.4 2.4 6.4 6.1"/><path d="M16.4 4.9a3.2 3.2 0 0 1 0 6.2M18.2 14.4c2 .7 3 2.5 3 5.6"/>',
    // A heart: this app saves flyers, it does not pin them — ICONS.pin stays
    // location-only so the two never read as the same action.
    heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
    bell: '<path d="M6.2 10.4a5.8 5.8 0 0 1 11.6 0c0 4 1.4 5.6 1.4 5.6H4.8s1.4-1.6 1.4-5.6z"/><path d="M9.8 19.2a2.4 2.4 0 0 0 4.4 0"/>',
    search: '<circle cx="11" cy="11" r="7.2"/><path d="m20.5 20.5-4.1-4.1"/>',
    chevron: '<path d="M14.5 6 8.8 12l5.7 6"/>',
    chevronBack: '<path d="M9.5 6l5.7 6-5.7 6"/>',
    users: '<circle cx="9.2" cy="8" r="3.4"/><path d="M2.8 20c0-3.7 2.9-6.1 6.4-6.1s6.4 2.4 6.4 6.1"/><path d="M16.4 4.9a3.2 3.2 0 0 1 0 6.2M18.2 14.4c2 .7 3 2.5 3 5.6"/>',
    ticket: '<path d="M3.4 8.4V6.2a1.4 1.4 0 0 1 1.4-1.4h14.4a1.4 1.4 0 0 1 1.4 1.4v2.2a3.6 3.6 0 0 0 0 7.2v2.2a1.4 1.4 0 0 1-1.4 1.4H4.8a1.4 1.4 0 0 1-1.4-1.4v-2.2a3.6 3.6 0 0 0 0-7.2z"/><path d="M12 8v1.8M12 13.2V15"/>',
    coin: '<circle cx="12" cy="12" r="8.4"/><path d="M12 7v10M14.8 9.4c0-1.2-1.3-2-2.8-2s-2.8.8-2.8 2 1.3 2 2.8 2 2.8.9 2.8 2.1-1.3 2-2.8 2-2.8-.8-2.8-2"/>',
    age: '<circle cx="12" cy="8" r="3.6"/><path d="M5.2 20.4c0-3.8 3-6.2 6.8-6.2s6.8 2.4 6.8 6.2"/>',
    alert: '<circle cx="12" cy="12" r="8.6"/><path d="M12 7.8v5M12 15.8v.6"/>',
    check: '<path d="m5.5 12.8 4.2 4.2 8.8-9.6"/>',
    // Sliders, not a cog: at 20px a toothed cog turns to mush, and the radial
    // tick version of it reads as a sun.
    gear: '<path d="M4 7.5h10M18 7.5h2M4 16.5h2M10 16.5h10"/><circle cx="16" cy="7.5" r="2.2"/><circle cx="8" cy="16.5" r="2.2"/>',
    pencil: '<path d="M4.4 19.6h3.4L19 8.4a2.2 2.2 0 0 0-3.1-3.1L4.7 16.5z"/><path d="M14.4 6.8l2.8 2.8"/>',
    lock: '<rect x="4.6" y="10.4" width="14.8" height="10.2" rx="2.4"/><path d="M8.4 10.4V7.8a3.6 3.6 0 0 1 7.2 0v2.6"/>',
    x: '<path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/>',
    // A chevron pointing down. The bare `chevron` is direction-dependent and
    // flips with the locale; a select caret must not.
    caretDown: '<path d="M6.4 9.6 12 15.2l5.6-5.6"/>',
    camera: '<path d="M3.4 8.6h3.3l1.5-2.6h7.6l1.5 2.6h3.3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3.4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.6" r="3.9"/>',
    eye: '<path d="M2.2 12S5.9 5.8 12 5.8 21.8 12 21.8 12 18.1 18.2 12 18.2 2.2 12 2.2 12z"/><circle cx="12" cy="12" r="3.1"/>',
    eyeOff: '<path d="M4.2 4.2 19.8 19.8"/><path d="M9.6 9.7A3.1 3.1 0 0 0 12 15.1c.86 0 1.64-.35 2.2-.92"/><path d="M6.5 6.7C3.9 8.3 2.2 12 2.2 12s3.7 6.2 9.8 6.2c1.7 0 3.2-.48 4.5-1.2M17.9 15A13 13 0 0 0 21.8 12S18.1 5.8 12 5.8c-.83 0-1.6.11-2.33.31"/>',
    plus: '<path d="M12 5.6v12.8M5.6 12h12.8"/>',
    star: '<path d="M12 3.6l2.63 5.52 5.97.85-4.32 4.3 1.02 6.13L12 17.5l-5.3 2.9 1.02-6.13-4.32-4.3 5.97-.85z"/>'
  };

  function icon(name, cls) {
    return `<svg class="ic ${cls || ""}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;
  }

  // Everything rendered before reviews came from the hardcoded activity array or
  // from format-constrained usernames. A review body is the first free text a
  // stranger can put on someone else's screen, and it goes in through innerHTML
  // like the rest of the app — so it has to be escaped at the seam.
  function escHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ---- Category plates. Every activity gets a risograph poster built from its
  // category's ink: a knocked-out silhouette, one overprinted black form, a
  // halftone field, and a misregistered ghost offset a few units off register.
  // Deterministic per activity id, so a card looks the same on every render. ----
  const ART_PAPER = "#FFF6EE";
  let artUid = 0;

  function artSeed(id) {
    const s = String(id || "plate");
    let h = 7;
    for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) % 99991;
    return h;
  }

  const CATEGORY_ART = {
    sport: () => `<circle cx="74" cy="24" r="30" fill="${ART_PAPER}" opacity=".92"/>
      <path d="M74 -6v60M44 24h60M56 4a42 42 0 0 0 36 40" stroke="#000" stroke-opacity=".22" stroke-width="3.4" fill="none"/>
      <path d="M4 62q24-30 58-16" stroke="#000" stroke-opacity=".3" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="52" r="11" fill="#000" fill-opacity=".24"/>`,
    tech: () => `<rect x="30" y="14" width="44" height="44" rx="5" fill="${ART_PAPER}" opacity=".92"/>
      <rect x="44" y="28" width="16" height="16" rx="2" fill="#000" fill-opacity=".3"/>
      <path d="M30 24H10M30 36H14M30 48H10M74 24h20M74 36h16M74 48h20M44 14V0M60 14V0M44 58v14M60 58v14" stroke="#000" stroke-opacity=".26" stroke-width="3" stroke-linecap="round"/>`,
    art: () => `<path d="M18 60q-10-32 16-44 30-14 44 10 12 22-14 32-28 12-46 2z" fill="${ART_PAPER}" opacity=".92"/>
      <circle cx="38" cy="28" r="8" fill="#000" fill-opacity=".3"/>
      <circle cx="62" cy="42" r="11" fill="#000" fill-opacity=".2"/>
      <path d="M86 4 62 32" stroke="#000" stroke-opacity=".3" stroke-width="6" stroke-linecap="round"/>`,
    music: () => `<g fill="${ART_PAPER}" opacity=".92">
        <rect x="14" y="30" width="8" height="16" rx="4"/><rect x="28" y="18" width="8" height="40" rx="4"/>
        <rect x="42" y="8" width="8" height="60" rx="4"/><rect x="56" y="22" width="8" height="32" rx="4"/>
        <rect x="70" y="14" width="8" height="48" rx="4"/><rect x="84" y="28" width="8" height="20" rx="4"/>
      </g>
      <circle cx="76" cy="52" r="15" fill="#000" fill-opacity=".26"/>`,
    stage: () => `<path d="M50 0 96 72H4z" fill="${ART_PAPER}" opacity=".9"/>
      <path d="M50 34a20 20 0 0 1 20 38H30a20 20 0 0 1 20-38z" fill="#000" fill-opacity=".28"/>
      <circle cx="50" cy="10" r="7" fill="#000" fill-opacity=".34"/>`,
    nature: () => `<circle cx="76" cy="18" r="14" fill="${ART_PAPER}" opacity=".92"/>
      <path d="M-4 72 34 22l26 34 14-18 30 34z" fill="${ART_PAPER}" opacity=".88"/>
      <path d="M34 22 60 56 46 72H8z" fill="#000" fill-opacity=".26"/>`,
    volunteer: () => `<path d="M50 66S22 48 22 30a14 14 0 0 1 28-6 14 14 0 0 1 28 6c0 18-28 36-28 36z" fill="${ART_PAPER}" opacity=".92"/>
      <circle cx="50" cy="34" r="10" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="3.4"/>
      <circle cx="50" cy="34" r="20" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="3.4"/>`,
    leadership: () => `<g fill="${ART_PAPER}" opacity=".92">
        <path d="M6 4h34l14 14-14 14H6z"/><path d="M30 24h34l14 14-14 14H30z"/>
      </g>
      <path d="M18 46h34l14 14-14 14H18z" fill="#000" fill-opacity=".26"/>`,
    learning: () => `<path d="M50 16 12 8v52l38 8z" fill="${ART_PAPER}" opacity=".92"/>
      <path d="M50 16 88 8v52l-38 8z" fill="${ART_PAPER}" opacity=".7"/>
      <path d="M50 16v52" stroke="#000" stroke-opacity=".34" stroke-width="4"/>
      <path d="M22 20l18 4M22 32l18 4M60 20l18 4M60 32l18 4" stroke="#000" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>`,
    gaming: () => `<g fill="${ART_PAPER}" opacity=".92">
        <rect x="30" y="8" width="16" height="16"/><rect x="14" y="24" width="16" height="16"/>
        <rect x="30" y="24" width="16" height="16"/><rect x="46" y="24" width="16" height="16"/>
        <rect x="30" y="40" width="16" height="16"/>
      </g>
      <g fill="#000" fill-opacity=".28"><circle cx="76" cy="30" r="8"/><circle cx="90" cy="48" r="8"/><rect x="62" y="48" width="16" height="16"/></g>`,
    wellbeing: () => `<g fill="none" stroke="${ART_PAPER}" stroke-opacity=".92" stroke-width="5" stroke-linecap="round">
        <path d="M-4 20q26-16 52 0t56 0"/><path d="M-4 38q26-16 52 0t56 0"/><path d="M-4 56q26-16 52 0t56 0"/>
      </g>
      <circle cx="70" cy="36" r="16" fill="#000" fill-opacity=".24"/>`
  };

  function categoryArtSvg(a) {
    const seed = artSeed(a.id || a.title);
    const uid = "p" + (artUid++);
    const recipe = CATEGORY_ART[a.category] || CATEGORY_ART.stage;
    const dx = ((seed % 5) - 2) * 1.4;
    const dy = (((seed >> 3) % 5) - 2) * 1.4;
    const flip = (seed >> 6) % 2 ? ' transform="scale(-1,1) translate(-100,0)"' : "";
    const inner = recipe();
    return `<svg viewBox="0 0 100 72" preserveAspectRatio="xMidYMid slice" role="presentation" style="opacity:var(--halftone-opacity)">
      <defs>
        <pattern id="ht${uid}" width="4.6" height="4.6" patternUnits="userSpaceOnUse">
          <circle cx="2.3" cy="2.3" r="1.05" fill="${ART_PAPER}"/>
        </pattern>
      </defs>
      <g${flip}>
        <g opacity=".3" transform="translate(${dx},${dy})">${inner}</g>
        <g>${inner}</g>
      </g>
      <rect width="100" height="72" fill="url(#ht${uid})" opacity=".14"/>
    </svg>`;
  }

  function plateArtHtml(a, cls) {
    if (a.image_url) {
      // The generated plate sits under the photo: a scraped image URL that 404s
      // or blocks hotlinking removes itself and leaves the plate, not a broken box.
      return `<div class="plate-art ${cls || ""}" data-cat="${a.category}">${categoryArtSvg(a)}<img src="${a.image_url}" alt="" loading="lazy" onerror="this.remove()"></div>`;
    }
    return `<div class="plate-art ${cls || ""}" data-cat="${a.category}">${categoryArtSvg(a)}</div>`;
  }

  // ---- Gate artwork. Two plates off the same press: the welcome sheet is
  // three inks overprinted wet, the signup sheet is the flyer wall they end
  // up on. Overprint is a real multiply on paper and a screen on black stock. ----
  // A halftone screen is a direct paper-dot fill, never an SVG <mask>: a mask
  // reads luminance, so dark dots on transparent ground mask the whole plate out.
  function halftonePattern(uid, gap) {
    return `<pattern id="ht${uid}" width="${gap}" height="${gap}" patternUnits="userSpaceOnUse">
      <circle cx="${gap / 2}" cy="${gap / 2}" r="${gap * 0.22}" fill="${ART_PAPER}"/>
    </pattern>`;
  }

  function welcomeArtSvg() {
    const ink = 'style="mix-blend-mode:var(--art-blend)"';
    return `<svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid slice" role="presentation">
      <defs>${halftonePattern("w", 2.5)}</defs>
      <rect width="100" height="80" fill="var(--art-ground)"/>
      <circle cx="34" cy="33" r="25" fill="var(--cat-leadership)" ${ink}/>
      <circle cx="63" cy="45" r="29" fill="var(--accent)" ${ink}/>
      <circle cx="45" cy="52" r="19" fill="var(--cat-tech)" ${ink}/>
      <rect width="100" height="80" fill="url(#htw)" opacity=".13"/>
      <g stroke-linecap="round" stroke-width="2.6" fill="none">
        <path d="M14 14l4.5-3.5" stroke="var(--cat-nature)"/>
        <path d="M84 11l-3.5 4.5" stroke="var(--cat-art)"/>
        <path d="M90 28l4.5 1" stroke="var(--cat-tech)"/>
        <path d="M9 44l-4.5 2" stroke="var(--accent)"/>
        <path d="M21 70l3 3.5" stroke="var(--cat-gaming)"/>
        <path d="M79 71l4.5-2" stroke="var(--cat-leadership)"/>
        <path d="M52 7l1-4.5" stroke="var(--cat-volunteer)"/>
        <path d="M94 60l-4.5 3" stroke="var(--cat-nature)"/>
        <path d="M6 24l4.5 1.5" stroke="var(--cat-gaming)"/>
        <path d="M70 4l1.5 4" stroke="var(--cat-tech)"/>
      </g>
    </svg>`;
  }

  // Profile banner: the same press, keyed off the username so every account
  // gets its own overprint instead of one shared decorative strip.
  function bannerArtSvg(seedStr) {
    const seed = artSeed(seedStr);
    const inks = ["--accent", "--cat-tech", "--cat-art", "--cat-nature", "--cat-gaming", "--cat-leadership", "--cat-volunteer"];
    // Offset the second pick so the two inks can never land on the same colour —
    // two identical circles read as a rendering fault, not as a design.
    const a = inks[seed % inks.length];
    const b = inks[(seed % inks.length + 1 + (seed >> 3) % (inks.length - 1)) % inks.length];
    const ink = 'style="mix-blend-mode:var(--art-blend)"';
    return `<svg viewBox="0 0 100 34" preserveAspectRatio="xMidYMid slice" role="presentation">
      <defs>${halftonePattern("b", 1.7)}</defs>
      <rect width="100" height="34" fill="var(--art-ground)"/>
      <circle cx="${18 + (seed % 12)}" cy="${8 + (seed % 7)}" r="20" fill="var(${a})" ${ink}/>
      <circle cx="${68 + ((seed >> 2) % 14)}" cy="${24 - (seed % 9)}" r="17" fill="var(${b})" ${ink}/>
      <rect width="100" height="34" fill="url(#htb)" opacity=".12"/>
    </svg>`;
  }

  // A null banner_url is the normal state, not a missing asset: the generated
  // risograph banner IS the default, so a new account never shows a blank strip.
  function bannerHtml(seedStr, bannerUrl) {
    if (bannerUrl) return `<img class="banner-img" src="${bannerUrl}" alt="">`;
    return bannerArtSvg(seedStr);
  }

  function authArtSvg() {
    const ink = 'style="mix-blend-mode:var(--art-blend)"';
    return `<svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid slice" role="presentation">
      <defs>${halftonePattern("a", 2.4)}</defs>
      <rect width="100" height="80" fill="var(--art-ground)"/>
      <g transform="rotate(-8 26 42)">
        <rect x="7" y="18" width="38" height="48" rx="1.5" fill="var(--cat-tech)" ${ink}/>
      </g>
      <g transform="rotate(4 52 36)">
        <rect x="32" y="10" width="40" height="52" rx="1.5" fill="var(--accent)" ${ink}/>
        <g fill="none" stroke="${ART_PAPER}" stroke-opacity=".8" stroke-width="2.4" stroke-linecap="round">
          <path d="M39 24h26M39 32h18M39 40h22M39 48h14"/>
        </g>
      </g>
      <g transform="rotate(-3 77 46)">
        <rect x="59" y="23" width="36" height="46" rx="1.5" fill="var(--cat-art)" ${ink}/>
        <g fill="none" stroke="${ART_PAPER}" stroke-opacity=".75" stroke-width="2.2" stroke-linecap="round">
          <path d="M65 36h22M65 44h15M65 52h19"/>
        </g>
      </g>
      <rect width="100" height="80" fill="url(#hta)" opacity=".12"/>
      <g fill="var(--ink)" opacity=".45">
        <circle cx="26" cy="22" r="1.7"/><circle cx="52" cy="14" r="1.7"/><circle cx="77" cy="27" r="1.7"/>
      </g>
    </svg>`;
  }

  function kindLabel(a) {
    if (a.item_kind === "event") return L().kindEvent;
    if (a.item_kind === "activity" && a.schedule_type === "recurring") return L().kindClub;
    return L().kindActivity;
  }

  function fmtDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return new Intl.DateTimeFormat(LOCALE_TAG[currentLang] || "he-IL", { day: "numeric", month: "long", year: "numeric" }).format(d);
  }

  // Scraped clubs often list only a name and ages, with days and hours on the
  // organizer's own page; an unknown time is left out, never shown as "00:00".
  function fmtTimeRange(a) {
    if (!a.start_time) return "";
    return a.end_time ? `${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}` : L().startsAt(a.start_time.slice(0,5));
  }

  function whenText(a) {
    if (a.schedule_type === "recurring") {
      const days = (a.recurrence_days || []).map(d => L().days[d]).join(", ");
      if (!days) return { main: L().scheduleAtOrganizer, sub: fmtTimeRange(a) };
      return { main: L().weeklyOn(days), sub: [fmtTimeRange(a), L().noEndDate].filter(Boolean).join(" · ") };
    }
    const range = a.end_date && a.end_date !== a.start_date
      ? `${fmtDate(a.start_date)} – ${fmtDate(a.end_date)}`
      : fmtDate(a.start_date);
    return { main: range, sub: fmtTimeRange(a) };
  }

  function ageText(a) {
    if (a.age_min == null && a.age_max == null) return L().allAges;
    if (a.age_min != null && a.age_max != null) return L().ageRangeText(a.age_min, a.age_max);
    if (a.age_min != null) return L().ageFrom(a.age_min);
    return L().ageTo(a.age_max);
  }

  function priceText(a) {
    if (a.price == null) return L().priceNotPublished;
    if (a.price === 0) return L().free;
    const period = { total: L().perTotal, per_session: L().perSession, monthly: L().perMonth }[a.price_period] || "";
    return `${a.price} ₪${period ? " · " + period : ""}`;
  }

  function ctaInfo(a) {
    if (a.registration_url) return { href: a.registration_url, label: L().register, kind: "primary" };
    if (a.source_url) return { href: a.source_url, label: L().moreInfoSource, kind: "secondary" };
    return { href: null, label: L().registrationSoon, kind: "disabled" };
  }

  const searchInput = document.getElementById("searchInput");
  const previewRecommendedEl = document.getElementById("previewRecommended");
  const previewNewEl = document.getElementById("previewNew");

  const archiveScreenEl = document.getElementById("archiveScreen");
  const archiveSearchInputEl = document.getElementById("archiveSearchInput");
  const archiveCategoryChipsEl = document.getElementById("archiveCategoryChips");
  const archiveTopicChipsEl = document.getElementById("archiveTopicChips");
  const archiveListEl = document.getElementById("archiveListEl");
  const archiveState = { mode: "all", q: "", category: null, topic: null };

  const socialScreenEl = document.getElementById("socialScreen");
  const socialContentEl = document.getElementById("socialContent");

  const favoritesScreenEl = document.getElementById("favoritesScreen");
  const favSearchInputEl = document.getElementById("favSearchInput");
  const favCategoryChipsEl = document.getElementById("favCategoryChips");
  const favTopicChipsEl = document.getElementById("favTopicChips");
  const favSortRowEl = document.getElementById("favSortRow");
  const favSortSelectEl = document.getElementById("favSortSelect");
  const favListEl = document.getElementById("favListEl");

  let favoriteIds = new Set();
  let favoritedAt = new Map();
  const favState = { q: "", category: null, topic: null, sort: "soonest" };
  let favDetailOpenId = null;

  // activityId -> [{id, username, avatar_url, is_private}]: people you follow
  // (accepted only) who favorited that activity — real signal only, same rule
  // as everywhere else in this app (see registrations note). Batch-loaded once
  // per login rather than per card, so showing it next to every activity in
  // every list costs one query pair, not one round trip per card.
  let followedFavoritesByActivity = new Map();

  const otherProfileScreenEl = document.getElementById("otherProfileScreen");
  const otherProfileContentEl = document.getElementById("otherProfileContent");
  const followListScreenEl = document.getElementById("followListScreen");
  const followListContentEl = document.getElementById("followListContent");

  let socialCounts = { followers: 0, following: 0, pending: 0 };
  let otherProfileUserId = null;
  let followListKind = "followers";
  let followListUserId = null;
  const userSearchState = { q: "" };
  let returnToScreen = null;
  let currentInterestTopics = [];

  // Derived on every call, not once at load: the catalog now arrives after the
  // script runs, so a constant computed here would freeze on an empty or
  // stale list and leave the category chips missing for the whole session.
  function categoryOrder() {
    return [...new Set(activities.map(a => a.category))];
  }

  function matchesQuery(a, q) {
    if (!q) return true;
    const hay = [a.title, a.short_description, a.description, a.organization_name, a.neighborhood, a.location_name].join(" ");
    return hay.includes(q);
  }

  function topicsForCategory(list, cat) {
    const set = new Set();
    list.filter(a => a.category === cat).forEach(a => (a.topics || []).forEach(t => set.add(t)));
    return [...set];
  }

  // ---- Recommendations: scored from the quiz's interest_topics, the
  // topics/categories of the user's own favorited activities, and — the
  // strongest signal, since it's a real person's choice rather than an
  // inferred topic overlap — how many people you follow saved something you
  // haven't. No separate search-history tracking (deliberately kept out of
  // scope, see CLAUDE.md). ----
  function favoritedTopicsAndCategories() {
    const topics = new Set();
    const categories = new Set();
    activities.filter(a => a.id && favoriteIds.has(a.id)).forEach(a => {
      categories.add(a.category);
      (a.topics || []).forEach(t => topics.add(t));
    });
    return { topics, categories };
  }

  // Only for activities the viewer hasn't saved themselves — once it's
  // already in their own favorites, the "friends discovered this for you"
  // push has done its job. Weighted well above a topic match (worth 2 at
  // most) so it's monotonic: each additional friend who saved it pushes the
  // card further forward, the way the feature was asked for.
  const FRIEND_SAVE_WEIGHT = 4;
  function friendSaveBoost(a) {
    if (!a.id || favoriteIds.has(a.id)) return 0;
    return followedFavoritesFor(a.id).length * FRIEND_SAVE_WEIGHT;
  }

  function recommendationScore(a, signal) {
    let score = 0;
    (a.topics || []).forEach(t => {
      if (currentInterestTopics.includes(t)) score += 2;
      if (signal.topics.has(t)) score += 1;
    });
    if (signal.categories.has(a.category)) score += 0.5;
    score += friendSaveBoost(a);
    return score;
  }

  function recommendedActivities() {
    const signal = favoritedTopicsAndCategories();
    const hasFriendSignal = [...followedFavoritesByActivity.keys()].some(id => !favoriteIds.has(id));
    const hasSignal = currentInterestTopics.length > 0 || signal.topics.size > 0 || signal.categories.size > 0 || hasFriendSignal;
    const sorted = [...activities];
    if (!hasSignal) {
      sorted.sort((a, b) => activityTimestamp(a) - activityTimestamp(b));
    } else {
      sorted.sort((a, b) => recommendationScore(b, signal) - recommendationScore(a, signal) || activityTimestamp(a) - activityTimestamp(b));
    }
    return sorted;
  }

  function newestActivities() {
    return [...activities].sort((a, b) => {
      if (a.created_at && b.created_at) return new Date(b.created_at) - new Date(a.created_at);
      return activities.indexOf(b) - activities.indexOf(a);
    });
  }

  // ---- The date stamp. A one-off carries its day; a repeating club carries
  // its rhythm, because "12 בספטמבר" is a lie about a weekly חוג. ----
  function dateStampHtml(a) {
    const t = L();
    if (a.schedule_type === "recurring") {
      const day = (a.recurrence_days && a.recurrence_days.length) ? t.daysShort[a.recurrence_days[0]] : null;
      // No known weekday: no stamp, rather than one that claims "weekly".
      if (!day) return "";
      return `<div class="date-stamp is-recurring">
        <b>${day || t.stampWeekly}</b><span>${day ? t.stampWeekly : ""}</span>
      </div>`;
    }
    const d = new Date(a.start_date + "T00:00:00");
    if (Number.isNaN(d.getTime())) return "";
    const month = new Intl.DateTimeFormat(LOCALE_TAG[currentLang] || "he-IL", { month: "short" }).format(d);
    return `<div class="date-stamp"><b class="num">${d.getDate()}</b><span>${month}</span></div>`;
  }

  function saveBtnHtml(a, cls) {
    if (isGuestMode() || !a.id) return "";
    const isFav = favoriteIds.has(a.id);
    return `<button type="button" class="${cls}" data-fav-id="${a.id}" aria-pressed="${isFav}"
      aria-label="${isFav ? L().unfavoriteLabel : L().favoriteLabel}">${icon("heart")}</button>`;
  }

  // Friends who saved this, wherever the activity itself appears — independent
  // of whether the viewer saved it themselves. `metaClass` borrows whichever
  // meta-row style the caller already uses (card-lg-meta / card-sm-meta /
  // fav-row-meta) so this reads as one more fact line, not a bolted-on widget.
  function friendsMetaHtml(activityId, metaClass) {
    const users = followedFavoritesFor(activityId);
    if (!users.length) return "";
    const shown = users.slice(0, 3);
    const names = shown.map(u => bidiIsolate(u.username || "?"));
    return `<p class="${metaClass} friends-meta">
      <span class="mini-avatar-stack">${shown.map(u => `<span class="avatar avatar-xs" style="${userAvatarStyle(u)}">${u.avatar_url && !u.is_private ? "" : (u.username || "?").charAt(0).toUpperCase()}</span>`).join("")}</span>
      <span>${L().savedByLine(names, users.length)}</span>
    </p>`;
  }

  // Cards carry a nested save control, so they are role=button divs — a real
  // <button> inside a <button> gets hoisted out by the parser and breaks both.
  // Recommended register: the ink field owns the card, type sits inside it.
  function cardLgHtml(a, i) {
    const when = whenText(a);
    return `
      <div class="card-lg ink-in" role="button" tabindex="0" data-open-id="${a.id}" data-cat="${a.category}" style="animation-delay:${i * 70}ms">
        ${plateArtHtml(a)}
        ${dateStampHtml(a)}
        ${saveBtnHtml(a, "save-btn")}
        <span class="card-lg-scrim"></span>
        <span class="card-lg-body">
          <h3 class="card-lg-title">${a.title}</h3>
          <p class="card-lg-meta">${icon("pin")}<span>${a.neighborhood || a.location_name}</span></p>
          <p class="card-lg-meta">${icon("clock")}<span>${when.sub || when.main}</span></p>
          ${friendsMetaHtml(a.id, "card-lg-meta")}
        </span>
      </div>`;
  }

  // New register: smaller, quieter, and it keeps going downward.
  function cardSmHtml(a, i) {
    const when = whenText(a);
    return `
      <div class="card-sm ink-in" role="button" tabindex="0" data-open-id="${a.id}" data-cat="${a.category}" style="animation-delay:${i * 55}ms">
        ${plateArtHtml(a)}
        <span class="card-sm-body">
          <span class="card-sm-kind">${kindLabel(a)}</span>
          <h3 class="card-sm-title">${a.title}</h3>
          <p class="card-sm-meta">${icon("calendar")}<span>${when.main}</span></p>
          ${friendsMetaHtml(a.id, "card-sm-meta")}
        </span>
        ${saveBtnHtml(a, "card-sm-save")}
      </div>`;
  }

  // ---- Rail plumbing. scrollLeft is 0 at the inline start and runs negative
  // in RTL, so every check works off its magnitude and every scroll is signed
  // by direction — that keeps one implementation correct in both directions. ----
  const HOME_NEW_STEP = 4;
  const homeState = { newShown: HOME_NEW_STEP };

  function railDirSign() { return LANG_DIR[currentLang] === "rtl" ? -1 : 1; }

  // ---- Rail interaction. Native swipe on touch; click-drag with momentum on a
  // pointer; a slim meter showing where you are in the row.
  //
  // Deliberately NOT hijacking the vertical wheel. Translating vertical intent
  // sideways means a plain page scroll stops dead whenever the cursor happens to
  // pass over a rail, which is the single most annoying thing a carousel can do.
  // Trackpads already send deltaX and the browser handles that natively, so
  // horizontal wheeling needs no code at all.
  function updateRailState(wrap) {
    const rail = wrap.querySelector(".rail");
    if (!rail) return;
    const pos = Math.abs(rail.scrollLeft);
    const max = rail.scrollWidth - rail.clientWidth;
    const EDGE = 20;
    wrap.dataset.canPrev = String(pos > EDGE);
    wrap.dataset.canNext = String(max > EDGE && pos < max - EDGE);

    const thumb = wrap.querySelector(".rail-progress-thumb");
    if (thumb) {
      // Thumb length is the visible fraction; its travel is the scrolled fraction.
      const frac = max > 0 ? Math.min(1, Math.max(0, pos / max)) : 0;
      const visible = rail.scrollWidth > 0 ? Math.min(1, rail.clientWidth / rail.scrollWidth) : 1;
      const travel = (1 - visible) * 100;
      thumb.style.width = (visible * 100) + "%";
      const dir = LANG_DIR[currentLang] === "rtl" ? -1 : 1;
      thumb.style.transform = "translateX(" + (dir * frac * travel) + "%)";
    }
  }

  function wireRail(wrap) {
    const rail = wrap.querySelector(".rail");
    rail.addEventListener("scroll", () => updateRailState(wrap), { passive: true });
    new ResizeObserver(() => updateRailState(wrap)).observe(rail);

    let down = false, dragged = false, startX = 0, startScroll = 0;
    let lastX = 0, lastT = 0, velocity = 0;
    let glide = null;
    const DRAG_MIN = 5;
    const prevSnap = rail.style.scrollSnapType;

    const stopGlide = () => {
      if (!glide) return;
      cancelAnimationFrame(glide.frame);
      clearTimeout(glide.safety);
      glide.settle();
    };

    // Momentum. Friction decay per frame, normalised to ~60fps so a 120Hz screen
    // does not coast twice as short. The settle is owned by a timer as well as by
    // the frame loop: requestAnimationFrame is paused in a backgrounded tab, and
    // without that guarantee the rail would freeze mid-glide with snapping off.
    const startGlide = (v0) => {
      const max = rail.scrollWidth - rail.clientWidth;
      const minScroll = railDirSign() < 0 ? -max : 0;
      const maxScroll = railDirSign() < 0 ? 0 : max;
      const g = {
        frame: 0, safety: 0, done: false,
        settle() {
          if (this.done) return;
          this.done = true;
          rail.style.scrollSnapType = prevSnap;
          if (glide === this) glide = null;
          updateRailState(wrap);
        }
      };
      let v = v0;
      let last = performance.now();
      const tick = (now) => {
        if (g.done) return;
        const dt = Math.min(50, now - last) || 16.7;
        last = now;
        v *= Math.pow(0.94, dt / 16.7);
        const next = Math.min(maxScroll, Math.max(minScroll, rail.scrollLeft - v * dt));
        const hitEdge = next === rail.scrollLeft && Math.abs(v) > 0.01;
        rail.scrollLeft = next;
        if (Math.abs(v) < 0.02 || hitEdge) { clearTimeout(g.safety); g.settle(); return; }
        g.frame = requestAnimationFrame(tick);
      };
      g.frame = requestAnimationFrame(tick);
      g.safety = setTimeout(() => g.settle(), 1400);
      glide = g;
    };

    rail.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      stopGlide();
      down = true; dragged = false;
      startX = lastX = e.clientX;
      lastT = performance.now();
      velocity = 0;
      startScroll = rail.scrollLeft;
    });

    rail.addEventListener("pointermove", (e) => {
      if (!down) return;
      const dx = e.clientX - startX;
      if (!dragged && Math.abs(dx) < DRAG_MIN) return;
      if (!dragged) {
        dragged = true;
        rail.classList.add("is-dragging");
        rail.style.scrollSnapType = "none";
        rail.setPointerCapture(e.pointerId);
      }
      const now = performance.now();
      const dt = now - lastT;
      if (dt > 0) velocity = (e.clientX - lastX) / dt; // px per ms, cursor space
      lastX = e.clientX; lastT = now;
      rail.scrollLeft = startScroll - dx;
      e.preventDefault();
    });

    // A drag ends with a click event that must not open a card. Handled by a
    // self-expiring timestamp rather than a one-shot listener: a listener armed
    // on pointerup waits forever when no click follows (pointer released off the
    // rail, cancelled gesture) and then eats the user next real tap.
    let lastDragEnd = 0;
    rail.addEventListener("click", (e) => {
      if (performance.now() - lastDragEnd < 250) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    const endDrag = (e) => {
      if (!down) return;
      down = false;
      rail.classList.remove("is-dragging");
      if (rail.hasPointerCapture?.(e.pointerId)) rail.releasePointerCapture(e.pointerId);
      if (!dragged) return;
      lastDragEnd = performance.now();
      const stale = performance.now() - lastT > 90;   // finger stopped before release
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce || stale || Math.abs(velocity) < 0.08) {
        rail.style.scrollSnapType = prevSnap;
        updateRailState(wrap);
        return;
      }
      startGlide(velocity);
    };
    rail.addEventListener("pointerup", endDrag);
    rail.addEventListener("pointercancel", endDrag);
    rail.addEventListener("dragstart", (e) => e.preventDefault());

    updateRailState(wrap);
  }

  // Wired from initAppUI, not here: updateRailState reads LANG_DIR, which is
  // declared further down the file and would still be in its dead zone.
  const railWrapRecommendedEl = document.getElementById("railWrapRecommended");

  // The new-activities stack keeps going down: it grows as the user reaches
  // its end, up to the full catalog, then says so instead of ending silently.
  const newSentinelEl = document.getElementById("newSentinel");
  const newAllShownEl = document.getElementById("newAllShown");

  function appendMoreNew() {
    const all = newestActivities();
    if (homeState.newShown >= all.length) return;
    const from = homeState.newShown;
    homeState.newShown = Math.min(all.length, from + HOME_NEW_STEP);
    const slice = all.slice(from, homeState.newShown);
    previewNewEl.insertAdjacentHTML("beforeend", slice.map((a, i) => cardSmHtml(a, i)).join(""));
    updateNewFooter(all.length);
  }

  function updateNewFooter(total) {
    const done = homeState.newShown >= total;
    newAllShownEl.hidden = !done;
    newAllShownEl.textContent = done ? L().allShownMsg : "";
  }

  new IntersectionObserver((entries) => {
    if (entries.some(e => e.isIntersecting) && !appRootEl.hidden) appendMoreNew();
  }, { rootMargin: "300px" }).observe(newSentinelEl);

  function renderHome() {
    const t = L();
    const guest = isGuestMode();
    const name = guest ? t.guestName : (userProfile?.username || "");

    document.getElementById("homeUserHi").textContent = t.homeHi;
    document.getElementById("homeUserName").textContent = name;
    const avatarEl = document.getElementById("homeAvatar");
    if (!guest && userProfile?.avatar_url) {
      avatarEl.style.backgroundImage = `url('${userProfile.avatar_url}')`;
      avatarEl.textContent = "";
    } else {
      avatarEl.style.backgroundImage = "";
      avatarEl.textContent = (name || "?").trim().charAt(0).toUpperCase();
    }
    document.getElementById("homeUserBtn").hidden = false;

    document.getElementById("homeHeadline").textContent = guest ? t.homeHeadlineGuest : t.homeHeadline;
    searchInput.placeholder = t.searchPlaceholder;

    const msgBtn = document.getElementById("homeMessagesBtn");
    msgBtn.innerHTML = icon("bell");
    msgBtn.setAttribute("aria-label", t.messagesLabel);
    msgBtn.hidden = guest;

    document.getElementById("recommendedTitleText").textContent = guest ? t.generalSectionTitle : t.recommendedSectionTitle;
    document.getElementById("newTitleText").textContent = t.newSectionTitle;
    document.getElementById("recommendedArchiveLink").innerHTML = `${t.seeAll}${icon("chevron")}`;
    document.getElementById("newArchiveLink").innerHTML = `${t.seeAll}${icon("chevron")}`;

    // With nothing to show, two empty rails each saying "no matching results"
    // would read as a search that came up dry. Replace both with one notice
    // that says what actually happened.
    const noticeEl = document.getElementById("homeDataNotice");
    const noData = activitiesStatus !== "ready";
    noticeEl.hidden = !noData;
    document.getElementById("recommendedSection").hidden = noData;
    document.getElementById("newSection").hidden = noData;
    if (noData) { noticeEl.innerHTML = dataNoticeHtml(); return; }
    noticeEl.innerHTML = "";

    const recommended = recommendedActivities().slice(0, 6);
    const allNew = newestActivities();
    homeState.newShown = Math.min(allNew.length, Math.max(HOME_NEW_STEP, homeState.newShown));
    const newest = allNew.slice(0, homeState.newShown);
    previewRecommendedEl.innerHTML = recommended.length
      ? recommended.map(cardLgHtml).join("")
      : `<p class="rail-empty">${t.emptyStateMsg}</p>`;
    previewNewEl.innerHTML = newest.length
      ? newest.map(cardSmHtml).join("")
      : `<p class="rail-empty">${t.emptyStateMsg}</p>`;
    updateNewFooter(allNew.length);
    updateRailState(railWrapRecommendedEl);
  }

  function homeCardHandler(e) {
    const fav = e.target.closest("[data-fav-id]");
    if (fav) { e.stopPropagation(); toggleFavorite(fav.dataset.favId); return; }
    const el = e.target.closest("[data-open-id]");
    if (el) openActivityDetail(el.dataset.openId);
  }

  function cardKeyHandler(e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    const card = e.target.closest("[data-open-id]");
    if (!card || e.target.closest("[data-fav-id]")) return;
    e.preventDefault();
    openActivityDetail(card.dataset.openId);
  }

  previewRecommendedEl.addEventListener("click", homeCardHandler);
  previewNewEl.addEventListener("click", homeCardHandler);
  previewRecommendedEl.addEventListener("keydown", cardKeyHandler);
  previewNewEl.addEventListener("keydown", cardKeyHandler);

  document.getElementById("homeUserBtn").addEventListener("click", () => {
    if (isGuestMode()) showSettings(); else showProfile();
  });

  document.getElementById("homeMessagesBtn").addEventListener("click", () => {
    toast(L().messagesSoon);
  });

  document.getElementById("recommendedArchiveLink").addEventListener("click", () => showArchive("all"));
  document.getElementById("newArchiveLink").addEventListener("click", () => showArchive("new"));

  searchInput.addEventListener("input", (e) => {
    const q = e.target.value.trim();
    if (q) { searchInput.value = ""; showArchive("all", q); }
  });

  // ---- Toast: for the one thing that has no screen yet. ----
  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      el.setAttribute("role", "status");
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("is-on"), 2600);
  }

  function initAppUI() {
    wireRail(railWrapRecommendedEl);
    renderHome();
  }

  // ---- Archive (full, searchable catalog reached from Home's section links) ----
  function visibleArchiveList() {
    const base = archiveState.mode === "new" ? newestActivities() : recommendedActivities();
    return base.filter(a =>
      matchesQuery(a, archiveState.q) &&
      (!archiveState.category || a.category === archiveState.category) &&
      (!archiveState.topic || (a.topics || []).includes(archiveState.topic))
    );
  }

  function clearArchiveFilters() {
    archiveState.q = ""; archiveState.category = null; archiveState.topic = null;
    archiveSearchInputEl.value = "";
    renderArchive();
  }

  function renderArchive() {
    const t = L();
    document.getElementById("archiveTitleText").textContent = archiveState.mode === "new" ? t.newSectionTitle : (isGuestMode() ? t.generalSectionTitle : t.recommendedSectionTitle);
    archiveSearchInputEl.placeholder = t.searchPlaceholder;

    const catChips = [{ key: null, label: t.chipAll }, ...categoryOrder().map(c => ({ key: c, label: t.categories[c] || c, color: CATEGORY_COLOR[c] }))];
    archiveCategoryChipsEl.innerHTML = catChips.map(c => `
      <button type="button" class="chip" aria-pressed="${archiveState.category === c.key}" data-cat="${c.key ?? ""}"${c.color ? ` style="--chip-color:${c.color}"` : ""}>${c.label}</button>
    `).join("");

    const topics = archiveState.category ? topicsForCategory(activities, archiveState.category) : [];
    if (!topics.length) {
      archiveTopicChipsEl.hidden = true;
      archiveTopicChipsEl.innerHTML = "";
    } else {
      archiveTopicChipsEl.hidden = false;
      const topicChips = [{ key: null, label: t.topicsAllChip }, ...topics.map(x => ({ key: x, label: x }))];
      archiveTopicChipsEl.innerHTML = topicChips.map(c => `
        <button type="button" class="chip" aria-pressed="${archiveState.topic === c.key}" data-topic="${c.key ?? ""}">${c.label}</button>
      `).join("");
    }

    const list = visibleArchiveList();
    if (activitiesStatus !== "ready") {
      archiveListEl.innerHTML = `<div class="data-notice">${dataNoticeHtml()}</div>`;
      return;
    }
    if (!list.length) {
      archiveListEl.innerHTML = `
        <div class="fav-empty">
          <p>${t.emptyStateMsg}</p>
          <button type="button" class="clear-btn" id="archiveClearFiltersBtn">${t.clearFiltersBtn}</button>
        </div>
      `;
      document.getElementById("archiveClearFiltersBtn").addEventListener("click", clearArchiveFilters);
      return;
    }
    archiveListEl.innerHTML = list.map(a => favRowHtml(a, { readOnly: isGuestMode() })).join("");
  }

  archiveSearchInputEl.addEventListener("input", (e) => {
    archiveState.q = e.target.value.trim();
    renderArchive();
  });

  archiveCategoryChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-cat]");
    if (!btn) return;
    const val = btn.dataset.cat || null;
    archiveState.category = archiveState.category === val ? null : val;
    archiveState.topic = null;
    renderArchive();
  });

  archiveTopicChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-topic]");
    if (!btn) return;
    const val = btn.dataset.topic || null;
    archiveState.topic = archiveState.topic === val ? null : val;
    renderArchive();
  });

  archiveListEl.addEventListener("click", (e) => {
    const starBtn = e.target.closest(".fav-star-btn");
    if (starBtn) { toggleFavorite(starBtn.dataset.favId); return; }
    const row = e.target.closest(".fav-row[data-open-id]");
    if (row) openActivityDetail(row.dataset.openId);
  });

  document.getElementById("archiveBack").addEventListener("click", () => showApp(userProfile?.username || null));

  function showArchive(mode, initialQuery) {
    appRootEl.hidden = true;
    welcomeScreenEl.hidden = true;
    favoritesScreenEl.hidden = true;
    socialScreenEl.hidden = true;
    profileScreenEl.hidden = true;
    settingsScreenEl.hidden = true;
    accessibilityScreenEl.hidden = true;
    otherProfileScreenEl.hidden = true;
    followListScreenEl.hidden = true;
    archiveScreenEl.hidden = false;
    bottomNavEl.hidden = false;
    archiveState.mode = mode;
    archiveState.q = initialQuery || "";
    archiveState.category = null;
    archiveState.topic = null;
    archiveSearchInputEl.value = archiveState.q;
    renderArchive();
  }

  // ---- Loading the catalog ----
  // Stale-while-revalidate: every screen paints from the device copy at once,
  // then this swaps in the live rows. It repaints only when the rows really
  // differ, so the usual case — the copy is already current — costs nothing:
  // no rail scroll reset, no replayed entrance animation.
  async function loadActivities() {
    try {
      const { data, error } = await withTimeout(
        // id breaks created_at ties — the original seed rows share one
        // timestamp, and without a tiebreak their order (and so the category
        // chip order derived from it) would shuffle from one load to the next.
        sb.from("activities").select(ACTIVITY_COLS).eq("is_published", true)
          .order("created_at", { ascending: true }).order("id", { ascending: true })
      );
      if (error) throw error;
      const fresh = (data || []).map(htmlSafeActivity);
      const changed = JSON.stringify(fresh) !== JSON.stringify(activities) || activitiesStatus !== "ready";
      activities = fresh;
      activitiesStatus = fresh.length ? "ready" : "empty";
      try {
        localStorage.setItem(ACTIVITIES_CACHE_KEY, JSON.stringify({ at: new Date().toISOString(), rows: data || [] }));
      } catch { /* storage blocked or full: the live copy still serves this session */ }
      if (changed) refreshActivityScreens();
    } catch (err) {
      console.warn("activities unavailable, keeping the device copy:", err.message);
      if (!activities.length) {
        activitiesStatus = "unavailable";
        refreshActivityScreens();
      }
    }
  }

  // The detail screen is deliberately left out: it may hold a half-written
  // review, and rebuilding it would drop the caret. It picks up the new row the
  // next time it opens.
  function refreshActivityScreens() {
    if (!appRootEl.hidden) renderHome();
    if (!archiveScreenEl.hidden) renderArchive();
    if (!favoritesScreenEl.hidden) renderFavorites();
    if (!otherProfileScreenEl.hidden) renderOtherProfile();
  }

  function dataNoticeHtml() {
    const t = L();
    if (activitiesStatus === "loading") return `<p class="data-notice-loading">${t.activitiesLoading}</p>`;
    const empty = activitiesStatus === "empty";
    return `
      <div class="data-notice-card">
        <h2 class="display display-sm">${empty ? t.activitiesEmptyTitle : t.activitiesUnavailableTitle}</h2>
        <p>${empty ? t.activitiesEmptyBody : t.activitiesUnavailableBody}</p>
        ${empty ? "" : `<button type="button" class="data-notice-retry" data-retry-activities>${t.retryBtn}</button>`}
      </div>`;
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest("[data-retry-activities]")) return;
    activitiesStatus = "loading";
    refreshActivityScreens();
    loadActivities();
  });

  // ---- Favorites ----
  async function loadFavorites() {
    favoriteIds = new Set();
    favoritedAt = new Map();
    if (isGuestMode() || !currentUserId) return;
    const { data } = await sb.from("favorites").select("activity_id, created_at").eq("user_id", currentUserId);
    (data || []).forEach(row => {
      favoriteIds.add(row.activity_id);
      favoritedAt.set(row.activity_id, row.created_at);
    });
  }

  // Two queries, not N: everyone this account follows (accepted), then every
  // favorite row any of them hold, batched — the same shape as
  // favoritedTopicsAndCategories() and just as deliberately not a live
  // subscription. `favorites_select_visible` already grants a follower read
  // access to a followee's rows, so this needs no RLS change.
  async function loadFollowedFavoritesMap() {
    followedFavoritesByActivity = new Map();
    if (isGuestMode() || !currentUserId) return;
    const { data: rel } = await sb.from("follows").select("followee_id")
      .eq("follower_id", currentUserId).eq("status", "accepted");
    const followeeIds = [...new Set((rel || []).map(r => r.followee_id))];
    if (!followeeIds.length) return;
    const { data: favs } = await sb.from("favorites").select("activity_id, user_id").in("user_id", followeeIds);
    if (!favs || !favs.length) return;
    const userIds = [...new Set(favs.map(f => f.user_id))];
    const { data: users } = await sb.from("users").select("id, username, avatar_url, is_private").in("id", userIds);
    const userById = new Map((users || []).map(u => [u.id, u]));
    favs.forEach(f => {
      const u = userById.get(f.user_id);
      if (!u) return;
      if (!followedFavoritesByActivity.has(f.activity_id)) followedFavoritesByActivity.set(f.activity_id, []);
      followedFavoritesByActivity.get(f.activity_id).push(u);
    });
  }

  function followedFavoritesFor(activityId) {
    return followedFavoritesByActivity.get(activityId) || [];
  }

  async function toggleFavorite(activityId) {
    if (!currentUserId) return;
    const wasFav = favoriteIds.has(activityId);
    if (wasFav) { favoriteIds.delete(activityId); favoritedAt.delete(activityId); }
    else { favoriteIds.add(activityId); favoritedAt.set(activityId, new Date().toISOString()); }
    refreshFavoriteAffectedUI(activityId);
    try {
      const { error } = wasFav
        ? await sb.from("favorites").delete().eq("user_id", currentUserId).eq("activity_id", activityId)
        : await sb.from("favorites").insert({ user_id: currentUserId, activity_id: activityId });
      if (error) throw error;
    } catch (err) {
      if (wasFav) { favoriteIds.add(activityId); favoritedAt.set(activityId, new Date().toISOString()); }
      else { favoriteIds.delete(activityId); favoritedAt.delete(activityId); }
      refreshFavoriteAffectedUI(activityId);
      toast(L().saveFailedMsg);
      console.error(err);
    }
  }

  // Saving repaints the one control that changed, never a whole screen. A full
  // re-render here resets rail scroll, replays every entrance animation, and
  // yanks the row out from under the thumb that just tapped it.
  function refreshFavoriteAffectedUI(activityId) {
    const isFav = favoriteIds.has(activityId);
    const t = L();
    document.querySelectorAll(`[data-fav-id="${activityId}"]`).forEach(btn => {
      btn.setAttribute("aria-pressed", String(isFav));
      btn.setAttribute("aria-label", isFav ? t.unfavoriteLabel : t.favoriteLabel);
    });
    // The favorites list is the one place membership changes the list itself,
    // so it reconciles — but only that list, and only when it is on screen.
    if (!favoritesScreenEl.hidden) reconcileFavoritesList(activityId, isFav);
  }

  function reconcileFavoritesList(activityId, isFav) {
    const row = favListEl.querySelector(`.fav-row[data-open-id="${activityId}"]`);
    if (isFav) { if (!row) renderFavorites(); return; }
    if (!row) return;
    // Collapse the removed row in place instead of rebuilding the list, so
    // everything above the thumb keeps its position.
    row.style.overflow = "hidden";
    row.style.transition = "opacity .18s var(--ease-out), height .22s var(--ease-out), margin .22s var(--ease-out)";
    row.style.height = row.offsetHeight + "px";
    requestAnimationFrame(() => {
      row.style.opacity = "0";
      row.style.height = "0px";
      row.style.marginBlock = "0px";
      row.style.paddingBlock = "0px";
    });
    setTimeout(() => { if (!favoritesScreenEl.hidden) renderFavorites(); }, 240);
  }

  function baseFavorites() {
    return activities.filter(a => a.id && favoriteIds.has(a.id));
  }

  function visibleFavorites() {
    return baseFavorites().filter(a =>
      matchesQuery(a, favState.q) &&
      (!favState.category || a.category === favState.category) &&
      (!favState.topic || (a.topics || []).includes(favState.topic))
    );
  }

  function activityTimestamp(a) {
    const t = new Date(`${a.start_date}T${a.start_time || "00:00:00"}`).getTime();
    return Number.isNaN(t) ? Infinity : t;
  }

  function activityStatusInfo(a) {
    const status = a.status || "open";
    return { status, label: L().activityStatus[status] || status };
  }

  function sortFavorites(list, sortKey) {
    const collator = new Intl.Collator(LOCALE_TAG[currentLang] || "he-IL");
    const sorted = [...list];
    if (sortKey === "recent") sorted.sort((a, b) => new Date(favoritedAt.get(b.id) || 0) - new Date(favoritedAt.get(a.id) || 0));
    else if (sortKey === "category") sorted.sort((a, b) => categoryOrder().indexOf(a.category) - categoryOrder().indexOf(b.category) || collator.compare(a.title, b.title));
    else if (sortKey === "name") sorted.sort((a, b) => collator.compare(a.title, b.title));
    else sorted.sort((a, b) => activityTimestamp(a) - activityTimestamp(b));
    return sorted;
  }

  // The shared list row: favorites, the archive, and another user's pinned list.
  // Image-led like every other surface, so a saved activity looks like itself.
  function favRowHtml(a, opts) {
    const readOnly = opts && opts.readOnly;
    const when = whenText(a);
    const statusInfo = activityStatusInfo(a);
    const isFav = a.id && favoriteIds.has(a.id);
    return `
      <div class="fav-row" role="button" tabindex="0" data-open-id="${a.id}" data-cat="${a.category}">
        ${plateArtHtml(a)}
        <div class="fav-row-main">
          <div class="fav-row-top">
            <span class="card-sm-kind">${kindLabel(a)}</span>
            <span class="fav-status-badge fav-status-${statusInfo.status}">${statusInfo.label}</span>
          </div>
          <h3 class="fav-row-title">${a.title}</h3>
          <p class="fav-row-meta">${icon("calendar")}<span>${when.main}</span></p>
          <p class="fav-row-meta">${icon("pin")}<span>${a.neighborhood || a.location_name}</span></p>
          ${friendsMetaHtml(a.id, "fav-row-meta")}
        </div>
        ${readOnly ? "" : `<button type="button" class="fav-star-btn" data-fav-id="${a.id}" aria-pressed="${isFav}" aria-label="${isFav ? L().unfavoriteLabel : L().favoriteLabel}">${icon("heart")}</button>`}
      </div>
    `;
  }

  function clearFavFilters() {
    favState.q = ""; favState.category = null; favState.topic = null;
    favSearchInputEl.value = "";
    renderFavorites();
  }

  function renderFavorites() {
    const all = baseFavorites();
    const t = L();
    document.getElementById("favoritesTitleText").textContent = t.favoritesTitle;
    favSearchInputEl.placeholder = t.searchPlaceholder;
    document.getElementById("favSortLabel").textContent = t.favSortLabel;
    document.getElementById("favCount").textContent = all.length ? t.favCountText(all.length) : "";

    if (!all.length) {
      document.getElementById("favFiltersWrap").hidden = true;
      favListEl.innerHTML = `
        <div class="empty-state">
          <span class="empty-mark">${icon("heart", "ic-lg")}</span>
          <h2 class="display display-md">${t.favEmptyTitle}</h2>
          <p class="lede" style="text-align:center">${t.favEmptyNoFavoritesMsg}</p>
          <button type="button" class="plate-btn" id="favGoHomeBtn" style="max-width:260px">${t.favEmptyNoFavoritesCta}</button>
        </div>
      `;
      document.getElementById("favGoHomeBtn").addEventListener("click", () => showApp(userProfile?.username || null));
      return;
    }

    document.getElementById("favFiltersWrap").hidden = false;

    const categoriesPresent = new Set(all.map(a => a.category));
    if (favState.category && !categoriesPresent.has(favState.category)) {
      favState.category = null;
      favState.topic = null;
    }

    const favCategoryOrder = categoryOrder().filter(c => categoriesPresent.has(c));
    const catChips = [{ key: null, label: L().chipAll }, ...favCategoryOrder.map(c => ({ key: c, label: L().categories[c] || c, color: CATEGORY_COLOR[c] }))];
    favCategoryChipsEl.innerHTML = catChips.map(c => `
      <button type="button" class="chip" aria-pressed="${favState.category === c.key}" data-cat="${c.key ?? ""}"${c.color ? ` style="--chip-color:${c.color}"` : ""}>${c.label}</button>
    `).join("");

    const topics = favState.category ? topicsForCategory(all, favState.category) : [];
    if (!topics.length) {
      favTopicChipsEl.hidden = true;
      favTopicChipsEl.innerHTML = "";
    } else {
      favTopicChipsEl.hidden = false;
      const topicChips = [{ key: null, label: L().topicsAllChip }, ...topics.map(t => ({ key: t, label: t }))];
      favTopicChipsEl.innerHTML = topicChips.map(c => `
        <button type="button" class="chip" aria-pressed="${favState.topic === c.key}" data-topic="${c.key ?? ""}">${c.label}</button>
      `).join("");
    }

    favSortSelectEl.innerHTML = [
      ["soonest", L().favSortSoonest], ["recent", L().favSortRecent],
      ["category", L().favSortCategory], ["name", L().favSortName]
    ].map(([v, label]) => `<option value="${v}" ${favState.sort === v ? "selected" : ""}>${label}</option>`).join("");

    const list = sortFavorites(visibleFavorites(), favState.sort);
    if (!list.length) {
      favListEl.innerHTML = `
        <div class="empty-state">
          <span class="empty-mark">${icon("search", "ic-lg")}</span>
          <p class="lede" style="text-align:center">${L().emptyStateMsg}</p>
          <button type="button" class="outline-btn" id="favClearFiltersBtn" style="max-width:220px">${L().clearFiltersBtn}</button>
        </div>
      `;
      document.getElementById("favClearFiltersBtn").addEventListener("click", clearFavFilters);
      return;
    }

    favListEl.innerHTML = list.map((a, i) => favRowHtml(a, { index: i })).join("");
  }

  favSearchInputEl.addEventListener("input", (e) => {
    favState.q = e.target.value.trim();
    renderFavorites();
  });

  favCategoryChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-cat]");
    if (!btn) return;
    const val = btn.dataset.cat || null;
    favState.category = favState.category === val ? null : val;
    favState.topic = null;
    renderFavorites();
  });

  favTopicChipsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-topic]");
    if (!btn) return;
    const val = btn.dataset.topic || null;
    favState.topic = favState.topic === val ? null : val;
    renderFavorites();
  });

  favSortRowEl.addEventListener("change", (e) => {
    if (e.target.id !== "favSortSelect") return;
    favState.sort = e.target.value;
    renderFavorites();
  });

  favListEl.addEventListener("click", (e) => {
    const starBtn = e.target.closest(".fav-star-btn");
    if (starBtn) { toggleFavorite(starBtn.dataset.favId); return; }
    const row = e.target.closest(".fav-row[data-open-id]");
    if (row) openActivityDetail(row.dataset.openId);
  });

  favListEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest(".fav-row[data-open-id]");
    if (!row) return;
    e.preventDefault();
    openActivityDetail(row.dataset.openId);
  });

  // ---- Activity detail: one full screen, opened from every list in the app.
  // The fact block and the CTA are keyed off item_kind, because a weekly חוג,
  // a one-off אירוע and an open פעילות answer genuinely different questions. ----
  const detailScreenEl = document.getElementById("detailScreen");
  const detailPlateEl = document.getElementById("detailPlate");
  const detailSheetEl = document.getElementById("detailSheet");
  const detailDockEl = document.getElementById("detailDock");
  const detailBackBtnEl = document.getElementById("detailBackBtn");
  const detailSaveBtnEl = document.getElementById("detailSaveBtn");

  function detailKind(a) {
    if (a.item_kind === "event") return "event";
    if (a.schedule_type === "recurring") return "club";
    return "activity";
  }

  // Dock price: the amount only. The period qualifier is a fact, not a headline,
  // and "לכל התקופה" on a single-evening ticket is simply wrong.
  function priceCompact(a) {
    if (a.price == null) return "—";
    if (a.price === 0) return L().free;
    return `${a.price} ₪`;
  }

  function ctaForKind(a) {
    const t = L();
    // Status outranks the kind: never invite someone to register for something
    // that is full, cancelled or already over.
    const blocked = { full: t.ctaFull, cancelled: t.ctaCancelled, ended: t.ctaEnded }[a.status];
    if (blocked) return { href: null, label: blocked, icon: null, disabled: true };
    if (a.status === "postponed") {
      return a.source_url
        ? { href: a.source_url, label: t.ctaPostponed, icon: "chevron", disabled: false }
        : { href: null, label: t.ctaPostponed, icon: null, disabled: true };
    }
    const kind = detailKind(a);
    const label = kind === "event" ? t.ctaTickets : kind === "club" ? t.ctaJoinClub : t.ctaRegister;
    const ic = kind === "event" ? "ticket" : "check";
    if (a.registration_url) return { href: a.registration_url, label, icon: ic, disabled: false };
    if (a.source_url) return { href: a.source_url, label: t.moreInfoSource, icon: "chevron", disabled: false };
    return { href: null, label: t.registrationSoon, icon: null, disabled: true };
  }

  // Kind-specific fact rows. Only rows with a real value are emitted — an empty
  // labelled row reads as missing data rather than as an absent field.
  function factRowsFor(a) {
    const t = L();
    const when = whenText(a);
    const kind = detailKind(a);
    const rows = [];

    if (kind === "club") {
      rows.push(["repeat", when.main, when.sub]);
      if (a.start_date) rows.push(["calendar", t.startsOnLabel, fmtDate(a.start_date) + (a.end_date ? " – " + fmtDate(a.end_date) : " · " + t.noEndDate)]);
    } else if (kind === "event") {
      rows.push(["calendar", when.main, when.sub]);
      if (a.registration_deadline) rows.push(["clock", t.deadlineLabel, fmtDate(a.registration_deadline)]);
    } else {
      rows.push(["calendar", when.main, when.sub]);
      if (a.sessions_count) rows.push(["repeat", t.sessionsLabel(a.sessions_count), ""]);
    }

    rows.push(["pin", a.location_name, [a.neighborhood, a.organization_name].filter(Boolean).join(" · ")]);
    rows.push(["age", ageText(a), a.is_accessible ? t.accessibleNote : ""]);

    if (a.capacity != null) rows.push(["users", t.spotsLeftText(a.spots_left ?? 0, a.capacity), ""]);
    // The dock shows the bare amount, so the period qualifier lives here.
    rows.push(["coin", priceText(a), kind === "club" && a.price ? t.pricePerClubNote : ""]);

    return rows.filter(r => r[1]).map(([ic, main, sub]) => `
      <div class="fact-row">
        ${icon(ic)}
        <div class="fact-row-body"><b>${main}</b>${sub ? `<span>${sub}</span>` : ""}</div>
      </div>`).join("");
  }

  function openActivityDetail(id) {
    favDetailOpenId = id;
    resetReviewState();
    renderActivityDetail();
    detailScreenEl.hidden = false;
    detailScreenEl.scrollTop = 0;
    document.body.style.overflow = "hidden";
    loadReviews(id).then(() => {
      if (favDetailOpenId !== id) return;
      // Same reason the favorites list repaints one control: re-rendering the
      // block would rebuild the textarea and drop the caret mid-word.
      if (document.activeElement && document.activeElement.id === "revBody") return;
      renderReviewsBlock();
    });
  }

  function closeActivityDetail() {
    favDetailOpenId = null;
    resetReviewState();
    detailScreenEl.hidden = true;
    detailSheetEl.innerHTML = "";
    detailPlateEl.innerHTML = "";
    detailDockEl.innerHTML = "";
    document.body.style.overflow = "";
  }

  function renderActivityDetail() {
    if (!favDetailOpenId) return;
    const a = activities.find(x => x.id === favDetailOpenId);
    if (!a) { closeActivityDetail(); return; }
    const t = L();
    const rtl = LANG_DIR[currentLang] === "rtl";
    const status = activityStatusInfo(a);
    const cta = ctaForKind(a);
    const canSave = !isGuestMode() && a.id;
    const isFav = a.id && favoriteIds.has(a.id);

    detailScreenEl.dataset.cat = a.category;
    detailPlateEl.innerHTML = plateArtHtml(a);

    detailBackBtnEl.innerHTML = icon(rtl ? "chevronBack" : "chevron");
    detailBackBtnEl.setAttribute("aria-label", t.backLabel);
    detailSaveBtnEl.hidden = !canSave;
    if (canSave) {
      detailSaveBtnEl.innerHTML = icon("heart");
      detailSaveBtnEl.setAttribute("aria-pressed", String(isFav));
      detailSaveBtnEl.setAttribute("aria-label", isFav ? t.unfavoriteLabel : t.favoriteLabel);
      detailSaveBtnEl.dataset.favId = a.id;
    }

    detailSheetEl.innerHTML = `
      <div>
        <div class="detail-kicker">
          <span class="kind-tag">${kindLabel(a)}</span>
          <span class="status-tag is-${status.status}">${status.label}</span>
          <span class="topic-tag">${t.categories[a.category] || a.category}</span>
        </div>
        <h1 class="display display-xl" style="margin-top:14px">${a.title}</h1>
        ${a.organization_name ? `<p class="detail-host">${t.hostedBy} <b>${a.organization_name}</b></p>` : ""}
      </div>
      ${a.short_description ? `<p class="lede" style="max-width:none">${a.short_description}</p>` : ""}
      <div class="fact-list">${factRowsFor(a)}</div>
      <div id="detailFriends"></div>
      <div class="rev-block" id="detailReviews"></div>
      <p class="detail-desc">${a.description}</p>
      ${(a.topics || []).length ? `<div class="topic-tags">${a.topics.map(x => `<span class="topic-tag">${x}</span>`).join("")}</div>` : ""}
      ${a.source_name ? `<p class="detail-source">${t.sourceLabel} ${a.source_url ? `<a href="${a.source_url}" target="_blank" rel="noopener">${a.source_name}</a>` : a.source_name}</p>` : ""}
    `;

    detailDockEl.innerHTML = `
      <div class="detail-dock-inner">
        <span class="price-block"><span>${t.priceLabel}</span><b>${priceCompact(a)}</b></span>
        ${cta.disabled
          ? `<span class="cta-btn is-disabled">${cta.label}</span>`
          : `<a class="cta-btn" href="${cta.href}" target="_blank" rel="noopener">${cta.icon ? icon(cta.icon) : ""}${cta.label}</a>`}
      </div>`;

    renderReviewsBlock();

    // Padding for the docked CTA, measured rather than guessed.
    requestAnimationFrame(() => {
      detailSheetEl.style.paddingBottom = (detailDockEl.offsetHeight + 24) + "px";
    });

    // Independent of canSave: a guest or a signed-in viewer who cannot save
    // this activity themselves can still see who among the people they follow
    // did. The map is empty for a guest (no currentUserId, nothing to follow
    // with), so this degrades to nothing shown rather than needing its own gate.
    if (a.id) renderDetailFriends(a.id);
  }

  function renderDetailFriends(activityId) {
    const el = document.getElementById("detailFriends");
    if (!el) return;
    const users = followedFavoritesFor(activityId);
    if (!users.length) { el.innerHTML = ""; return; }
    const t = L();
    const shown = users.slice(0, 4);
    const names = shown.slice(0, 2).map(u => bidiIsolate(u.username || "?"));
    el.innerHTML = `
      <div class="friends-row">
        <span class="friends-stack">${shown.map(u => `
          <span class="avatar avatar-sm" style="${userAvatarStyle(u)}">${u.avatar_url && !u.is_private ? "" : (u.username || "?").charAt(0).toUpperCase()}</span>
        `).join("")}</span>
        <span class="friends-text">${t.savedByLine(names, users.length)}</span>
      </div>`;
  }

  // ---- Reviews ----
  // Read by anyone including guests, written only by an account. The list comes
  // back from `activity_reviews_public()` rather than from the table, so an
  // anonymous row simply has no author attached by the time it is here — there
  // is no identity on the client to accidentally render.
  let detailReviews = [];
  let myReview = null;
  let reviewsOpen = false;
  let reviewDraft = null;
  const REVIEW_MAX = 100;

  // The draft starts empty rather than null: the sheet paints synchronously
  // while the reviews are still in flight, so the form has to be renderable
  // before the network answers. `loadReviews()` replaces it with the user's
  // own review if they already left one.
  //
  // A review posts under the writer's name unless they ask otherwise. The
  // column still defaults to anonymous in the database, deliberately: that is
  // the safe direction for a row that reaches the table without this field,
  // since hiding a name nobody meant to hide costs nothing and showing one
  // cannot be taken back.
  function emptyReviewDraft() {
    return { rating: 0, body: "", anonymous: false };
  }

  function resetReviewState() {
    detailReviews = [];
    myReview = null;
    reviewsOpen = false;
    reviewDraft = emptyReviewDraft();
  }

  function reviewAverage() {
    if (!detailReviews.length) return 0;
    return detailReviews.reduce((sum, r) => sum + r.rating, 0) / detailReviews.length;
  }

  function starsHtml(value) {
    const filled = Math.round(value);
    return `<span class="rev-stars">${
      [1, 2, 3, 4, 5].map(n => icon("star", n <= filled ? "is-on" : "")).join("")
    }</span>`;
  }

  async function loadReviews(activityId) {
    // Guest browsing works with the backend down, and the detail screen must
    // keep working too — an unreachable server means "no reviews yet" here,
    // never a broken sheet.
    try {
      const { data, error } = await withTimeout(sb.rpc("activity_reviews_public", { p_activity_id: activityId }));
      if (error) throw error;
      detailReviews = data || [];
    } catch (err) {
      console.warn("reviews unavailable:", err.message);
      detailReviews = [];
    }
    myReview = null;
    if (currentUserId) {
      try {
        const { data } = await withTimeout(sb.from("activity_reviews")
          .select("id, rating, body, is_anonymous")
          .eq("activity_id", activityId).eq("user_id", currentUserId).maybeSingle());
        myReview = data || null;
      } catch (err) {
        console.warn("own review unavailable:", err.message);
      }
    }
    // A slow backend must not overwrite words already typed into the form while
    // the request was still out — the timeout here is seconds long by design.
    // The anonymity test compares against the blank draft rather than against a
    // literal, so flipping which way that field starts cannot silently turn this
    // check inside out and start discarding the very edits it exists to protect.
    const blank = emptyReviewDraft();
    const touched = reviewDraft && (reviewDraft.rating || reviewDraft.body || reviewDraft.anonymous !== blank.anonymous);
    if (!touched) {
      reviewDraft = myReview
        ? { rating: myReview.rating, body: myReview.body || "", anonymous: myReview.is_anonymous }
        : emptyReviewDraft();
    }
  }

  function reviewItemHtml(r) {
    const t = L();
    const named = !r.is_anonymous && r.display_name;
    return `
      <div class="rev-item">
        <div class="rev-item-head">
          <span class="rev-item-name${named ? "" : " is-anon"}">${named ? escHtml(r.display_name) : t.anonymousName}</span>
          ${starsHtml(r.rating)}
          <span class="rev-item-date">${fmtDate(String(r.created_at).slice(0, 10))}</span>
        </div>
        ${r.body ? `<p class="rev-item-text">${escHtml(r.body)}</p>` : ""}
      </div>`;
  }

  function reviewFormHtml() {
    const t = L();
    const d = reviewDraft;
    return `
      <div class="rev-form">
        <p class="rev-form-title">${myReview ? t.yourReviewTitle : t.writeReviewTitle}</p>
        <div class="rev-pick" role="group" aria-label="${t.ratingLabel}">
          ${[1, 2, 3, 4, 5].map(n => `
            <button type="button" class="rev-pick-btn${n <= d.rating ? " is-on" : ""}"
              data-rate="${n}" aria-pressed="${n <= d.rating}" aria-label="${t.starsAria(n)}">${icon("star")}</button>
          `).join("")}
        </div>
        <textarea class="pf-input rev-textarea" id="revBody" maxlength="${REVIEW_MAX}"
          placeholder="${t.reviewPlaceholder}" aria-label="${t.reviewBodyLabel}">${escHtml(d.body)}</textarea>
        <div class="rev-form-foot">
          <label class="rev-anon">
            <input type="checkbox" id="revAnon" ${d.anonymous ? "checked" : ""}>
            ${t.postAnonymously}
          </label>
          <span class="rev-count" id="revCount">${d.body.length}/${REVIEW_MAX}</span>
        </div>
        <div class="rev-actions">
          <button type="button" class="rev-submit" id="revSubmit" ${d.rating ? "" : "disabled"}>
            ${myReview ? t.updateReview : t.submitReview}
          </button>
          ${myReview ? `<button type="button" class="rev-delete" id="revDelete">${t.deleteReview}</button>` : ""}
        </div>
      </div>`;
  }

  function renderReviewsBlock() {
    const el = document.getElementById("detailReviews");
    if (!el) return;
    const t = L();
    const count = detailReviews.length;
    const avg = reviewAverage();

    el.innerHTML = `
      <button type="button" class="rev-head" id="revToggle" aria-expanded="${reviewsOpen}" aria-controls="revBodyWrap">
        <span class="rev-score">
          ${starsHtml(avg)}
          ${count
            ? `<span class="rev-score-num">${avg.toFixed(1)}</span><span class="rev-score-of">${t.outOfFive}</span>`
            : `<span class="rev-score-of">${t.noRatingsYet}</span>`}
        </span>
        <span class="rev-toggle-label">${t.reviewsLabel} ${count}${icon("caretDown")}</span>
      </button>
      <div class="rev-body" id="revBodyWrap"${reviewsOpen ? "" : " hidden"}>
        ${count
          ? `<div class="rev-list">${detailReviews.map(reviewItemHtml).join("")}</div>`
          : `<p class="rev-empty">${t.noReviewsYet}</p>`}
        ${isGuestMode() || !currentUserId
          ? `<p class="rev-note">${t.reviewGuestNote}</p>`
          : reviewFormHtml()}
      </div>`;
  }

  // A star tap or a keystroke repaints its own control, never the block: a full
  // re-render would drop the caret out of the textarea mid-sentence.
  function refreshReviewPick() {
    const wrap = document.getElementById("detailReviews");
    if (!wrap || !reviewDraft) return;
    wrap.querySelectorAll(".rev-pick-btn").forEach(btn => {
      const on = Number(btn.dataset.rate) <= reviewDraft.rating;
      btn.classList.toggle("is-on", on);
      btn.setAttribute("aria-pressed", String(on));
    });
    const submit = document.getElementById("revSubmit");
    if (submit) submit.disabled = !reviewDraft.rating;
  }

  async function submitReview() {
    const a = activities.find(x => x.id === favDetailOpenId);
    if (!a || !currentUserId || !reviewDraft || !reviewDraft.rating) return;
    const t = L();
    const btn = document.getElementById("revSubmit");
    if (btn) { btn.disabled = true; btn.textContent = t.savingBtn; }
    const body = reviewDraft.body.trim().slice(0, REVIEW_MAX);
    try {
      const { error } = await withTimeout(sb.from("activity_reviews").upsert({
        activity_id: a.id,
        user_id: currentUserId,
        rating: reviewDraft.rating,
        body: body || null,
        is_anonymous: reviewDraft.anonymous
      }, { onConflict: "activity_id,user_id" }));
      if (error) throw error;
      await loadReviews(a.id);
      if (favDetailOpenId !== a.id) return;
      // Show what was stored, not what was typed: the body is trimmed and capped
      // on the way out, so leaving the draft as-is would leave the form claiming
      // an edit the database did not keep.
      if (myReview) reviewDraft = { rating: myReview.rating, body: myReview.body || "", anonymous: myReview.is_anonymous };
      reviewsOpen = true;
      renderReviewsBlock();
      toast(t.reviewSaved);
    } catch (err) {
      console.error(err);
      if (btn) { btn.disabled = false; btn.textContent = myReview ? t.updateReview : t.submitReview; }
      toast(isNetworkFailure(err) ? t.errServerDown : t.reviewFailed);
    }
  }

  async function deleteReview() {
    const a = activities.find(x => x.id === favDetailOpenId);
    if (!a || !currentUserId || !myReview) return;
    const t = L();
    if (!confirm(t.deleteReviewPrompt)) return;
    try {
      const { error } = await withTimeout(sb.from("activity_reviews").delete().eq("id", myReview.id));
      if (error) throw error;
      await loadReviews(a.id);
      if (favDetailOpenId !== a.id) return;
      // loadReviews() protects a draft in progress, which is right when a slow
      // read races someone typing — but here the draft IS the thing just thrown
      // away, so the form has to come back blank rather than still holding the
      // stars and words of the review that no longer exists.
      reviewDraft = emptyReviewDraft();
      renderReviewsBlock();
      toast(t.reviewDeleted);
    } catch (err) {
      console.error(err);
      toast(isNetworkFailure(err) ? t.errServerDown : t.reviewFailed);
    }
  }

  // Delegated off the sheet, which is a persistent node whose innerHTML is
  // replaced — the same reason the archive and favorites screens wire their
  // chip rows here rather than after each render.
  detailSheetEl.addEventListener("click", (e) => {
    const star = e.target.closest(".rev-pick-btn");
    if (star) { reviewDraft.rating = Number(star.dataset.rate); refreshReviewPick(); return; }
    if (e.target.closest("#revToggle")) {
      reviewsOpen = !reviewsOpen;
      renderReviewsBlock();
      return;
    }
    if (e.target.closest("#revSubmit")) { submitReview(); return; }
    if (e.target.closest("#revDelete")) deleteReview();
  });

  detailSheetEl.addEventListener("input", (e) => {
    if (e.target.id !== "revBody" || !reviewDraft) return;
    reviewDraft.body = e.target.value;
    const countEl = document.getElementById("revCount");
    if (countEl) countEl.textContent = `${e.target.value.length}/${REVIEW_MAX}`;
  });

  detailSheetEl.addEventListener("change", (e) => {
    if (e.target.id === "revAnon" && reviewDraft) reviewDraft.anonymous = e.target.checked;
  });

  detailBackBtnEl.addEventListener("click", closeActivityDetail);

  async function followUser(otherUserId, otherIsPrivate) {

      followee_id: otherUserId,

    if (!otherIsPrivate) await loadFollowedFavoritesMap();
