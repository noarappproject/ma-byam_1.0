  // ---- Reaching the backend.
  // A Supabase project on the free tier is paused after a stretch of inactivity,
  // and its subdomain stops resolving entirely. Without a ceiling the client's
  // request never settles, so the submit button stays disabled forever with no
  // message — a dead end the user can only escape by reloading. Every call that
  // blocks a button gets a bound, and an unreachable server is reported as an
  // outage rather than as a wrong password. ----
  const NET_TIMEOUT_MS = 12000;

  function withTimeout(thenable, ms = NET_TIMEOUT_MS) {
    let timer;
    const limit = new Promise((_, reject) => {
      timer = setTimeout(() => {
        const err = new Error("network timeout");
        err.isNetworkFailure = true;
        reject(err);
      }, ms);
    });
    return Promise.race([Promise.resolve(thenable), limit]).finally(() => clearTimeout(timer));
  }

  function isNetworkFailure(err) {
    if (!err) return false;
    if (err.isNetworkFailure) return true;
    const text = `${err.message || ""} ${err.name || ""}`.toLowerCase();
    return text.includes("failed to fetch") || text.includes("networkerror") ||
           text.includes("network timeout") || text.includes("load failed") ||
           text.includes("err_name_not_resolved") || text.includes("typeerror");
  }

  function applyTheme(pref) {
    const root = document.documentElement;
    if (pref === "light" || pref === "dark") root.setAttribute("data-theme", pref);
    else root.removeAttribute("data-theme");
  }

  function applyTextSize(size) {
    const scale = { small: "0.9", medium: "1", large: "1.2" }[size] || "1";
    document.documentElement.style.setProperty("--text-scale", scale);
  }

  let userProfile = null;
  let currentUserId = null;

  // docs/index.html ships via GitHub Pages independently of `supabase db push`,
  // so the frontend can be newer than the schema. Selecting a column that does
  // not exist yet fails the whole row, which used to blank the entire profile —
  // so a missing newer column degrades to "not set" instead of "no profile".
  const PROFILE_BASE_COLS = "username, avatar_url, theme_pref, text_size, language, is_private";
  const PROFILE_NEW_COLS = ["banner_url"];

  async function loadAndApplyProfile(userId) {
    currentUserId = userId;
    let { data, error } = await sb.from("users")
      .select([PROFILE_BASE_COLS, ...PROFILE_NEW_COLS].join(", "))
      .eq("id", userId).maybeSingle();
    if (error) {
      console.warn("profile select fell back to base columns:", error.message);
      ({ data } = await sb.from("users").select(PROFILE_BASE_COLS).eq("id", userId).maybeSingle());
    }
    userProfile = data || null;
    if (userProfile) {
      setLanguage(userProfile.language || "he");
      applyTheme(userProfile.theme_pref || "system");
      applyTextSize(userProfile.text_size || "medium");
    }
  }

  function usernameToEmail(username) {
    return username.trim().toLowerCase().replace(/\s+/g, "_") + "@mahbaim.app";
  }

  // The gate is two screens now: a welcome sheet, then one form that flips
  // between signup and login. No tab strip — the mode owns the whole screen.
  function setAuthMode(mode) {
    authMode = mode;
    const t = L();
    const signup = mode === "signup";
    document.getElementById("authTitleText").textContent = signup ? t.signupTitle : t.loginTitle;
    document.getElementById("authTaglineText").textContent = signup ? t.signupLede : t.loginLede;
    authSubmitEl.textContent = signup ? t.signupSubmit : t.loginSubmit;
    authSwitchBtnEl.innerHTML = signup ? t.switchToLogin : t.switchToSignup;
    authPasswordEl.setAttribute("autocomplete", signup ? "new-password" : "current-password");
    authUsernameEl.removeAttribute("aria-invalid");
    authPasswordEl.removeAttribute("aria-invalid");
    authErrorEl.innerHTML = "";
  }

  function showAuthMode(mode) {
    welcomeScreenEl.hidden = true;
    authScreenEl.hidden = false;
    bottomNavEl.hidden = true;
    document.body.classList.remove("has-bottom-nav");
    authForm.reset();
    setAuthMode(mode);
    window.scrollTo(0, 0);
  }

  authSwitchBtnEl.addEventListener("click", () => setAuthMode(authMode === "signup" ? "login" : "signup"));
  document.getElementById("welcomeStartBtn").addEventListener("click", () => showAuthMode("signup"));
  document.getElementById("welcomeLoginBtn").addEventListener("click", () => showAuthMode("login"));
  document.getElementById("authBackBtn").addEventListener("click", showAuth);

  function setAuthError(msg, field) {
    authErrorEl.innerHTML = msg ? `${icon("alert", "ic-sm")}<span>${msg}</span>` : "";
    authUsernameEl.removeAttribute("aria-invalid");
    authPasswordEl.removeAttribute("aria-invalid");
    if (field === "username") authUsernameEl.setAttribute("aria-invalid", "true");
    if (field === "password") authPasswordEl.setAttribute("aria-invalid", "true");
  }

  function isGuestMode() { return localStorage.getItem("mb_guest") === "1"; }

  function setActiveTab(tab) {
    navHomeEl.setAttribute("aria-current", tab === "home");
    navFavoritesEl.setAttribute("aria-current", tab === "favorites");
    navSocialEl.setAttribute("aria-current", tab === "social");
    navProfileEl.setAttribute("aria-current", tab === "profile");
    navSettingsEl.setAttribute("aria-current", tab === "settings");

    appRootEl.hidden = false;
    const guest = isGuestMode();
    bottomNavEl.hidden = false;
    navFavoritesEl.hidden = guest;
    navSocialEl.hidden = guest;
    navProfileEl.hidden = guest;
    // Settings moved off the bottom nav for logged-in users — it's reached via the
    // gear icon on the Profile screen instead. Guests have no Profile screen, so
    // they keep Settings as their own tab (their only way to reach it).
    navSettingsEl.hidden = !guest;
    document.body.classList.add("has-bottom-nav");
    setActiveTab("home");
    if (!appStarted) { appStarted = true; initAppUI(); }
    else renderHome();
  }

  function showAuth() {
    appRootEl.hidden = true;
    welcomeScreenEl.hidden = true;

  // Registered users (login or signup) answer the onboarding questionnaire
  // exactly once; guests skip it entirely, since guest data is never collected.

    // Favorites has no such call site on the login path, so refresh it explicitly here.

    const { data: prefs } = await sb.from("user_preferences").select("user_id, interest_topics").eq("user_id", userId).maybeSingle();
    currentInterestTopics = prefs?.interest_topics || [];

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = authUsernameEl.value.trim();
    const password = authPasswordEl.value;
    if (!username || !password) return;

    authSubmitEl.disabled = true;
    setAuthError("");

    try {
      if (authMode === "signup") {
        const email = usernameToEmail(username);
        if (!USERNAME_RE.test(username)) {
          setAuthError(L().errUsernameFormat, "username");
          return;
        }
        if (password.length < 6 || password.length > 10) {
          setAuthError(L().errPasswordLength, "password");
          return;
        }
        const { data: existing, error: lookupError } =
          await withTimeout(sb.from("users").select("id").eq("username", username).maybeSingle());
        if (lookupError) throw lookupError;
        if (existing) {
          setAuthError(L().errUsernameTaken, "username");
          return;
        }
        const { data, error } = await withTimeout(sb.auth.signUp({
          email, password,
          options: { data: { username, full_name: username } }
        }));
        if (error) throw error;
        if (!data.session) {
          setAuthError(L().errSignupNeedsVerification);
          return;
        }
        localStorage.removeItem("mb_guest");
        await proceedAfterAuth(data.user.id, username);
      } else {
        // The lookup's own error has to be inspected, not just its data: a
        // network failure returns {data: null, error}, and treating that as
        // "no such user" reports an outage as a wrong password.
        const { data: existing, error: lookupError } =
          await withTimeout(sb.from("users").select("email").eq("username", username).maybeSingle());
        if (lookupError) throw lookupError;
        if (!existing) { setAuthError(L().errLoginFailed, "username"); return; }
        const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email: existing.email, password }));
        if (error) throw error;
        localStorage.removeItem("mb_guest");
        const name = data.user?.user_metadata?.username || username;
        await proceedAfterAuth(data.user.id, name);
      }
    } catch (err) {
      console.error(err);
      if (isNetworkFailure(err)) setAuthError(L().errServerDown);
      else setAuthError(authMode === "login" ? L().errLoginFailed : L().errSignupFailed);
    } finally {
      authSubmitEl.disabled = false;
    }
  });

            <input type="text" class="pf-input" id="pNewUsername" value="${escapeAttr(profileEditUsername)}" dir="ltr" autocomplete="username" aria-describedby="pUsernameMsg">

  // An attribute value is not a text node: a quote or an angle bracket in a name
  // used to break out of the attribute it was written into.
  function escapeAttr(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // What Save compares against. Sorted arrays so reselecting the same chips in a
  // different order is not mistaken for a change.
  function profileEditSnapshot() {
    return JSON.stringify({
      firstName: profileState.firstName.trim(),
      lastName: profileState.lastName.trim(),
      ageRange: profileState.ageRange || "",
      grade: profileState.grade || "",
      area: profileState.area || "",
      topics: [...profileState.interestTopics].sort(),
      types: [...profileState.activityTypes].sort(),
      username: profileEditUsername.trim(),
      password: profileEditPassword
    });
  }

  function pfTextFieldHtml(id, labelText, value) {
    return `
      <div class="pf-field">
        <label class="pf-field-label" for="${id}">${labelText}</label>
        <input type="text" class="pf-input" id="${id}" value="${escapeAttr(value)}">
      </div>
    `;
  }

  // Same shell as a text field, with the native arrow replaced by a drawn caret —
  // the platform arrow is the one part of a select that belongs to no design system.
  function pfSelectHtml(id, labelText, options, value) {
    return `
      <div class="pf-field">
        <label class="pf-field-label" for="${id}">${labelText}</label>
        <div class="pf-select-wrap">
          <select class="pf-input${value ? "" : " is-unset"}" id="${id}">
            <option value="" ${!value ? "selected" : ""}>${L().selectPlaceholder}</option>
            ${options.map(o => `<option value="${escapeAttr(o)}" ${value === o ? "selected" : ""}>${o}</option>`).join("")}
          </select>
          ${icon("caretDown", "pf-caret")}
        </div>
      </div>
    `;
  }

  function pfChipsHtml(name, options, selected) {
    return `<div class="pf-chips">${options.map(opt => {
      const isSel = selected.includes(opt);
      return `<button type="button" class="pf-chip" aria-pressed="${isSel}" data-${name}="${escapeAttr(opt)}">${isSel ? icon("check") : ""}${opt}</button>`;
    }).join("")}</div>`;
  }

  // Topics the user typed themselves: dashed outline so they read as their own,
  // and a drawn ✕ rather than the literal character the old version printed into
  // the label, which screen readers announced as part of the topic name.
  function pfCustomChipsHtml(name, presetOptions, selected) {
    const custom = selected.filter(v => !presetOptions.includes(v));
    if (!custom.length) return "";
    return `<div class="pf-chips">${custom.map(v =>
      `<button type="button" class="pf-chip is-custom" aria-pressed="true" data-${name}-remove="${escapeAttr(v)}">${v}${icon("x")}</button>`
    ).join("")}</div>`;
  }
  // Avatar and banner share one uploader: same public bucket, same per-user
  // folder, so the bucket's existing owner-only RLS covers both. The failure
  // path reports rather than silently doing nothing, which is how the old
  // version behaved on an oversized or rejected file.
  const MEDIA_MAX_BYTES = 5 * 1024 * 1024;

  async function uploadProfileMedia(file, kind) {
    const t = L();
    if (!file || !currentUserId) return;
    if (!file.type.startsWith("image/")) { toast(t.mediaNotImage); return; }
    if (file.size > MEDIA_MAX_BYTES) { toast(t.mediaTooBig); return; }
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    const path = `${currentUserId}/${kind}.${ext}`;
    const column = kind === "banner" ? "banner_url" : "avatar_url";
    toast(t.mediaUploading);
    const { error } = await sb.storage.from("avatars").upload(path, file, { upsert: true, contentType: file.type });
    if (error) { toast(t.mediaFailed); console.error(error); return; }
    const { data } = sb.storage.from("avatars").getPublicUrl(path);
    const url = data.publicUrl + "?t=" + Date.now();
    const { error: dbError } = await sb.from("users").update({ [column]: url }).eq("id", currentUserId);
    if (dbError) { toast(t.mediaFailed); console.error(dbError); return; }
    if (userProfile) userProfile[column] = url;
    renderProfile();
    toast(t.mediaSaved);
  }

  async function handleAvatarUpload(e) {
    await uploadProfileMedia(e.target.files[0], "avatar");
    e.target.value = "";
  }

  async function handleBannerUpload(e) {
    await uploadProfileMedia(e.target.files[0], "banner");
    e.target.value = "";
  }

  // Save is the only committing control on the screen and it lives in the sticky
  // bar, so it has to reflect the form continuously rather than only at submit.
  function refreshProfileSaveState() {
    const btn = document.getElementById("pSave");
    if (!btn || btn.dataset.busy === "1") return;
    const dirty = profileEditSnapshot() !== profileBaseline;
    btn.disabled = !dirty;
    btn.classList.remove("is-saved");
    btn.innerHTML = L().saveBtn;
  }

  function wireProfileEdit() {
    const t = L();
    const el = id => document.getElementById(id);

    // The bar only grows a rule once it is actually holding content back.
    const bar = el("pEditBar");
    const onScroll = () => bar.classList.toggle("is-stuck", bar.getBoundingClientRect().top <= 0.5);
    onScroll();
    window.removeEventListener("scroll", profileBarScrollHandler);
    profileBarScrollHandler = onScroll;
    window.addEventListener("scroll", profileBarScrollHandler, { passive: true });

    const leaveEdit = () => {
      window.removeEventListener("scroll", profileBarScrollHandler);
      profileMode = "view";
      showProfile();
    };
    const cancel = () => {
      if (profileEditSnapshot() !== profileBaseline && !confirm(t.discardPrompt)) return;
      leaveEdit();
    };
    el("pCancel").addEventListener("click", cancel);
    el("pCancelTop").addEventListener("click", cancel);

    el("avatarBtn").addEventListener("click", () => el("avatarInput").click());
    el("avatarInput").addEventListener("change", handleAvatarUpload);
    el("bannerBtn").addEventListener("click", () => el("bannerInput").click());
    el("bannerInput").addEventListener("change", handleBannerUpload);

    el("pFirstName").addEventListener("input", e => { profileState.firstName = e.target.value; refreshProfileSaveState(); });
    el("pLastName").addEventListener("input", e => { profileState.lastName = e.target.value; refreshProfileSaveState(); });
    el("pAge").addEventListener("change", e => {
      profileState.ageRange = e.target.value || null;
      e.target.classList.toggle("is-unset", !e.target.value);
      refreshProfileSaveState();
    });
    el("pGrade").addEventListener("change", e => {
      const match = t.gradeOptions.find(g => g[1] === e.target.value);
      profileState.grade = match ? match[0] : null;
      profileState.gradeLabel = e.target.value;
      e.target.classList.toggle("is-unset", !e.target.value);
      refreshProfileSaveState();
    });
    el("pArea").addEventListener("change", e => {
      profileState.area = e.target.value || null;
      e.target.classList.toggle("is-unset", !e.target.value);
      refreshProfileSaveState();
    });

    // Chip edits re-render the section (the count and the check marks move with
    // them), so the live values of the two text inputs are parked on module state
    // first — otherwise typing a username and then tapping a chip loses it.
    const stashCredentials = () => {
      profileEditUsername = el("pNewUsername").value;
      profileEditPassword = el("pNewPassword").value;
    };

    profileContentEl.querySelectorAll("[data-ptopic]").forEach(btn => btn.addEventListener("click", () => {
      stashCredentials();
      const v = btn.dataset.ptopic;
      const i = profileState.interestTopics.indexOf(v);
      if (i === -1) profileState.interestTopics.push(v); else profileState.interestTopics.splice(i, 1);
      renderProfile();
    }));
    profileContentEl.querySelectorAll("[data-ptopic-remove]").forEach(btn => btn.addEventListener("click", () => {
      stashCredentials();
      profileState.interestTopics = profileState.interestTopics.filter(x => x !== btn.dataset.ptopicRemove);
      renderProfile();
    }));
    profileContentEl.querySelectorAll("[data-patype]").forEach(btn => btn.addEventListener("click", () => {
      stashCredentials();
      const v = btn.dataset.patype;
      const i = profileState.activityTypes.indexOf(v);
      if (i === -1) profileState.activityTypes.push(v); else profileState.activityTypes.splice(i, 1);
      renderProfile();
    }));

    const addInput = el("pAddTopic");
    const addBtn = el("pAddTopicBtn");
    const canAdd = () => {
      const v = addInput.value.trim();
      return !!v && !profileState.interestTopics.includes(v);
    };
    const addTopic = () => {
      if (!canAdd()) return;
      stashCredentials();
      profileState.interestTopics.push(addInput.value.trim());
      renderProfile();
    };
    addInput.addEventListener("input", () => { addBtn.disabled = !canAdd(); });
    addInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addTopic(); } });
    addBtn.addEventListener("click", addTopic);

    const passInput = el("pNewPassword");
    const passToggle = el("pPassToggle");
    passToggle.addEventListener("click", () => {
      const show = passInput.type === "password";
      passInput.type = show ? "text" : "password";
      passToggle.setAttribute("aria-pressed", String(show));
      passToggle.setAttribute("aria-label", show ? t.hidePasswordLabel : t.showPasswordLabel);
      passToggle.innerHTML = icon(show ? "eyeOff" : "eye");
      passInput.focus();
    });

    const userInput = el("pNewUsername");
    userInput.addEventListener("input", () => {
      profileEditUsername = userInput.value;
      userInput.removeAttribute("aria-invalid");
      el("pUsernameMsg").innerHTML = "";
      refreshProfileSaveState();
    });
    passInput.addEventListener("input", () => {
      profileEditPassword = passInput.value;
      passInput.removeAttribute("aria-invalid");
      el("pPasswordMsg").innerHTML = "";
      refreshProfileSaveState();
    });

    refreshProfileSaveState();
    el("pSave").addEventListener("click", saveProfileEdits);
  }

  function pfFieldError(msgId, inputId, text) {
    document.getElementById(msgId).innerHTML = icon("alert") + text;
    const input = document.getElementById(inputId);
    input.setAttribute("aria-invalid", "true");
    input.focus();
    input.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  async function saveProfileEdits() {
    const t = L();
    const btn = document.getElementById("pSave");
    const uMsgEl = document.getElementById("pUsernameMsg");
    const pMsgEl = document.getElementById("pPasswordMsg");
    uMsgEl.innerHTML = ""; pMsgEl.innerHTML = "";

    // The button becomes the progress indicator; nothing else on screen moves,
    // so the control the thumb is already on is the one that reports back.
    btn.dataset.busy = "1";
    btn.disabled = true;
    btn.classList.remove("is-saved");
    btn.innerHTML = `<span class="pf-spinner"></span>${t.savingBtn}`;

    const fail = (msgId, inputId, text) => {
      btn.dataset.busy = "";
      pfFieldError(msgId, inputId, text);
      refreshProfileSaveState();
    };

    try {
      const newUsername = document.getElementById("pNewUsername").value.trim();
      if (newUsername && newUsername !== userProfile?.username) {
        if (!USERNAME_RE.test(newUsername)) return fail("pUsernameMsg", "pNewUsername", t.errUsernameFormat);
        const { data: existing } = await sb.from("users").select("id").eq("username", newUsername).maybeSingle();
        if (existing) return fail("pUsernameMsg", "pNewUsername", t.errUsernameTaken);
        const { error } = await sb.auth.updateUser({ data: { username: newUsername, full_name: newUsername } });
        if (error) return fail("pUsernameMsg", "pNewUsername", t.errSignupFailed);
        await sb.from("users").update({ username: newUsername }).eq("id", currentUserId);
        userProfile.username = newUsername;
      }

      const newPassword = document.getElementById("pNewPassword").value;
      if (newPassword) {
        if (newPassword.length < 6 || newPassword.length > 10) return fail("pPasswordMsg", "pNewPassword", t.errPasswordLength);
        const { error } = await sb.auth.updateUser({ password: newPassword });
        if (error) return fail("pPasswordMsg", "pNewPassword", t.errSignupFailed);
      }

      await sb.from("user_preferences").upsert({
        user_id: currentUserId,
        first_name: profileState.firstName || null, last_name: profileState.lastName || null,
        age_range: profileState.ageRange || null, grade: profileState.grade || null, area: profileState.area || null,
        activity_types: profileState.activityTypes, interest_topics: profileState.interestTopics
      });
      currentInterestTopics = profileState.interestTopics;
    } catch (err) {
      console.error(err);
      btn.dataset.busy = "";
      refreshProfileSaveState();
      toast(t.errServerDown);
      return;
    }

    btn.dataset.busy = "";
    profileEditPassword = "";
    profileEditUsername = userProfile?.username || "";
    profileBaseline = profileEditSnapshot();
    btn.classList.add("is-saved");
    btn.innerHTML = icon("check") + t.savedMsg;
    setTimeout(() => {
      window.removeEventListener("scroll", profileBarScrollHandler);
      profileMode = "view";
      showProfile();
    }, 850);
  }

  // ---- Settings ----
  async function saveProfileField(field, value) {
    if (!userProfile) userProfile = {};
    userProfile[field] = value;
    if (currentUserId) {
      await sb.from("users").update({ [field]: value }).eq("id", currentUserId);
    } else if (isGuestMode()) {
      localStorage.setItem("mb_guest_" + field, value);
    }
  }

  function loadGuestSettings() {
    userProfile = {
      theme_pref: localStorage.getItem("mb_guest_theme_pref") || "system",
      text_size: localStorage.getItem("mb_guest_text_size") || "medium",
      language: localStorage.getItem("mb_guest_language") || currentLang
    };
    applyTheme(userProfile.theme_pref);
    applyTextSize(userProfile.text_size);
    setLanguage(userProfile.language);
  }

  function showSettings() {
    appRootEl.hidden = true;
    welcomeScreenEl.hidden = true;
    favoritesScreenEl.hidden = true;
    archiveScreenEl.hidden = true;
    socialScreenEl.hidden = true;
    profileScreenEl.hidden = true;
    accessibilityScreenEl.hidden = true;
    otherProfileScreenEl.hidden = true;
    followListScreenEl.hidden = true;
    settingsScreenEl.hidden = false;
    bottomNavEl.hidden = false;
    setActiveTab("settings");
    renderSettings();
  }

  function renderSettings() {
    const t = L();
    const theme = userProfile?.theme_pref || "system";
    const isPrivate = userProfile?.is_private !== false;
    const loggedIn = !!currentUserId;
    const rtl = LANG_DIR[currentLang] === "rtl";
    // Grouped list: account, then display, then the exit. One card per group,
    // rules between rows, no boxed row-inside-a-box.
    settingsContentEl.innerHTML = `
      ${loggedIn ? `<div class="back-row"><button type="button" class="back-btn" id="sBackToProfile">${icon(rtl ? "chevronBack" : "chevron")}${t.profileTitle}</button></div>` : ""}
      <h1 class="display display-lg">${t.settingsTitle}</h1>

      ${loggedIn ? `
      <section class="settings-group">
        <p class="label settings-group-label">${t.accountGroup}</p>
        <div class="settings-card">
          <div class="set-row set-row--stack">
            <div class="set-row-text">
              <b>${t.privateProfileLabel}</b>
              <span>${t.privateProfileHint}</span>
            </div>
            <div class="seg-2">
              <button type="button" class="seg-opt" aria-pressed="${isPrivate}" data-privacy-opt="true">${icon("lock", "ic-sm")}${t.privateOn}</button>
              <button type="button" class="seg-opt" aria-pressed="${!isPrivate}" data-privacy-opt="false">${icon("users", "ic-sm")}${t.privateOff}</button>
            </div>
          </div>
        </div>
      </section>` : ""}

      <section class="settings-group">
        <p class="label settings-group-label">${t.displayGroup}</p>
        <div class="settings-card">
          <div class="set-row set-row--stack">
            <div class="set-row-text"><b>${t.themeLabel}</b></div>
            <div class="seg-3">
              <button type="button" class="seg-opt" aria-pressed="${theme === "light"}" data-theme-opt="light">${t.themeLight}</button>
              <button type="button" class="seg-opt" aria-pressed="${theme === "dark"}" data-theme-opt="dark">${t.themeDark}</button>
              <button type="button" class="seg-opt" aria-pressed="${theme === "system"}" data-theme-opt="system">${t.themeSystem}</button>
            </div>
          </div>
          <div class="set-row">
            <div class="set-row-text"><b>${t.languageLabel}</b></div>
            <select id="sLangSelect" class="settings-select">
              ${Object.keys(LANG_NAME).map(l => `<option value="${l}" ${currentLang === l ? "selected" : ""}>${LANG_NAME[l]}</option>`).join("")}
            </select>
          </div>
          <button type="button" class="set-row set-row--nav" id="goAccessibility">
            <div class="set-row-text"><b>${t.accessibilityLabel}</b><span>${t.textSizeLabel}</span></div>
            <span class="set-chevron">${icon(rtl ? "chevronBack" : "chevron")}</span>
          </button>
        </div>
      </section>

      <button type="button" class="danger-btn" id="sSignOut">${loggedIn ? t.signOut : t.guestExitBtn}</button>
    `;
    wireSettings();
  }

  function wireSettings() {
    document.getElementById("goAccessibility").addEventListener("click", showAccessibility);
    document.getElementById("sSignOut").addEventListener("click", doSignOut);
    const backBtn = document.getElementById("sBackToProfile");
    if (backBtn) backBtn.addEventListener("click", showProfile);

    document.getElementById("sLangSelect").addEventListener("change", async (e) => {
      const v = e.target.value;
      setLanguage(v);
      await saveProfileField("language", v);
      renderSettings();
    });

    settingsContentEl.querySelectorAll("[data-theme-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.themeOpt;
      applyTheme(v);
      await saveProfileField("theme_pref", v);
      renderSettings();
    }));

    settingsContentEl.querySelectorAll("[data-privacy-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.privacyOpt === "true";
      await saveProfileField("is_private", v);
      renderSettings();
    }));
  }

  function showAccessibility() {
    settingsScreenEl.hidden = true;
    accessibilityScreenEl.hidden = false;
    renderAccessibility();
  }

  function renderAccessibility() {
    const t = L();
    const size = userProfile?.text_size || "medium";
    const rtl = LANG_DIR[currentLang] === "rtl";
    accessibilityContentEl.innerHTML = `
      <div class="back-row"><button type="button" class="back-btn" id="accBack">${icon(rtl ? "chevronBack" : "chevron")}${t.settingsTitle}</button></div>
      <h1 class="display display-lg">${t.accessibilityTitle}</h1>
      <section class="settings-group">
        <p class="label settings-group-label">${t.displayGroup}</p>
        <div class="settings-card">
          <div class="set-row set-row--stack">
            <div class="set-row-text"><b>${t.textSizeLabel}</b><span>${t.textSizeHint}</span></div>
            <div class="seg-3">
              <button type="button" class="seg-opt" aria-pressed="${size === "small"}" data-size-opt="small">${t.textSizeSmall}</button>
              <button type="button" class="seg-opt" aria-pressed="${size === "medium"}" data-size-opt="medium">${t.textSizeMedium}</button>
              <button type="button" class="seg-opt" aria-pressed="${size === "large"}" data-size-opt="large">${t.textSizeLarge}</button>
            </div>
          </div>
        </div>
      </section>
    `;
    document.getElementById("accBack").addEventListener("click", () => { accessibilityScreenEl.hidden = true; settingsScreenEl.hidden = false; });
    accessibilityContentEl.querySelectorAll("[data-size-opt]").forEach(btn => btn.addEventListener("click", async () => {
      const v = btn.dataset.sizeOpt;
      applyTextSize(v);
      await saveProfileField("text_size", v);
      renderAccessibility();
    }));
  }

  // ---- Onboarding questionnaire ----
  const quizScreenEl = document.getElementById("quizScreen");
  const quizContentEl = document.getElementById("quizContent");

  let quiz = null;

  function showQuiz(userId, greetingName) {
    quiz = {
      userId, greetingName, step: 0,
      firstName: "", lastName: "", ageRange: null, grade: null, gradeLabel: "", area: null,
      activityTypes: [], interestTopics: [], interestOther: ""
    };
    appRootEl.hidden = true;
    welcomeScreenEl.hidden = true;
    authScreenEl.hidden = true;
    quizScreenEl.hidden = false;
    renderQuiz();
  }

  const TOTAL_QUIZ_STEPS = 4; // name, demographics, topics, activity types (intro + outro aren't counted)

  function quizProgressHtml(step) {
    let dots = "";
    for (let i = 1; i <= TOTAL_QUIZ_STEPS; i++) {
      dots += `<span class="${i <= step ? "done" : ""}"></span>`;
    }
    return `<div class="quiz-progress">${dots}</div>`;
  }

  function pillOptionsHtml(name, options, selected, multi) {
    return `<div class="quiz-options">${options.map(opt => {
      const v = typeof opt === "string" ? opt : opt.v;
      const l = typeof opt === "string" ? opt : opt.l;
      const isSel = multi ? selected.includes(v) : selected === v;
      return `<button type="button" class="quiz-option" aria-pressed="${isSel}" data-${name}="${v}">${l}</button>`;
    }).join("")}</div>`;
  }

  function selectFieldHtml(id, labelText, options, value) {
    return `
      <div class="quiz-select-field">
        <label for="${id}">${labelText}</label>
        <select id="${id}">
          <option value="" ${!value ? "selected" : ""}>${L().selectPlaceholder}</option>
          ${options.map(o => `<option value="${o}" ${value === o ? "selected" : ""}>${o}</option>`).join("")}
        </select>
      </div>
    `;
  }

  function customTagsHtml(name, presetOptions, selected) {
    const custom = selected.filter(v => !presetOptions.includes(v));
    if (!custom.length) return "";
    return `<div class="quiz-options">${custom.map(v =>
      `<button type="button" class="quiz-option" aria-pressed="true" data-${name}-remove="${v}">${v} ✕</button>`
    ).join("")}</div>`;
  }

  function addCustomRowHtml(inputId, btnId) {
    return `
      <div class="quiz-add-row">
        <input type="text" id="${inputId}" placeholder="${L().addCustomTopicPlaceholder}">
        <button type="button" id="${btnId}" class="quiz-btn secondary quiz-add-btn">${L().addBtn}</button>
      </div>
    `;
  }

  function skipLinkHtml() {
    return `<button type="button" class="quiz-skip" id="qSkip">${L().skipLink}</button>`;
  }

  function renderQuiz() {
    const s = quiz.step;
    const t = L();
    let html = "";

    if (s === 0) {
      html = `
        <div class="quiz-eyebrow">${t.appTitle}</div>
        <h1 class="quiz-title">${t.quizIntroTitle}</h1>
        <p class="quiz-subtitle">${t.quizIntroSubtitle}</p>
        <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="qNext">${t.startBtn}</button></div>
        ${skipLinkHtml()}
      `;
    } else if (s === 1) {
      html = `
        ${quizProgressHtml(1)}
        <h1 class="quiz-title">${t.nameTitle}</h1>
        <div class="quiz-body">
          <div class="quiz-field">
            <label for="qFirstName">${t.firstNameLabel}</label>
            <input type="text" id="qFirstName" value="${quiz.firstName}">
          </div>
          <div class="quiz-field">
            <label for="qLastName">${t.lastNameLabel}</label>
            <input type="text" id="qLastName" value="${quiz.lastName}">
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 2) {
      html = `
        ${quizProgressHtml(2)}
        <h1 class="quiz-title">${t.demoTitle}</h1>
        <p class="quiz-subtitle">${t.demoSubtitle}</p>
        <div class="quiz-body">
          ${selectFieldHtml("qAge", t.ageQLabel, AGE_VALUES, quiz.ageRange)}
          ${selectFieldHtml("qGrade", t.gradeQLabel, t.gradeOptions.map(g => g[1]), quiz.gradeLabel)}
          ${selectFieldHtml("qArea", t.areaQLabel, t.areaOptions, quiz.area)}
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 3) {
      html = `
        ${quizProgressHtml(3)}
        <h1 class="quiz-title">${t.topicsTitle}</h1>
        <p class="quiz-subtitle">${t.topicsSubtitle}</p>
        <div class="quiz-body">
          <div class="quiz-field">
            ${pillOptionsHtml("topic", t.topicOptions, quiz.interestTopics, true)}
            ${customTagsHtml("topic", t.topicOptions, quiz.interestTopics)}
            ${addCustomRowHtml("qAddTopic", "qAddTopicBtn")}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 4) {
      html = `
        ${quizProgressHtml(4)}
        <h1 class="quiz-title">${t.activityTypesTitle}</h1>
        <p class="quiz-subtitle">${t.topicsSubtitle}</p>
        <div class="quiz-body">
          <div class="quiz-field">
            ${pillOptionsHtml("atype", t.activityTypeOptions, quiz.activityTypes, true)}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.finishBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 5) {
      html = `
        <div class="quiz-result">
          <div class="emoji">🎉</div>
          <h1 class="quiz-title">${t.outroTitle}</h1>
          <p class="quiz-subtitle">${t.outroSubtitle}</p>
        </div>
        <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="qEnter">${t.enterAppBtn}</button></div>
      `;
    }

    quizContentEl.innerHTML = html;
    wireQuizStep();
  }

  function wireQuizStep() {
    const s = quiz.step;
    const t = L();
    const nextBtn = document.getElementById("qNext");
    const backBtn = document.getElementById("qBack");
    const enterBtn = document.getElementById("qEnter");
    const skipBtn = document.getElementById("qSkip");

    if (backBtn) backBtn.addEventListener("click", () => { quiz.step--; renderQuiz(); });
    if (enterBtn) enterBtn.addEventListener("click", () => showApp(quiz.greetingName));
    if (skipBtn) skipBtn.addEventListener("click", async () => { await saveQuizProgress(); showApp(quiz.greetingName); });

    if (s === 1) {
      document.getElementById("qFirstName").addEventListener("input", e => quiz.firstName = e.target.value);
      document.getElementById("qLastName").addEventListener("input", e => quiz.lastName = e.target.value);
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 2; renderQuiz(); });
    } else if (s === 2) {
      document.getElementById("qAge").addEventListener("change", e => quiz.ageRange = e.target.value || null);
      document.getElementById("qGrade").addEventListener("change", e => {
        quiz.gradeLabel = e.target.value;
        const match = t.gradeOptions.find(g => g[1] === e.target.value);
        quiz.grade = match ? match[0] : null;
      });
      document.getElementById("qArea").addEventListener("change", e => quiz.area = e.target.value || null);
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 3; renderQuiz(); });
    } else if (s === 3) {
      quizContentEl.querySelectorAll("[data-topic]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topic;
          const i = quiz.interestTopics.indexOf(v);
          if (i === -1) quiz.interestTopics.push(v); else quiz.interestTopics.splice(i, 1);
          renderQuiz();
        }));
      quizContentEl.querySelectorAll("[data-topic-remove]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topicRemove;
          quiz.interestTopics = quiz.interestTopics.filter(x => x !== v);
          renderQuiz();
        }));
      document.getElementById("qAddTopicBtn").addEventListener("click", () => {
        const input = document.getElementById("qAddTopic");
        const v = input.value.trim();
        if (v && !quiz.interestTopics.includes(v)) quiz.interestTopics.push(v);
        renderQuiz();
      });
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 4; renderQuiz(); });
    } else if (s === 4) {
      quizContentEl.querySelectorAll("[data-atype]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.atype;
          const i = quiz.activityTypes.indexOf(v);
          if (i === -1) quiz.activityTypes.push(v); else quiz.activityTypes.splice(i, 1);
          renderQuiz();
        }));
      if (nextBtn) nextBtn.addEventListener("click", finishQuiz);
    } else if (s === 0) {
      if (nextBtn) nextBtn.addEventListener("click", () => { quiz.step = 1; renderQuiz(); });
    }
  }

  async function saveQuizProgress() {
    await sb.from("user_preferences").upsert({
      user_id: quiz.userId,
      first_name: quiz.firstName || null,
      last_name: quiz.lastName || null,
      age_range: quiz.ageRange || null,
      grade: quiz.grade || null,
      area: quiz.area || null,
      activity_types: quiz.activityTypes,
      interest_topics: quiz.interestTopics,
      interest_other: quiz.interestOther || null
    });
    currentInterestTopics = quiz.interestTopics;
  }

  async function finishQuiz() {
    await saveQuizProgress();
    quiz.step = 5;
    renderQuiz();
  }

  (async function boot() {
    applyStaticText();
    // Not awaited, and first: the catalog needs no session, so it loads in
    // parallel with auth instead of queueing behind it.
    loadActivities();
    try {
      if (localStorage.getItem("mb_guest") === "1") {
        currentUserId = null;
        loadGuestSettings();
        showApp(null);
        return;
      }
      const { data: { session } } = await withTimeout(sb.auth.getSession());
      if (session) {
        const name = session.user?.user_metadata?.username || session.user?.email;
        // A returning user holds a valid session in localStorage even while the
        // backend is down, so this path must be bounded too — otherwise the
        // first screen they get is an indefinite blank.
        await withTimeout(proceedAfterAuth(session.user.id, name), NET_TIMEOUT_MS + 4000);
      } else {
        showAuth();
      }
    } catch (err) {
      console.error(err);
      showAuth();
      if (isNetworkFailure(err)) toast(L().errServerDown);
    }
  })();
  </script>
</body>
</html>
