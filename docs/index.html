    favCategoryChipsEl.innerHTML = catChips.map(c => `

    `).join("");

    const topics = favState.category ? topicsForCategory(all, favState.category) : [];
    if (!topics.length) {
      favTopicChipsEl.hidden = true;
      favTopicChipsEl.innerHTML = "";
    } else {
      favTopicChipsEl.hidden = false;

    favSortSelectEl.innerHTML = [

    const list = sortFavorites(visibleFavorites(), favState.sort);

        <div class="empty-state">
          <span class="empty-mark">${icon("search", "ic-lg")}</span>
          <p class="lede" style="text-align:center">${L().emptyStateMsg}</p>
          <button type="button" class="outline-btn" id="favClearFiltersBtn" style="max-width:220px">${L().clearFiltersBtn}</button>
        </div>
      `;
      document.getElementById("favClearFiltersBtn").addEventListener("click", clearFavFilters);
      return;
    }

    favListEl.innerHTML = list.map((a, i) => favRowHtml(a, { index: i })).join("");

  favSearchInputEl.addEventListener("input", (e) => {

  // ---- Activity detail: one full screen, opened from every list in the app.
  // The fact block and the CTA are keyed off item_kind, because a weekly חוג,
  // a one-off אירוע and an open פעילות answer genuinely different questions. ----
  const detailScreenEl = document.getElementById("detailScreen");
  const detailPlateEl = document.getElementById("detailPlate");
  const detailSheetEl = document.getElementById("detailSheet");
  const detailDockEl = document.getElementById("detailDock");
  const detailBackBtnEl = document.getElementById("detailBackBtn");
  const detailSaveBtnEl = document.getElementById("detailSaveBtn");

  function detailKind(a) {
    if (a.item_kind === "event") return "event";
    if (a.schedule_type === "recurring") return "club";
    return "activity";
  }

  // Dock price: the amount only. The period qualifier is a fact, not a headline,
  // and "לכל התקופה" on a single-evening ticket is simply wrong.
  function priceCompact(a) {
    if (a.price == null) return "—";
    if (a.price === 0) return L().free;
    return `${a.price} ₪`;
  }

  function ctaForKind(a) {
    const t = L();
    // Status outranks the kind: never invite someone to register for something
    // that is full, cancelled or already over.
    const blocked = { full: t.ctaFull, cancelled: t.ctaCancelled, ended: t.ctaEnded }[a.status];
    if (blocked) return { href: null, label: blocked, icon: null, disabled: true };
    if (a.status === "postponed") {
      return a.source_url
        ? { href: a.source_url, label: t.ctaPostponed, icon: "chevron", disabled: false }
        : { href: null, label: t.ctaPostponed, icon: null, disabled: true };
    }
    const kind = detailKind(a);
    const label = kind === "event" ? t.ctaTickets : kind === "club" ? t.ctaJoinClub : t.ctaRegister;
    const ic = kind === "event" ? "ticket" : "check";
    if (a.registration_url) return { href: a.registration_url, label, icon: ic, disabled: false };
    if (a.source_url) return { href: a.source_url, label: t.moreInfoSource, icon: "chevron", disabled: false };
    return { href: null, label: t.registrationSoon, icon: null, disabled: true };
  }

  // Kind-specific fact rows. Only rows with a real value are emitted — an empty
  // labelled row reads as missing data rather than as an absent field.
  function factRowsFor(a) {
    const t = L();
    const when = whenText(a);
    const kind = detailKind(a);
    const rows = [];

    if (kind === "club") {
      rows.push(["repeat", when.main, when.sub]);
      if (a.start_date) rows.push(["calendar", t.startsOnLabel, fmtDate(a.start_date) + (a.end_date ? " – " + fmtDate(a.end_date) : " · " + t.noEndDate)]);
    } else if (kind === "event") {
      rows.push(["calendar", when.main, when.sub]);
      if (a.registration_deadline) rows.push(["clock", t.deadlineLabel, fmtDate(a.registration_deadline)]);
    } else {
      rows.push(["calendar", when.main, when.sub]);
      if (a.sessions_count) rows.push(["repeat", t.sessionsLabel(a.sessions_count), ""]);
    }

    rows.push(["pin", a.location_name, [a.neighborhood, a.organization_name].filter(Boolean).join(" · ")]);
    rows.push(["age", ageText(a), a.is_accessible ? t.accessibleNote : ""]);

    if (a.capacity != null) rows.push(["users", t.spotsLeftText(a.spots_left ?? 0, a.capacity), ""]);
    // The dock shows the bare amount, so the period qualifier lives here.
    rows.push(["coin", priceText(a), kind === "club" && a.price ? t.pricePerClubNote : ""]);

    return rows.filter(r => r[1]).map(([ic, main, sub]) => `
      <div class="fact-row">
        ${icon(ic)}
        <div class="fact-row-body"><b>${main}</b>${sub ? `<span>${sub}</span>` : ""}</div>
      </div>`).join("");
  }

  // Real signal only: who among the people you follow has pinned this. There is
  // no registration tracking in this product, so no attendance count is invented.
  async function friendsWhoPinned(activityId) {
    if (!currentUserId) return [];
    const { data: rel } = await sb.from("follows").select("followee_id")
      .eq("follower_id", currentUserId).eq("status", "accepted");
    const ids = (rel || []).map(r => r.followee_id);
    if (!ids.length) return [];
    const { data: favs } = await sb.from("favorites").select("user_id")
      .eq("activity_id", activityId).in("user_id", ids);
    const pinnedBy = [...new Set((favs || []).map(r => r.user_id))];
    if (!pinnedBy.length) return [];
    const { data: users } = await sb.from("users").select("id, username, avatar_url, is_private").in("id", pinnedBy);
    return users || [];
  }

  // ---- Social (follow system) ----
  // Note on scope: profile-picture/detail privacy is enforced here only at the UI
  // layer (we simply don't fetch/render a photo or the favorites list when the
  // viewer isn't allowed to see them). The `avatars` storage bucket is already
  // fully public-read regardless of any flag, and Postgres RLS can't hide one
  // column while exposing others on the same `users` row — real hardening would
  // need a private bucket with signed URLs and/or a dedicated view. Not done here.

  async function getRelationship(otherUserId) {
    if (!currentUserId || otherUserId === currentUserId) return null;
    const { data } = await sb.from("follows").select("status")
      .eq("follower_id", currentUserId).eq("followee_id", otherUserId).maybeSingle();
    return data ? data.status : null;
  }

  async function followUser(otherUserId, otherIsPrivate) {
    if (!currentUserId) return;
    const { error } = await sb.from("follows").insert({
      follower_id: currentUserId,
      followee_id: otherUserId,
      status: otherIsPrivate ? "pending" : "accepted"
    });
    if (error) console.error(error);
  }

  async function unfollowOrCancel(otherUserId) {
    if (!currentUserId) return;
    const { error } = await sb.from("follows").delete()
      .eq("follower_id", currentUserId).eq("followee_id", otherUserId);
    if (error) console.error(error);
  }

  async function approveRequest(followerId) {
    if (!currentUserId) return;
    const { error } = await sb.from("follows").update({ status: "accepted" })
      .eq("follower_id", followerId).eq("followee_id", currentUserId);
    if (error) console.error(error);
  }

  async function denyOrRemove(followerId) {
    if (!currentUserId) return;
    const { error } = await sb.from("follows").delete()
      .eq("follower_id", followerId).eq("followee_id", currentUserId);
    if (error) console.error(error);
  }

  function canViewProfile(targetUser, relationship) {
    if (!targetUser) return false;
    return targetUser.id === currentUserId || targetUser.is_private === false || relationship === "accepted";
  }

  async function loadFavoritesFor(userId) {
    const { data } = await sb.from("favorites").select("activity_id").eq("user_id", userId);
    const ids = new Set((data || []).map(r => r.activity_id));
    return activities.filter(a => a.id && ids.has(a.id));
  }

  async function loadSocialCounts(userId) {
    const [followersRes, followingRes, pendingRes] = await Promise.all([
      sb.from("follows").select("id", { count: "exact", head: true }).eq("followee_id", userId).eq("status", "accepted"),
      sb.from("follows").select("id", { count: "exact", head: true }).eq("follower_id", userId).eq("status", "accepted"),
      userId === currentUserId
        ? sb.from("follows").select("id", { count: "exact", head: true }).eq("followee_id", userId).eq("status", "pending")
        : Promise.resolve({ count: 0 })
    ]);
    return { followers: followersRes.count || 0, following: followingRes.count || 0, pending: pendingRes.count || 0 };
  }

  async function searchUsers(query) {
    if (!query) return [];
    const { data } = await sb.from("users")
      .select("id, username, avatar_url, is_private")
      .ilike("username", query + "%")
      .neq("id", currentUserId)
      .limit(20);
    const rows = data || [];
    if (!rows.length) return rows;
    const ids = rows.map(r => r.id);
    const { data: rel } = await sb.from("follows").select("followee_id, status")
      .eq("follower_id", currentUserId).in("followee_id", ids);
    const relMap = new Map((rel || []).map(r => [r.followee_id, r.status]));
    return rows.map(r => ({ ...r, relationship: relMap.get(r.id) || null }));
  }

  function userAvatarStyle(u) {
    return !u.is_private && u.avatar_url ? `background-image:url('${u.avatar_url}')` : "";
  }

  function followBtnHtml(userId, isPrivate, relationship) {
    if (relationship === "accepted") {
      return `<button type="button" class="follow-btn" data-unfollow="${userId}">${L().followingBtn}</button>`;
    }
    if (relationship === "pending") {
      return `<button type="button" class="follow-btn" data-unfollow="${userId}">${L().requestedBtn}</button>`;
    }
    return `<button type="button" class="follow-btn primary" data-follow="${userId}" data-private="${!!isPrivate}">${L().followBtn}</button>`;
  }

  // Shared user row. The lock is a drawn tack-adjacent glyph, not an emoji, and
  // a private account never renders its avatar — that gate lives in userAvatarStyle.
  function userRowHtml(u, actionHtml, subline) {
    const style = userAvatarStyle(u);
    return `
      <div class="user-row" role="button" tabindex="0" data-open-user="${u.id}">
        <span class="avatar" style="${style}">${style ? "" : (u.username || "?").charAt(0).toUpperCase()}</span>
        <span class="user-row-main">
          <span class="user-row-name">${u.username}${u.is_private ? `<span class="lock-mark" aria-label="${L().privateOn}">${icon("lock", "ic-sm")}</span>` : ""}</span>
          ${subline ? `<span class="user-row-sub">${subline}</span>` : ""}
        </span>
        ${actionHtml}
      </div>
    `;
  }

  async function renderOtherProfile() {
    const t = L();
    const userId = otherProfileUserId;
    otherProfileContentEl.innerHTML = `<p class="quiz-subtitle">…</p>`;
    const [{ data: targetUser }, relationship, counts] = await Promise.all([
      sb.from("users").select("id, username, avatar_url, is_private").eq("id", userId).maybeSingle(),
      getRelationship(userId),
      loadSocialCounts(userId)
    ]);
    if (otherProfileUserId !== userId) return; // navigated away while loading
    if (!targetUser) { otherProfileContentEl.innerHTML = `<p class="quiz-subtitle">${t.noUsersFoundMsg}</p>`; return; }

      const favs = await loadFavoritesFor(userId);

      bodyHtml = `
        <p class="quiz-section-label">${t.favoritesOfUser(targetUser.username)}</p>

      `;
    } else {
      bodyHtml = `<div class="locked-profile"><span class="lock-emoji">🔒</span><p>${t.lockedProfileMsg}</p></div>`;
    }

    otherProfileContentEl.innerHTML = `
      <button type="button" class="settings-back" id="opBack">${LANG_DIR[currentLang] === "rtl" ? "› " + t.profileTitle : "‹ " + t.profileTitle}</button>
      <div class="profile-avatar-row">

        <div class="profile-username">${targetUser.username}${targetUser.is_private ? `<span class="lock-mark" aria-label="${t.privateOn}">${icon("lock")}</span>` : ""}</div>
        <div class="profile-stats-row">
          ${visible
            ? `<button type="button" class="profile-stat" data-open-follow-list="followers"><b>${counts.followers}</b><span>${t.followersLabel}</span></button>
               <button type="button" class="profile-stat" data-open-follow-list="following"><b>${counts.following}</b><span>${t.followingLabel}</span></button>`
            : `<span class="profile-stat"><b>${counts.followers}</b><span>${t.followersLabel}</span></span>
               <span class="profile-stat"><b>${counts.following}</b><span>${t.followingLabel}</span></span>`}
        </div>
        ${followBtnHtml(targetUser.id, targetUser.is_private, relationship)}
      </div>
      ${bodyHtml}

    document.getElementById("opBack").addEventListener("click", () => { otherProfileUserId = null; (returnToScreen || showProfile)(); });

  // ---- Social tab: user search + incoming follow requests + follow
  // recommendations (scored by shared interest_topics; falls back to newest
  // public accounts when there's no overlap for anyone) ----
  const dismissedRecommendedUsers = new Set();

  async function recommendedUsers() {
    if (!currentUserId) return [];
    const [{ data: candidates }, { data: myFollows }] = await Promise.all([
      sb.from("users").select("id, username, avatar_url, is_private, created_at")
        .eq("is_private", false).neq("id", currentUserId)
        .order("created_at", { ascending: false }).limit(30),
      sb.from("follows").select("followee_id").eq("follower_id", currentUserId)
    ]);
    const excluded = new Set((myFollows || []).map(r => r.followee_id));
    const pool = (candidates || []).filter(u => !excluded.has(u.id) && !dismissedRecommendedUsers.has(u.id));
    if (!pool.length) return [];
    const ids = pool.map(u => u.id);
    const { data: prefs } = await sb.from("user_preferences").select("user_id, interest_topics").in("user_id", ids);
    const topicsByUser = new Map((prefs || []).map(p => [p.user_id, new Set(p.interest_topics || [])]));
    const scored = pool.map(u => ({ ...u, score: currentInterestTopics.filter(t => (topicsByUser.get(u.id) || new Set()).has(t)).length }));
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 8);
  }

      .eq("followee_id", currentUserId).eq("status", "pending").order("created_at", { ascending: false });
    const el = document.getElementById("socialRequests");

    const ids = rows.map(r => r.follower_id);

  function applyTheme(pref) {
    const root = document.documentElement;
    if (pref === "light" || pref === "dark") root.setAttribute("data-theme", pref);
    else root.removeAttribute("data-theme");
  }

  function applyTextSize(size) {
    const scale = { small: "0.9", medium: "1", large: "1.2" }[size] || "1";
    document.documentElement.style.setProperty("--text-scale", scale);
  }

  let userProfile = null;

  // docs/index.html ships via GitHub Pages independently of `supabase db push`,
  // so the frontend can be newer than the schema. Selecting a column that does
  // not exist yet fails the whole row, which used to blank the entire profile —
  // so a missing newer column degrades to "not set" instead of "no profile".
  const PROFILE_BASE_COLS = "username, avatar_url, theme_pref, text_size, language, is_private";
  const PROFILE_NEW_COLS = ["banner_url"];

  async function loadAndApplyProfile(userId) {
    currentUserId = userId;
    let { data, error } = await sb.from("users")
      .select([PROFILE_BASE_COLS, ...PROFILE_NEW_COLS].join(", "))
      .eq("id", userId).maybeSingle();
    if (error) {
      console.warn("profile select fell back to base columns:", error.message);
      ({ data } = await sb.from("users").select(PROFILE_BASE_COLS).eq("id", userId).maybeSingle());
    }
    userProfile = data || null;
    if (userProfile) {
      setLanguage(userProfile.language || "he");
      applyTheme(userProfile.theme_pref || "system");
      applyTextSize(userProfile.text_size || "medium");
    }
  }

  let authMode = "login";

  const USERNAME_RE = /^[A-Za-zא-ת][A-Za-zא-ת0-9_]*$/;

  function usernameToEmail(username) {
    return username.trim().toLowerCase().replace(/\s+/g, "_") + "@mahbaim.app";
  }

  // The gate is two screens now: a welcome sheet, then one form that flips
  // between signup and login. No tab strip — the mode owns the whole screen.
  function setAuthMode(mode) {
    authMode = mode;
    const t = L();
    const signup = mode === "signup";
    document.getElementById("authTitleText").textContent = signup ? t.signupTitle : t.loginTitle;
    document.getElementById("authTaglineText").textContent = signup ? t.signupLede : t.loginLede;
    authSubmitEl.textContent = signup ? t.signupSubmit : t.loginSubmit;
    authSwitchBtnEl.innerHTML = signup ? t.switchToLogin : t.switchToSignup;
    authPasswordEl.setAttribute("autocomplete", signup ? "new-password" : "current-password");
    authUsernameEl.removeAttribute("aria-invalid");
    authPasswordEl.removeAttribute("aria-invalid");
    authErrorEl.innerHTML = "";
  }

  function showAuthMode(mode) {
    welcomeScreenEl.hidden = true;
    authScreenEl.hidden = false;
    bottomNavEl.hidden = true;
    document.body.classList.remove("has-bottom-nav");
    authForm.reset();
    setAuthMode(mode);
    window.scrollTo(0, 0);
  }

  authSwitchBtnEl.addEventListener("click", () => setAuthMode(authMode === "signup" ? "login" : "signup"));
  document.getElementById("welcomeStartBtn").addEventListener("click", () => showAuthMode("signup"));
  document.getElementById("welcomeLoginBtn").addEventListener("click", () => showAuthMode("login"));
  document.getElementById("authBackBtn").addEventListener("click", showAuth);

  function setAuthError(msg, field) {
    authErrorEl.innerHTML = msg ? `${icon("alert", "ic-sm")}<span>${msg}</span>` : "";
    authUsernameEl.removeAttribute("aria-invalid");
    authPasswordEl.removeAttribute("aria-invalid");
    if (field === "username") authUsernameEl.setAttribute("aria-invalid", "true");
    if (field === "password") authPasswordEl.setAttribute("aria-invalid", "true");
  }

  function isGuestMode() { return localStorage.getItem("mb_guest") === "1"; }

  function setActiveTab(tab) {
    navHomeEl.setAttribute("aria-current", tab === "home");
    navFavoritesEl.setAttribute("aria-current", tab === "favorites");
    navSocialEl.setAttribute("aria-current", tab === "social");
    navProfileEl.setAttribute("aria-current", tab === "profile");
    navSettingsEl.setAttribute("aria-current", tab === "settings");
  }

  function showApp(greetingName) {
    quizScreenEl.hidden = true;
    authScreenEl.hidden = true;
    welcomeScreenEl.hidden = true;
    favoritesScreenEl.hidden = true;

    const guest = isGuestMode();
    bottomNavEl.hidden = false;
    navFavoritesEl.hidden = guest;
    navSocialEl.hidden = guest;
    navProfileEl.hidden = guest;
    // Settings moved off the bottom nav for logged-in users — it's reached via the
    // gear icon on the Profile screen instead. Guests have no Profile screen, so
    // they keep Settings as their own tab (their only way to reach it).
    navSettingsEl.hidden = !guest;

    appRootEl.hidden = true;
    welcomeScreenEl.hidden = true;

  // Registered users (login or signup) answer the onboarding questionnaire
  // exactly once; guests skip it entirely, since guest data is never collected.
  async function proceedAfterAuth(userId, greetingName) {
    await loadAndApplyProfile(userId);
    await loadFavorites();
    // On a fresh page load, showApp()'s first-run initAppUI() renders Home after this
    // point anyway, and showApp() itself re-renders Home on every call once started.
    // Favorites has no such call site on the login path, so refresh it explicitly here.
    if (appStarted) renderFavorites();
    const { data: prefs } = await sb.from("user_preferences").select("user_id, interest_topics").eq("user_id", userId).maybeSingle();
    currentInterestTopics = prefs?.interest_topics || [];
    if (prefs) {
      showApp(greetingName);
    } else {
      showQuiz(userId, greetingName);
    }
  }

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = authUsernameEl.value.trim();
    const password = authPasswordEl.value;
    if (!username || !password) return;

    authSubmitEl.disabled = true;
    setAuthError("");

    try {
      if (authMode === "signup") {
        const email = usernameToEmail(username);
        if (!USERNAME_RE.test(username)) {
          setAuthError(L().errUsernameFormat, "username");
          return;
        }
        if (password.length < 6 || password.length > 10) {
          setAuthError(L().errPasswordLength, "password");
          return;
        }
        const { data: existing } = await sb.from("users").select("id").eq("username", username).maybeSingle();
        if (existing) {
          setAuthError(L().errUsernameTaken, "username");
          return;
        }
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { username, full_name: username } }
        });
        if (error) throw error;
        if (!data.session) {
          setAuthError(L().errSignupNeedsVerification);
          return;
        }
        localStorage.removeItem("mb_guest");
        await proceedAfterAuth(data.user.id, username);
      } else {
        const { data: existing } = await sb.from("users").select("email").eq("username", username).maybeSingle();
        if (!existing) throw new Error("not found");
        const { data, error } = await sb.auth.signInWithPassword({ email: existing.email, password });
        if (error) throw error;
        localStorage.removeItem("mb_guest");
        const name = data.user?.user_metadata?.username || username;
        await proceedAfterAuth(data.user.id, name);
      }
    } catch (err) {
      setAuthError(authMode === "login" ? L().errLoginFailed : L().errSignupFailed);
    } finally {
      authSubmitEl.disabled = false;
    }
  });

  guestBtnEl.addEventListener("click", () => {
    localStorage.setItem("mb_guest", "1");
    currentUserId = null;
    favoriteIds = new Set();
    favoritedAt = new Map();

    otherProfileUserId = null;
    followListUserId = null;
    currentInterestTopics = [];
    loadGuestSettings();
    showApp(null);
  });

  async function doSignOut() {
    localStorage.removeItem("mb_guest");
    currentUserId = null;
    userProfile = null;
    favoriteIds = new Set();
    favoritedAt = new Map();
    socialCounts = { followers: 0, following: 0, pending: 0 };
    otherProfileUserId = null;
    followListUserId = null;
    currentInterestTopics = [];
    closeActivityDetail();
    const { data: { session } } = await sb.auth.getSession();
    if (session) await sb.auth.signOut();
    showAuth();
  }

  async function showProfile() {
    returnToScreen = null;
    appRootEl.hidden = true;
    welcomeScreenEl.hidden = true;
    favoritesScreenEl.hidden = true;
    archiveScreenEl.hidden = true;
    socialScreenEl.hidden = true;
    settingsScreenEl.hidden = true;
    accessibilityScreenEl.hidden = true;
    otherProfileScreenEl.hidden = true;
    followListScreenEl.hidden = true;
    profileScreenEl.hidden = false;
    bottomNavEl.hidden = false;
    setActiveTab("profile");
    profileMode = "view";
    const { data: prefs } = await sb.from("user_preferences").select("*").eq("user_id", currentUserId).maybeSingle();
    const gradeMatch = L().gradeOptions.find(g => g[0] === prefs?.grade);
    profileState = {
      firstName: prefs?.first_name || "", lastName: prefs?.last_name || "",
      ageRange: prefs?.age_range || "", grade: prefs?.grade || null,
      gradeLabel: gradeMatch ? gradeMatch[1] : (prefs?.grade || ""),
      area: prefs?.area || "",
      activityTypes: prefs?.activity_types || [], interestTopics: prefs?.interest_topics || []
    };
    socialCounts = await loadSocialCounts(currentUserId);
    renderProfile();
  }

  // Profile's own pinned rows and the avatar picker are re-rendered on every
  // renderProfile, so their handling is delegated on the stable container.
  profileContentEl.addEventListener("click", (e) => {
    const fav = e.target.closest("[data-fav-id]");
    if (fav) { e.stopPropagation(); toggleFavorite(fav.dataset.favId); return; }
    const row = e.target.closest(".fav-row[data-open-id]");
    if (row) openActivityDetail(row.dataset.openId);
  });

  profileContentEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest(".fav-row[data-open-id]");
    if (!row || e.target.closest("[data-fav-id]")) return;
    e.preventDefault();
    openActivityDetail(row.dataset.openId);
  });

  function staticChipsHtml(values) {
    if (!values.length) return `<p class="quiz-subtitle">${L().noneYet}</p>`;
    return `<div class="quiz-options">${values.map(v => `<span class="quiz-option static" aria-pressed="true">${v}</span>`).join("")}</div>`;
  }

  function renderProfile() {
    const t = L();
    const avatarStyle = userProfile?.avatar_url ? `background-image:url('${userProfile.avatar_url}')` : "";
    // profileState is filled by showProfile(); anything that repaints the profile
    // out of band (a media upload, a language switch) must not assume it is there.
    if (!profileState) return;

    if (profileMode === "view") {
      const name = userProfile?.username || "";
      const fullName = [profileState.firstName, profileState.lastName].filter(Boolean).join(" ");

  // Avatar and banner share one uploader: same public bucket, same per-user
  // folder, so the bucket's existing owner-only RLS covers both. The failure
  // path reports rather than silently doing nothing, which is how the old
  // version behaved on an oversized or rejected file.
  const MEDIA_MAX_BYTES = 5 * 1024 * 1024;

  async function uploadProfileMedia(file, kind) {
    const t = L();
    if (!file || !currentUserId) return;
    if (!file.type.startsWith("image/")) { toast(t.mediaNotImage); return; }
    if (file.size > MEDIA_MAX_BYTES) { toast(t.mediaTooBig); return; }
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    const path = `${currentUserId}/${kind}.${ext}`;
    const column = kind === "banner" ? "banner_url" : "avatar_url";
    toast(t.mediaUploading);
    const { error } = await sb.storage.from("avatars").upload(path, file, { upsert: true, contentType: file.type });
    if (error) { toast(t.mediaFailed); console.error(error); return; }
    const { data } = sb.storage.from("avatars").getPublicUrl(path);
    const url = data.publicUrl + "?t=" + Date.now();
    const { error: dbError } = await sb.from("users").update({ [column]: url }).eq("id", currentUserId);
    if (dbError) { toast(t.mediaFailed); console.error(dbError); return; }
    if (userProfile) userProfile[column] = url;
    renderProfile();
    toast(t.mediaSaved);
  }

  async function handleAvatarUpload(e) {
    await uploadProfileMedia(e.target.files[0], "avatar");
    e.target.value = "";
  }

  async function handleBannerUpload(e) {
    await uploadProfileMedia(e.target.files[0], "banner");
    e.target.value = "";
  }

  function wireProfileEdit() {
    const t = L();
    const backToView = () => { profileMode = "view"; showProfile(); };
    document.getElementById("pCancel").addEventListener("click", backToView);
    document.getElementById("pCancelTop").addEventListener("click", backToView);
    document.getElementById("avatarBtn").addEventListener("click", () => document.getElementById("avatarInput").click());
    document.getElementById("avatarInput").addEventListener("change", handleAvatarUpload);
    document.getElementById("bannerBtn").addEventListener("click", () => document.getElementById("bannerInput").click());
    document.getElementById("bannerInput").addEventListener("change", handleBannerUpload);
    document.getElementById("pFirstName").addEventListener("input", e => profileState.firstName = e.target.value);
    document.getElementById("pLastName").addEventListener("input", e => profileState.lastName = e.target.value);
    document.getElementById("pAge").addEventListener("change", e => profileState.ageRange = e.target.value || null);
    document.getElementById("pGrade").addEventListener("change", e => {
      const match = t.gradeOptions.find(g => g[1] === e.target.value);
      profileState.grade = match ? match[0] : null;
      profileState.gradeLabel = e.target.value;
    });
    document.getElementById("pArea").addEventListener("change", e => profileState.area = e.target.value || null);
    profileContentEl.querySelectorAll("[data-ptopic]").forEach(btn => btn.addEventListener("click", () => {
      const v = btn.dataset.ptopic;
      const i = profileState.interestTopics.indexOf(v);
      if (i === -1) profileState.interestTopics.push(v); else profileState.interestTopics.splice(i, 1);
      renderProfile();
    }));
    profileContentEl.querySelectorAll("[data-ptopic-remove]").forEach(btn => btn.addEventListener("click", () => {
      profileState.interestTopics = profileState.interestTopics.filter(x => x !== btn.dataset.ptopicRemove);
      renderProfile();
    }));
    document.getElementById("pAddTopicBtn").addEventListener("click", () => {
      const input = document.getElementById("pAddTopic");
      const v = input.value.trim();
      if (v && !profileState.interestTopics.includes(v)) profileState.interestTopics.push(v);
      renderProfile();
    });
    profileContentEl.querySelectorAll("[data-patype]").forEach(btn => btn.addEventListener("click", () => {
      const v = btn.dataset.patype;
      const i = profileState.activityTypes.indexOf(v);
      if (i === -1) profileState.activityTypes.push(v); else profileState.activityTypes.splice(i, 1);
      renderProfile();
    }));

    document.getElementById("pSave").addEventListener("click", async () => {
      const savedMsgEl = document.getElementById("pSavedMsg");
      const uMsgEl = document.getElementById("pUsernameMsg");
      const pMsgEl = document.getElementById("pPasswordMsg");
      uMsgEl.textContent = ""; pMsgEl.textContent = "";

      const newUsername = document.getElementById("pNewUsername").value.trim();
      if (newUsername && newUsername !== userProfile?.username) {
        if (!USERNAME_RE.test(newUsername)) { uMsgEl.textContent = t.errUsernameFormat; return; }
        const { data: existing } = await sb.from("users").select("id").eq("username", newUsername).maybeSingle();
        if (existing) { uMsgEl.textContent = t.errUsernameTaken; return; }
        const { error } = await sb.auth.updateUser({ data: { username: newUsername, full_name: newUsername } });
        if (error) { uMsgEl.textContent = t.errSignupFailed; return; }
        await sb.from("users").update({ username: newUsername }).eq("id", currentUserId);
        userProfile.username = newUsername;
      }

      const newPassword = document.getElementById("pNewPassword").value;
      if (newPassword) {
        if (newPassword.length < 6 || newPassword.length > 10) { pMsgEl.textContent = t.errPasswordLength; return; }
        const { error } = await sb.auth.updateUser({ password: newPassword });
        if (error) { pMsgEl.textContent = t.errSignupFailed; return; }
      }

      await sb.from("user_preferences").upsert({
        user_id: currentUserId,
        first_name: profileState.firstName || null, last_name: profileState.lastName || null,
        age_range: profileState.ageRange || null, grade: profileState.grade || null, area: profileState.area || null,
        activity_types: profileState.activityTypes, interest_topics: profileState.interestTopics
      });
      currentInterestTopics = profileState.interestTopics;

      savedMsgEl.textContent = t.savedMsg;
      setTimeout(() => { profileMode = "view"; showProfile(); }, 600);
    });
  }

    settingsContentEl.querySelectorAll("[data-privacy-opt]").forEach(btn => btn.addEventListener("click", async () => {

  const TOTAL_QUIZ_STEPS = 4; // name, demographics, topics, activity types (intro + outro aren't counted)

  function quizProgressHtml(step) {
    let dots = "";
    for (let i = 1; i <= TOTAL_QUIZ_STEPS; i++) {
      dots += `<span class="${i <= step ? "done" : ""}"></span>`;
    }
    return `<div class="quiz-progress">${dots}</div>`;

  function pillOptionsHtml(name, options, selected, multi) {
    return `<div class="quiz-options">${options.map(opt => {
      const v = typeof opt === "string" ? opt : opt.v;
      const l = typeof opt === "string" ? opt : opt.l;
      const isSel = multi ? selected.includes(v) : selected === v;
      return `<button type="button" class="quiz-option" aria-pressed="${isSel}" data-${name}="${v}">${l}</button>`;
    }).join("")}</div>`;
  }

  function selectFieldHtml(id, labelText, options, value) {
    return `
      <div class="quiz-select-field">
        <label for="${id}">${labelText}</label>
        <select id="${id}">
          <option value="" ${!value ? "selected" : ""}>${L().selectPlaceholder}</option>
          ${options.map(o => `<option value="${o}" ${value === o ? "selected" : ""}>${o}</option>`).join("")}
        </select>
      </div>

  }

  function customTagsHtml(name, presetOptions, selected) {
    const custom = selected.filter(v => !presetOptions.includes(v));

    return `<div class="quiz-options">${custom.map(v =>

          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>

    } else if (s === 3) {

        <p class="quiz-subtitle">${t.topicsSubtitle}</p>
        <div class="quiz-body">
          <div class="quiz-field">
            ${pillOptionsHtml("topic", t.topicOptions, quiz.interestTopics, true)}
            ${customTagsHtml("topic", t.topicOptions, quiz.interestTopics)}
            ${addCustomRowHtml("qAddTopic", "qAddTopicBtn")}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.nextBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 4) {
      html = `
        ${quizProgressHtml(4)}
        <h1 class="quiz-title">${t.activityTypesTitle}</h1>
        <p class="quiz-subtitle">${t.topicsSubtitle}</p>
        <div class="quiz-body">
          <div class="quiz-field">
            ${pillOptionsHtml("atype", t.activityTypeOptions, quiz.activityTypes, true)}
          </div>
        </div>
        <div class="quiz-nav">
          <button type="button" class="quiz-btn secondary" id="qBack">${t.backBtn}</button>
          <button type="button" class="quiz-btn primary" id="qNext">${t.finishBtn}</button>
        </div>
        ${skipLinkHtml()}
      `;
    } else if (s === 5) {
      html = `
        <div class="quiz-result">
          <div class="emoji">🎉</div>
          <h1 class="quiz-title">${t.outroTitle}</h1>
          <p class="quiz-subtitle">${t.outroSubtitle}</p>
        </div>
        <div class="quiz-nav"><button type="button" class="quiz-btn primary" id="qEnter">${t.enterAppBtn}</button></div>
      `;
    }

    quizContentEl.innerHTML = html;
    wireQuizStep();
  }

  function wireQuizStep() {
    const s = quiz.step;
    const t = L();
    const nextBtn = document.getElementById("qNext");
    const backBtn = document.getElementById("qBack");
    const enterBtn = document.getElementById("qEnter");
    const skipBtn = document.getElementById("qSkip");

    if (backBtn) backBtn.addEventListener("click", () => { quiz.step--; renderQuiz(); });
    if (enterBtn) enterBtn.addEventListener("click", () => showApp(quiz.greetingName));
    if (skipBtn) skipBtn.addEventListener("click", async () => { await saveQuizProgress(); showApp(quiz.greetingName); });

    if (s === 1) {
      document.getElementById("qFirstName").addEventListener("input", e => quiz.firstName = e.target.value);
      document.getElementById("qLastName").addEventListener("input", e => quiz.lastName = e.target.value);
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 2; renderQuiz(); });
    } else if (s === 2) {
      document.getElementById("qAge").addEventListener("change", e => quiz.ageRange = e.target.value || null);
      document.getElementById("qGrade").addEventListener("change", e => {
        quiz.gradeLabel = e.target.value;
        const match = t.gradeOptions.find(g => g[1] === e.target.value);
        quiz.grade = match ? match[0] : null;
      });
      document.getElementById("qArea").addEventListener("change", e => quiz.area = e.target.value || null);
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 3; renderQuiz(); });
    } else if (s === 3) {
      quizContentEl.querySelectorAll("[data-topic]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topic;
          const i = quiz.interestTopics.indexOf(v);
          if (i === -1) quiz.interestTopics.push(v); else quiz.interestTopics.splice(i, 1);
          renderQuiz();
        }));
      quizContentEl.querySelectorAll("[data-topic-remove]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.topicRemove;
          quiz.interestTopics = quiz.interestTopics.filter(x => x !== v);
          renderQuiz();
        }));
      document.getElementById("qAddTopicBtn").addEventListener("click", () => {
        const input = document.getElementById("qAddTopic");
        const v = input.value.trim();
        if (v && !quiz.interestTopics.includes(v)) quiz.interestTopics.push(v);
        renderQuiz();
      });
      if (nextBtn) nextBtn.addEventListener("click", async () => { await saveQuizProgress(); quiz.step = 4; renderQuiz(); });
    } else if (s === 4) {
      quizContentEl.querySelectorAll("[data-atype]").forEach(btn =>
        btn.addEventListener("click", () => {
          const v = btn.dataset.atype;
          const i = quiz.activityTypes.indexOf(v);
          if (i === -1) quiz.activityTypes.push(v); else quiz.activityTypes.splice(i, 1);
          renderQuiz();
        }));
      if (nextBtn) nextBtn.addEventListener("click", finishQuiz);
    } else if (s === 0) {
      if (nextBtn) nextBtn.addEventListener("click", () => { quiz.step = 1; renderQuiz(); });
    }
  }

  async function saveQuizProgress() {
    await sb.from("user_preferences").upsert({
      user_id: quiz.userId,
      first_name: quiz.firstName || null,
      last_name: quiz.lastName || null,
      age_range: quiz.ageRange || null,
      grade: quiz.grade || null,
      area: quiz.area || null,
      activity_types: quiz.activityTypes,
      interest_topics: quiz.interestTopics,
      interest_other: quiz.interestOther || null
    });
    currentInterestTopics = quiz.interestTopics;
  }

  async function finishQuiz() {
    await saveQuizProgress();
    quiz.step = 5;
    renderQuiz();
  }

  (async function boot() {
    applyStaticText();
    try {
      if (localStorage.getItem("mb_guest") === "1") {
        currentUserId = null;
        loadGuestSettings();
        showApp(null);
        return;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const name = session.user?.user_metadata?.username || session.user?.email;
        await proceedAfterAuth(session.user.id, name);
      } else {
        showAuth();
      }
    } catch (err) {
      showAuth();
    }
  })();
  </script>
</body>
</html>
