<body>
<!--
THESIS: A teen finds out what's happening from the bulletin board at the מתנ"ס — layered, over-inked, pasted flyers. So the app is that wall, printed.
OWN-WORLD: Risograph spot-ink. Five unmixed inks on warm newsprint, halftone dot fields, 2–3px ink rules, misregistered display type, zero radius, pasted rotation.
STORY: Poster masthead → bulletin feed of unequal clippings → one activity blown up to a full printed poster → your own wall of pinned clippings.
FIRST VIEWPORT: A drenched pink field, מה / בי״ם stacked at 56px in Heebo 900 with a blue registration shadow, halftone bleeding off the bottom edge.
FORM: Ink panels, hard offset registration shadow, drawn SVG icons in one stroke, per-category two-ink overprint compositions generated from the activity id.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<script src="activities.js"></script>
<style>
/* ============ INK & STOCK ============ */
:root{
  --pink:#FF48A0; --blue:#0B63CE; --yellow:#FFD400; --green:#00A95C; --orange:#FF6B2C;
  --paper:#F5F0E4; --black:#141210;

  --stock:#F5F0E4;      /* the sheet */
  --on-stock:#141210;   /* type on the sheet */
  --muted:#5A544A;      /* secondary type on the sheet — 6.4:1 on newsprint */
  --rule:#141210;       /* every printed rule */
  --rev:#141210;        /* reversed block */
  --on-rev:#F5F0E4;
  --desk:#3A3632;       /* the table the sheet sits on */
  --ts:1;               /* text scale */
  --regx:-4px;          /* registration offset, follows writing direction */
  --regsx:-8px;
}
html[dir="ltr"]{ --regx:4px; --regsx:8px; }
html[data-theme="dark"]{
  --stock:#141210; --on-stock:#F5F0E4; --muted:#A79E8C; --rule:#F5F0E4;
  --rev:#F5F0E4; --on-rev:#141210; --desk:#0A0908;
}

html{ font-size: calc(16px * var(--ts)); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--desk); color:var(--on-stock);
  font-family:"Alef","Heebo",system-ui,sans-serif; font-size:1rem; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--pink); color:#141210; }
:focus-visible{ outline:3px solid var(--focus,#141210); outline-offset:2px; }
*{ scrollbar-width:thin; scrollbar-color:var(--rule) var(--stock); }
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:var(--stock); }
*::-webkit-scrollbar-thumb{ background:var(--rule); border:2px solid var(--stock); }
input,textarea,select{ caret-color:var(--pink); font:inherit; color:inherit; }
button{ font:inherit; color:inherit; }
img,svg{ display:block; max-width:100%; }

/* paper grain — material, on every sheet */
body::after{
  content:""; position:fixed; inset:0; z-index:90; pointer-events:none;
  opacity:.085; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  background-size:180px 180px;
}
html[data-theme="dark"] body::after{ mix-blend-mode:screen; opacity:.13; }

/* ============ INK SURFACES ============ */
.ink-pink   { --bg:var(--pink);   --fg:#141210; --focus:#141210; }
.ink-blue   { --bg:var(--blue);   --fg:#F5F0E4; --focus:#FFD400; }
.ink-yellow { --bg:var(--yellow); --fg:#141210; --focus:#141210; }
.ink-green  { --bg:var(--green);  --fg:#141210; --focus:#141210; }
.ink-orange { --bg:var(--orange); --fg:#141210; --focus:#141210; }
.ink-black  { --bg:var(--rev);    --fg:var(--on-rev); --focus:#FFD400; }
.ink-paper  { --bg:var(--stock);  --fg:var(--on-stock); --focus:var(--rule); }
.ink-pink,.ink-blue,.ink-yellow,.ink-green,.ink-orange,.ink-black,.ink-paper{
  background:var(--bg); color:var(--fg);
}

/* halftone dot field, fading — a printed gradient */
.halftone{ position:relative; isolation:isolate; }
.halftone::after{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
  background-image:radial-gradient(var(--dot,rgba(20,18,16,.55)) 1.15px, transparent 1.25px);
  background-size:6px 6px;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.95), transparent 82%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.95), transparent 82%);
}
.halftone > *{ position:relative; z-index:2; }
.halftone-up::after{
  -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,.95), transparent 80%);
  mask-image:linear-gradient(to top, rgba(0,0,0,.95), transparent 80%);
}
.ink-blue{ --dot:rgba(245,240,228,.5); }
.ink-black{ --dot:color-mix(in srgb, var(--on-rev) 45%, transparent); }

/* ============ LAYOUT ============ */
.sheet{
  max-width:430px; margin-inline:auto; min-height:100dvh;
  background:var(--stock); position:relative; overflow-x:clip;
  border-inline:3px solid var(--rule);
}
#view{ display:block; }
.pad{ padding-inline:16px; }
.screen{ padding-block-end:104px; }
.screen.no-nav{ padding-block-end:0; }

/* ============ TYPE ============ */
.display{
  font-family:"Heebo",sans-serif; font-weight:900; letter-spacing:-.045em;
  line-height:.88; margin:0; text-wrap:balance;
}
.display .ln{ display:block; }
.reg{ text-shadow: 2px 2px 0 var(--regink, var(--blue)); }
.reg-2{ text-shadow: 2px 2px 0 var(--regink, var(--pink)); }
h1.poster{ font-size:3.5rem; }
h2.sect{
  font-family:"Heebo",sans-serif; font-weight:900; letter-spacing:-.045em;
  font-size:1.75rem; line-height:.95; margin:0;
}
.sect-wrap{ margin-block-start:36px; margin-block-end:12px; }
.lede{ font-size:1.0625rem; line-height:1.45; margin:0; font-weight:700; }
.small{ font-size:.8125rem; line-height:1.4; }
.muted{ color:var(--muted); }

/* ============ CONTROLS ============ */
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  inline-size:100%; min-block-size:54px; padding-inline:18px;
  border:3px solid var(--rule); border-radius:0; cursor:pointer;
  font-family:"Heebo",sans-serif; font-weight:900; font-size:1.0625rem; letter-spacing:-.04em;
  box-shadow: var(--regx) 4px 0 var(--reg, var(--rule));
  transition: transform .12s cubic-bezier(.16,1,.3,1), box-shadow .12s cubic-bezier(.16,1,.3,1);
  text-decoration:none; text-align:center;
}
.btn:hover{ transform:translate(calc(var(--regx) * .35), 1.4px); box-shadow: calc(var(--regx) * .55) 2px 0 var(--reg, var(--rule)); }
.btn:active{ transform:translate(var(--regx), 4px); box-shadow: 0 0 0 var(--reg, var(--rule)); }
.btn[disabled]{ cursor:not-allowed; opacity:1; background:var(--stock); color:var(--muted);
  border-style:dashed; box-shadow:none; transform:none; }
.btn-quiet{
  background:transparent; color:var(--on-stock); border:3px solid var(--rule);
  box-shadow:none; min-block-size:48px; font-size:.9375rem;
}
.btn-quiet:hover{ background:var(--rev); color:var(--on-rev); transform:none; box-shadow:none; }
.btn-bare{
  background:none; border:0; padding:6px 2px; cursor:pointer;
  font-weight:700; font-size:.9375rem; text-decoration:underline;
  text-decoration-thickness:2px; text-underline-offset:4px;
}
.btn-bare:hover{ background:var(--yellow); color:#141210; }

.field{ display:block; margin-block-start:14px; }
.field > .lab{
  display:block; font-family:"Heebo",sans-serif; font-weight:900; font-size:.8125rem;
  letter-spacing:.02em; margin-block-end:6px;
}
.inp{
  inline-size:100%; min-block-size:52px; padding:10px 14px;
  background:var(--stock); color:var(--on-stock);
  border:3px solid var(--rule); border-radius:0;
  font-family:"Alef",sans-serif; font-size:1rem;
}
.inp::placeholder{ color:var(--muted); opacity:1; }
select.inp{ appearance:none; background-image:none; font-weight:700; padding-inline-end:38px; }
.selwrap{ position:relative; }
.selwrap .caret{ position:absolute; inset-inline-end:12px; inset-block-start:50%; transform:translateY(-50%); pointer-events:none; }

/* chips — ink blocks */
.chiprow{
  display:flex; gap:8px; overflow-x:auto; padding-block:4px 10px;
  scrollbar-width:none; -ms-overflow-style:none;
}
.chiprow::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; cursor:pointer; border:3px solid var(--rule); border-radius:0;
  background:var(--stock); color:var(--on-stock);
  font-family:"Heebo",sans-serif; font-weight:900; font-size:.875rem; letter-spacing:-.03em;
  padding:9px 14px; min-block-size:42px; white-space:nowrap;
  transition:transform .12s cubic-bezier(.16,1,.3,1);
}
.chip:hover{ transform:translateY(-2px); }
.chip[aria-pressed="true"]{ background:var(--bg,var(--rev)); color:var(--fg,var(--on-rev));
  box-shadow: var(--regx) 3px 0 var(--rule); }
.chipwrap{ display:flex; flex-wrap:wrap; gap:8px; }
.chipwrap .chip{ flex:0 1 auto; }

/* ============ STAMPS ============ */
.stamps{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.stamp{
  font-family:"Heebo",sans-serif; font-weight:900; font-size:.6875rem; letter-spacing:.04em;
  padding:4px 8px; border:2.5px solid currentColor; text-transform:none; line-height:1.1;
}
.stamp-solid{ border-color:var(--rule); background:var(--rule); color:var(--stock); }
.stamp-full{
  color:#141210; background:var(--yellow); border-color:#141210;
  transform:rotate(-6deg); font-size:.9375rem; padding:5px 12px;
}
.datestamp{
  font-family:"Heebo",sans-serif; font-weight:900; line-height:.92; text-align:center;
  border:3px solid #141210; background:var(--yellow); color:#141210;
  padding:7px 9px 6px; transform:rotate(-4deg); min-inline-size:56px;
}
.datestamp .d{ display:block; font-size:1.5rem; letter-spacing:-.05em; }
.datestamp .m{ display:block; font-size:.6875rem; letter-spacing:.03em; }

/* ============ FEED ============ */
.feed{ display:grid; grid-template-columns:1fr 1fr; gap:16px 12px; padding-block-start:6px; }
.card{
  position:relative; border:3px solid var(--rule); border-radius:0;
  transform:rotate(var(--rot,0deg));
  box-shadow: var(--regx) 4px 0 var(--reg,var(--rule));
}
.card.span{ grid-column:1 / -1; }
.card-open{
  display:block; inline-size:100%; text-align:start; background:none; border:0;
  padding:0; cursor:pointer; color:inherit;
}
.card-open:focus-visible{ outline:3px solid var(--focus,#141210); outline-offset:-6px; }
.art{ position:relative; overflow:hidden; border-block-end:3px solid var(--rule); }
.art svg{ inline-size:100%; block-size:100%; }
.art.a43{ aspect-ratio:4/3; }
.art.a11{ aspect-ratio:1/1; }
.card-body{ padding:12px 13px 13px; }
.card-t{
  font-family:"Heebo",sans-serif; font-weight:900; letter-spacing:-.045em; line-height:.98;
  margin:8px 0 0; font-size:1.375rem; text-wrap:balance;
}
.card.duo .card-t{ font-size:1rem; line-height:1.02; }
.card.flat .card-t{ font-size:1.875rem; }
.card-s{ margin:8px 0 0; font-size:.875rem; line-height:1.4; }
.card-meta{
  margin-block-start:10px; padding-block-start:8px; border-block-start:2.5px solid currentColor;
  font-size:.75rem; font-weight:700; display:flex; gap:8px; flex-wrap:wrap;
}
.card.wide .row{ display:flex; align-items:stretch; }
.card.wide .art{ flex:0 0 38%; border-block-end:0; border-inline-end:3px solid var(--rule); }
.card.wide .card-body{ flex:1 1 auto; min-inline-size:0; }
.card .pin{
  position:absolute; z-index:4; inset-block-start:-10px; inset-inline-end:-10px;
  inline-size:44px; block-size:44px; display:grid; place-items:center; cursor:pointer;
  border:3px solid var(--rule); border-radius:50%; background:var(--stock); color:var(--on-stock);
  transition:transform .14s cubic-bezier(.16,1,.3,1);
}
.card .pin:hover{ transform:rotate(-14deg) scale(1.06); }
.card .pin[aria-pressed="true"]{ background:var(--pink); color:#141210; }

/* ============ DETAIL ============ */
.topbar{
  position:sticky; inset-block-start:0; z-index:20;
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  background:var(--stock); border-block-end:3px solid var(--rule);
}
.iconbtn{
  inline-size:44px; block-size:44px; display:grid; place-items:center; cursor:pointer;
  border:3px solid var(--rule); background:var(--stock); color:var(--on-stock); border-radius:0;
}
.iconbtn:hover{ background:var(--rev); color:var(--on-rev); }
.iconbtn[aria-pressed="true"]{ background:var(--pink); color:#141210; }
.topbar .tb-t{ font-family:"Heebo",sans-serif; font-weight:900; font-size:1rem; letter-spacing:-.04em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto; }

.poster-head{ padding:20px 16px 24px; border-block-end:3px solid var(--rule); }
.spec{ border-block-start:3px solid var(--rule); }
.spec-row{ display:flex; gap:14px; padding:13px 16px; border-block-end:2.5px solid var(--rule); }
.spec-row .k{
  flex:0 0 92px; font-family:"Heebo",sans-serif; font-weight:900; font-size:.8125rem;
  letter-spacing:.01em; padding-block-start:2px;
}
.spec-row .v{ flex:1 1 auto; font-size:.9375rem; font-weight:700; line-height:1.4; }
.ctabar{
  position:fixed; inset-inline:0; inset-block-end:0; z-index:30;
  max-width:430px; margin-inline:auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--stock); border-block-start:3px solid var(--rule);
}

/* ============ NAV ============ */
.nav{
  position:fixed; inset-inline:0; inset-block-end:0; z-index:40;
  max-width:430px; margin-inline:auto;
  display:grid; background:var(--stock);
  border-block-start:3px solid var(--rule);
  border-inline:3px solid var(--rule);
  padding-block-end:env(safe-area-inset-bottom);
}
.nav-btn{
  display:grid; justify-items:center; gap:3px; padding:9px 4px 10px;
  background:none; border:0; cursor:pointer; color:var(--on-stock);
  font-family:"Heebo",sans-serif; font-weight:900; font-size:.6875rem; letter-spacing:-.02em;
  border-inline-start:3px solid var(--rule);
}
.nav-btn:first-child{ border-inline-start:0; }
.nav-btn[aria-current="page"]{ background:var(--blue); color:#F5F0E4; --focus:#FFD400; }
.nav-btn:not([aria-current="page"]):hover{ background:var(--yellow); color:#141210; }

/* ============ MISC ============ */
.rule{ block-size:3px; background:var(--rule); border:0; margin:0; }
.steprule{ display:flex; gap:4px; margin-block-start:14px; }
.steprule i{ flex:1 1 0; block-size:8px; border:2.5px solid var(--rule); background:transparent; }
.steprule i.on{ background:var(--rule); }
.notice{
  border:3px dashed var(--rule); padding:12px 14px; font-size:.875rem; font-weight:700; line-height:1.45;
}
.err{
  border:3px solid #141210; background:var(--yellow); color:#141210;
  padding:11px 13px; font-size:.875rem; font-weight:700; line-height:1.4; margin-block-start:14px;
}
.empty{ padding:40px 16px 24px; text-align:center; }
.mono-none{ font-weight:700; }
.avatar{
  inline-size:96px; block-size:96px; border:3px solid var(--rule); flex:0 0 auto;
  box-shadow: var(--regx) 4px 0 var(--pink); overflow:hidden;
}
.langgrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.seg{ display:flex; gap:8px; }
.seg .chip{ flex:1 1 0; text-align:center; justify-content:center; }
.stack-gap > * + *{ margin-block-start:10px; }

/* ============ THE ONE MOMENT: press registration settles ============ */
@keyframes settle{
  from{ transform:translate3d(var(--regsx), 10px, 0) rotate(calc(var(--rot,0deg) * 2.6)); }
  to  { transform:translate3d(0,0,0) rotate(var(--rot,0deg)); }
}
@keyframes settleReg{
  from{ box-shadow: calc(var(--regx) * 2.6) 11px 0 var(--reg,var(--rule)); }
  to  { box-shadow: var(--regx) 4px 0 var(--reg,var(--rule)); }
}
.settling{
  animation: settle .62s cubic-bezier(.16,1,.3,1) both;
  animation-delay: calc(var(--i,0) * 42ms);
}
.settling.has-reg{
  animation: settle .62s cubic-bezier(.16,1,.3,1) both,
             settleReg .62s cubic-bezier(.16,1,.3,1) both;
  animation-delay: calc(var(--i,0) * 42ms);
}
@media (prefers-reduced-motion: reduce){
  .settling, .settling.has-reg{ animation:none !important; }
  .btn, .chip, .card .pin{ transition:none !important; }
}
@media (min-width:900px){
  .sheet{ box-shadow: 14px 14px 0 rgba(0,0,0,.35); }
}
</style>

<div class="sheet">
  <main id="view"></main>
  <nav class="nav" id="nav" hidden aria-label="ניווט ראשי"></nav>
</div>

<script>

    }

  } else if (a.schedule_type === "series"){
    if (a.sessions_count) parts.push(tf("sessions", { n: a.sessions_count }));

      parts.push(tf("date_range", { a: fmtDate(a.start_date), b: fmtDate(a.end_date) }));

/* the printed composition — deterministic per activity id             */
/* ------------------------------------------------------------------ */
function hashOf(str){
  var h = 2166136261;
  for (var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function makeRng(seed){
  var s = seed >>> 0 || 1;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
function n2(v){ return Math.round(v * 100) / 100; }

function motif(kind, R){
  var s = "", i;
  if (kind === "rings"){
    for (i=0;i<4;i++) s += '<circle cx="'+n2(6+R()*88)+'" cy="'+n2(6+R()*88)+'" r="'+n2(13+R()*26)+
      '" fill="none" stroke="__C__" stroke-width="'+n2(6+R()*7)+'"/>';
  } else if (kind === "grid"){
    for (i=0;i<9;i++){
      var x = (i%3)*33 + 4 + R()*5, y = Math.floor(i/3)*33 + 4 + R()*5;
      s += '<rect x="'+n2(x)+'" y="'+n2(y)+'" width="'+n2(14+R()*11)+'" height="'+n2(14+R()*11)+
        '" fill="'+(R()>.45 ? '__C__' : 'none')+'" stroke="__C__" stroke-width="4.5"/>';
    }
  } else if (kind === "shards"){
    for (i=0;i<5;i++){
      var ax=R()*100, ay=R()*100;
      s += '<path d="M'+n2(ax)+' '+n2(ay)+' L'+n2(ax+16+R()*34)+' '+n2(ay+6+R()*22)+' L'+n2(ax-8+R()*26)+' '+n2(ay+26+R()*36)+' Z" fill="__C__"/>';
    }
    s += '<circle cx="'+n2(20+R()*60)+'" cy="'+n2(20+R()*60)+'" r="'+n2(16+R()*14)+'" fill="none" stroke="__C__" stroke-width="6"/>';
  } else if (kind === "waves"){
    for (i=0;i<5;i++){
      var y0 = 10 + i*19 + R()*6;
      s += '<path d="M-6 '+n2(y0)+' q 14 -'+n2(8+R()*12)+' 28 0 t 28 0 t 28 0 t 28 0" fill="none" stroke="__C__" stroke-width="'+n2(4+R()*5)+'"/>';
    }
  } else if (kind === "burst"){
    var cx = 30 + R()*40, cy = 30 + R()*40;
    for (i=0;i<12;i++){
      var a1 = (i/12)*Math.PI*2, a2 = a1 + 0.16;
      s += '<path d="M'+n2(cx)+' '+n2(cy)+' L'+n2(cx+Math.cos(a1)*84)+' '+n2(cy+Math.sin(a1)*84)+
        ' L'+n2(cx+Math.cos(a2)*84)+' '+n2(cy+Math.sin(a2)*84)+' Z" fill="__C__"/>';
    }
    s += '<circle cx="'+n2(cx)+'" cy="'+n2(cy)+'" r="'+n2(11+R()*8)+'" fill="none" stroke="__C__" stroke-width="6"/>';
  } else if (kind === "peaks"){
    for (i=0;i<3;i++){
      var base = 104 - i*16, px = R()*40;
      s += '<path d="M'+n2(px-30)+' '+n2(base)+' L'+n2(px+18+R()*14)+' '+n2(base-42-R()*20)+' L'+n2(px+62)+' '+n2(base)+
        ' L'+n2(px+96)+' '+n2(base-30)+' L'+n2(px+130)+' '+n2(base)+' Z" fill="'+(i===1 ? 'none' : '__C__')+'" stroke="__C__" stroke-width="4.5"/>';
    }
    s += '<circle cx="'+n2(66+R()*22)+'" cy="'+n2(16+R()*12)+'" r="'+n2(9+R()*6)+'" fill="__C__"/>';
  } else if (kind === "links"){
    for (i=0;i<5;i++){
      s += '<rect x="'+n2(4+R()*62)+'" y="'+n2(4+R()*62)+'" width="'+n2(26+R()*16)+'" height="'+n2(26+R()*16)+
        '" rx="12" fill="none" stroke="__C__" stroke-width="'+n2(6+R()*4)+'"/>';
    }
  } else if (kind === "chevrons"){
    for (i=0;i<6;i++){
      var yy = 2 + i*17 + R()*4;
      s += '<path d="M-4 '+n2(yy)+' L'+n2(48+R()*10)+' '+n2(yy+13)+' L104 '+n2(yy)+'" fill="none" stroke="__C__" stroke-width="'+n2(5+R()*5)+'"/>';
    }
  } else { /* pixels */
    for (i=0;i<16;i++){
      var gx = Math.floor(R()*6)*17 - 4, gy = Math.floor(R()*6)*17 - 4;
      s += '<rect x="'+n2(gx)+'" y="'+n2(gy)+'" width="17" height="17" fill="__C__"/>';
    }
  }
  return s;
}

var uid = 0;
function posterSVG(act){

  var knockX = n2(R()*58), knockY = n2(R()*58), knockW = n2(22+R()*26), knockH = n2(16+R()*24);
  var knockRound = R() > .5;

  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="presentation" focusable="false">' +
    '<defs>' +

    '<rect width="100" height="100" fill="url(#ht'+u+')" mask="url(#mk'+u+')" style="mix-blend-mode:multiply"/>' +
    (knockRound
      ? '<circle cx="'+n2(knockX+knockW/2)+'" cy="'+n2(knockY+knockH/2)+'" r="'+n2(knockW/2)+'" fill="#F5F0E4"/>'
      : '<rect x="'+knockX+'" y="'+knockY+'" width="'+knockW+'" height="'+knockH+'" fill="#F5F0E4"/>') +
    '<g transform="translate(2.4,2.8)" style="mix-blend-mode:multiply">' + tmpl.split("__C__").join(c2) + '</g>' +
    '<g style="mix-blend-mode:multiply">' + tmpl.split("__C__").join("#141210") + '</g>' +
  '</svg>';
}

function monogramSVG(name){
  var ch = (String(name||"?").trim()[0] || "?");
  var seed = hashOf(String(name||"?"));
  var R = makeRng(seed);

  var c1 = INK[keys[Math.floor(R()*keys.length)]];
  var c2 = INK[keys[Math.floor(R()*keys.length)]];
  if (c1 === c2) c2 = INK.blue === c1 ? INK.pink : INK.blue;
  var u = "m" + (++uid);

    '<defs><pattern id="hm'+u+'" width="5" height="5" patternUnits="userSpaceOnUse">' +

function matchQuery(a, q){
  if (!q) return true;
  q = q.trim().toLowerCase();
  if (!q) return true;
  var hay = [a.title, a.short_description, a.description, a.organization_name,
             a.neighborhood, a.location_name].concat(a.topics || []).join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}
function homeList(){
  return ACTS.filter(function(a){
    if (S.ui.cat !== "all" && a.category !== S.ui.cat) return false;
    if (S.ui.topic !== "all" && (a.topics || []).indexOf(S.ui.topic) === -1) return false;
    return matchQuery(a, S.ui.q);
  });
}
function topicsForCat(cat){
  var seen = {}, out = [];
  ACTS.forEach(function(a){
    if (cat !== "all" && a.category !== cat) return;
    (a.topics||[]).forEach(function(x){ if (!seen[x]){ seen[x]=1; out.push(x); } });
  });
  return out;
}
function favList(){
  var order = {};
  S.favs.forEach(function(f, i){ order[f.id] = f.at || i; });
  var list = S.favs.map(function(f){ return byId(f.id); }).filter(Boolean);
  list = list.filter(function(a){
    if (S.ui.favCat !== "all" && a.category !== S.ui.favCat) return false;
    return matchQuery(a, S.ui.favQ);
  });
  var s = S.ui.favSort;
  list.sort(function(x, y){
    if (s === "soon"){
      var dx = parseDate(x.start_date), dy = parseDate(y.start_date);
      var vx = dx ? dx.getTime() : Infinity, vy = dy ? dy.getTime() : Infinity;
      return vx - vy;
    }
    if (s === "added") return (order[y.id]||0) - (order[x.id]||0);
    if (s === "cat"){
      var c = CAT_ORDER.indexOf(x.category) - CAT_ORDER.indexOf(y.category);
      return c !== 0 ? c : x.title.localeCompare(y.title, "he");
    }
    return x.title.localeCompare(y.title, "he");
  });
  return list;
}

var OB_STEPS = ["name","age","grade","area","topics","kinds"];

function obScreen(){
  if (!S.ui.obDraft) S.ui.obDraft = { name:"", age:"", grade:"", area:"", topics:[], kinds:[] };
  var i = S.ui.obStep, key = OB_STEPS[i], d = S.ui.obDraft;
  var body = "";

  if (key === "name"){
    body = '<label class="field"><span class="lab">' + esc(t("p_name")) + '</span>' +
      '<input class="inp" id="ob-name" type="text" value="' + esc(d.name || "") + '" placeholder="' + esc(t("ph_name")) + '"></label>';
  } else if (key === "age"){
    body = '<div class="chipwrap">' + [12,13,14,15,16,17,18].map(function(n){
      return '<button class="chip ink-yellow" type="button" data-act="ob-age" data-v="' + n + '" aria-pressed="' + (d.age === n) + '">' + n + '</button>';
    }).join("") + '</div>';
  } else if (key === "grade"){
    body = '<div class="chipwrap">' + GRADES.map(function(g){
      return '<button class="chip ink-orange" type="button" data-act="ob-grade" data-v="' + esc(g) + '" aria-pressed="' + (d.grade === g) + '">' + esc(g) + '</button>';
    }).join("") + '</div>';
  } else if (key === "area"){
    body = '<div class="chipwrap">' +
      '<button class="chip ink-black" type="button" data-act="ob-area" data-v="" aria-pressed="' + (!d.area) + '">' + esc(t("any_area")) + '</button>' +
      ALL_AREAS.map(function(a){
        return '<button class="chip ink-green" type="button" data-act="ob-area" data-v="' + esc(a) + '" aria-pressed="' + (d.area === a) + '">' + esc(a) + '</button>';
      }).join("") + '</div>';
  } else if (key === "topics"){
    var sel = d.topics || [];
    body = '<div class="chipwrap">' + ALL_TOPICS.map(function(x, n){
      var ink = ["ink-pink","ink-blue","ink-yellow","ink-green","ink-orange"][n % 5];
      return '<button class="chip ' + ink + '" type="button" data-act="ob-topic" data-v="' + esc(x) + '" aria-pressed="' +
             (sel.indexOf(x) !== -1) + '">' + esc(x) + '</button>';
    }).join("") + '</div>';
  } else {
    var ks = d.kinds || [];
    body = '<div class="stack-gap">' +
      ['activity','event'].map(function(k, n){
        var on = ks.indexOf(k) !== -1;
        return '<button class="btn ' + (n === 0 ? "ink-blue" : "ink-pink") + '" type="button" data-act="ob-kind" data-v="' + k +
          '" aria-pressed="' + on + '" style="--reg:var(--' + (n === 0 ? "yellow" : "blue") + ');justify-content:space-between">' +
          '<span>' + esc(t("k_" + k)) + '</span>' + (on ? ICON.check : "") + '</button>';
      }).join("") + '</div>';
  }

  var steps = "";
  for (var z=0; z<OB_STEPS.length; z++) steps += '<i class="' + (z <= i ? "on" : "") + '"></i>';

  return '<div class="screen no-nav">' +
    '<header class="ink-blue halftone" style="padding:26px 16px 20px;border-block-end:3px solid var(--rule)" data-settle>' +
      '<h1 class="display" style="font-size:2.25rem"><span class="ln">' + esc(t("ob_head")) + '</span></h1>' +
      '<p class="small" style="margin:10px 0 0;font-weight:700">' + esc(t("ob_sub")) + '</p>' +

      '<p class="small" style="margin:8px 0 0;font-weight:700">' + esc(tf("ob_step", { a: i+1, b: OB_STEPS.length })) + '</p>' +
    '</header>' +
    '<div class="pad" style="padding-block:8px 30px" data-settle>' +
      '<div class="sect-wrap"><h2 class="sect">' + esc(t("q_" + key)) + '</h2></div>' +
      '<p class="small muted" style="margin:0 0 16px">' + esc(t("h_" + key)) + '</p>' +
      body +
      '<div style="margin-block-start:32px" class="stack-gap">' +
        '<button class="btn ink-yellow" type="button" data-act="ob-next" style="--reg:var(--blue)">' +
          esc(i === OB_STEPS.length - 1 ? t("ob_done") : t("ob_next")) + '</button>' +
        '<div style="display:flex;gap:10px">' +
          (i > 0 ? '<button class="btn btn-quiet" type="button" data-act="ob-prev">' + esc(t("ob_prev")) + '</button>' : "") +
          '<button class="btn btn-quiet" type="button" data-act="ob-skip">' + esc(t("ob_skip")) + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

    '</div>';
  var tsSeg = '<div class="seg">' + [["small","s_small"],["med","s_med"],["large","s_large"]].map(function(p){
      return '<button class="chip ink-orange" type="button" data-act="set-ts" data-v="' + p[0] + '" aria-pressed="' + (st.ts === p[0]) + '">' + esc(t(p[1])) + '</button>';
    }).join("") + '</div>';
  var langGrid = '<div class="langgrid">' + LANGS.map(function(l, n){
      var ink = ["ink-pink","ink-blue","ink-green","ink-yellow"][n % 4];
      return '<button class="chip ' + ink + '" type="button" data-act="set-lang" data-v="' + l[0] +
             '" aria-pressed="' + (st.lang === l[0]) + '" style="text-align:center;justify-content:center">' + esc(l[1]) + '</button>';
    }).join("") + '</div>';

  var acct = isGuest()
    ? '<div class="notice">' + esc(t("s_guest_note")) + '</div>' +
      '<div class="stack-gap" style="margin-block-start:12px">' +
        '<button class="btn ink-pink" type="button" data-act="guest-signup" style="--reg:var(--blue)">' + esc(t("signup_t")) + '</button>' +
        '<button class="btn btn-quiet" type="button" data-act="signout">' + esc(t("s_exitguest")) + '</button>' +
      '</div>'
    : '<p class="small" style="margin:0 0 12px;font-weight:700">' + esc(tf("signed_as", { n: (S.auth && S.auth.username) || "" })) + '</p>' +
      '<button class="btn btn-quiet" type="button" data-act="signout">' + esc(t("s_signout")) + '</button>';

  return '<div class="screen">' +
    '<header class="ink-black halftone" style="padding:26px 16px 22px;border-block-end:3px solid var(--rule)" data-settle>' +
      '<h1 class="display reg" style="font-size:2.5rem;--regink:var(--pink)"><span class="ln">' + esc(t("s_title")) + '</span></h1>' +
    '</header>' +
    '<div class="pad" style="padding-block-end:20px">' +
      '<div class="sect-wrap"><h2 class="sect">' + esc(t("s_theme")) + '</h2></div>' + themeSeg +
      '<div class="sect-wrap"><h2 class="sect">' + esc(t("s_text")) + '</h2></div>' + tsSeg +
      '<div class="sect-wrap"><h2 class="sect">' + esc(t("s_lang")) + '</h2></div>' + langGrid +
      '<p class="small muted" style="margin:10px 0 0">' + esc(t("s_lang_note")) + '</p>' +
      '<div class="sect-wrap"><h2 class="sect">' + esc(isGuest() ? t("s_guest") : t("s_acct")) + '</h2></div>' + acct +
    '</div>' +
  '</div>';
}

/* ------------------------------------------------------------------ */
/* nav + render                                                        */
/* ------------------------------------------------------------------ */
function navItems(){
  if (isGuest()) return [["home", t("nav_home"), ICON.home], ["settings", t("nav_set"), ICON.sliders]];
  return [["home", t("nav_home"), ICON.home],
          ["favorites", t("nav_wall"), ICON.pin],
          ["profile", t("nav_profile"), ICON.user],
          ["settings", t("nav_set"), ICON.sliders]];
}
function renderNav(){
  var nav = document.getElementById("nav");
  var sc = S.ui.screen;
  var show = (sc === "home" || sc === "favorites" || sc === "profile" || sc === "settings");
  nav.hidden = !show;
  if (!show){ nav.innerHTML = ""; return; }
  var items = navItems();
  nav.style.gridTemplateColumns = "repeat(" + items.length + ", 1fr)";
  nav.innerHTML = items.map(function(it){
    return '<button class="nav-btn" type="button" data-act="go" data-screen="' + it[0] + '"' +
      (sc === it[0] ? ' aria-current="page"' : "") + '>' + it[2] + '<span>' + esc(it[1]) + '</span></button>';
  }).join("");
}

function settle(){
  if (REDUCED) return;
  var els = document.querySelectorAll("#view [data-settle]");
  for (var i=0;i<els.length;i++){
    var el = els[i];
    el.style.setProperty("--i", Math.min(i, 12));
    el.classList.remove("settling");
    void el.offsetWidth;
    el.classList.add("settling");
  }
}

function applyChrome(){
  var d = STRINGS[S.settings.lang] || STRINGS.he;
  document.documentElement.lang = S.settings.lang;
  document.documentElement.dir = d.dir;
  document.documentElement.setAttribute("data-theme", S.settings.theme);
  document.documentElement.style.setProperty("--ts", TS_MAP[S.settings.ts] || 1);
}

function render(keepScroll){
  applyChrome();
  var view = document.getElementById("view");
  var sc = S.ui.screen;
  var html =
    sc === "auth"      ? authScreen() :
    sc === "onboard"   ? obScreen() :
    sc === "home"      ? homeScreen() :
    sc === "detail"    ? detailScreen() :
    sc === "favorites" ? favScreen() :
    sc === "profile"   ? profileScreen() :
                         settingsScreen();
  view.innerHTML = html;
  renderNav();
  if (!keepScroll){ settle(); window.scrollTo(0, 0); }
}

function go(screen){
  S.ui.screen = screen;
  S.ui.err = "";
  render();
}

/* ------------------------------------------------------------------ */
/* interactions — one delegated handler                                */
/* ------------------------------------------------------------------ */
function refreshFeed(){
  var w = document.getElementById("feed-wrap");
  if (w){ w.innerHTML = feedHTML(); }
}
function refreshFavList(){
  var w = document.getElementById("fav-wrap");
  if (w){ w.innerHTML = favListHTML(); }
}
function syncPins(id){
  var on = isFav(id);
  var btns = document.querySelectorAll('[data-act="fav"][data-id="' + id + '"]');
  for (var i=0;i<btns.length;i++){
    btns[i].setAttribute("aria-pressed", String(on));
    btns[i].setAttribute("aria-label", on ? t("saved") : t("save"));
    btns[i].innerHTML = on ? ICON.pinfill : ICON.pin;
  }
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (el.tagName === "FORM" || el.tagName === "SELECT") return;

  /* ---- auth ---- */
  if (act === "auth-mode"){ S.ui.authMode = el.getAttribute("data-mode"); S.ui.err = ""; render(); return; }
  if (act === "guest"){
    S.auth = { mode:"guest" }; save("auth", S.auth);
    S.ui.screen = "home"; render(); return;
  }
  if (act === "guest-signup"){
    S.auth = null; save("auth", null);
    S.ui.authMode = "signup"; S.ui.err = ""; go("auth"); return;
  }
  if (act === "signout"){
    S.auth = null; save("auth", null);
    S.ui.authMode = "welcome"; S.ui.err = "";
    S.ui.q = ""; S.ui.cat = "all"; S.ui.topic = "all";
    go("auth"); return;
  }

  /* ---- onboarding ---- */
  if (act === "ob-age"){ S.ui.obDraft.age = +el.getAttribute("data-v"); render(true); return; }
  if (act === "ob-grade"){ S.ui.obDraft.grade = el.getAttribute("data-v"); render(true); return; }
  if (act === "ob-area"){ S.ui.obDraft.area = el.getAttribute("data-v") || ""; render(true); return; }
  if (act === "ob-topic"){
    var v = el.getAttribute("data-v");
    var arr = S.ui.obDraft.topics || [];
    S.ui.obDraft.topics = arr.indexOf(v) !== -1 ? arr.filter(function(x){ return x !== v; }) : arr.concat([v]);
    render(true); return;
  }
  if (act === "ob-kind"){
    var k = el.getAttribute("data-v");
    var ka = S.ui.obDraft.kinds || [];
    S.ui.obDraft.kinds = ka.indexOf(k) !== -1 ? ka.filter(function(x){ return x !== k; }) : ka.concat([k]);
    render(true); return;
  }
  if (act === "ob-next" || act === "ob-skip"){
    if (act === "ob-next"){
      var ni = document.getElementById("ob-name");
      if (ni) S.ui.obDraft.name = ni.value.trim();
    }
    if (S.ui.obStep < OB_STEPS.length - 1){ S.ui.obStep++; render(); }
    else {
      S.profile[userKey()] = Object.assign({}, S.profile[userKey()] || {}, S.ui.obDraft);
      save("profile", S.profile);
      go("home");
    }
    return;
  }
  if (act === "ob-prev"){
    var ni2 = document.getElementById("ob-name");
    if (ni2) S.ui.obDraft.name = ni2.value.trim();
    if (S.ui.obStep > 0) S.ui.obStep--;
    render(); return;
  }

  /* ---- browse ---- */
  if (act === "home-cat"){
    S.ui.cat = el.getAttribute("data-cat"); S.ui.topic = "all";
    var cr = document.getElementById("home-cats");
    if (cr) cr.innerHTML = catChips(S.ui.cat, "home-cat");
    var tw = document.getElementById("home-topics");
    if (tw) tw.innerHTML = homeTopicsHTML();
    refreshFeed(); return;
  }
  if (act === "home-topic"){
    S.ui.topic = el.getAttribute("data-v");
    var tw2 = document.getElementById("home-topics");
    if (tw2) tw2.innerHTML = homeTopicsHTML();
    refreshFeed(); return;
  }
  if (act === "home-clear"){
    S.ui.q = ""; S.ui.cat = "all"; S.ui.topic = "all"; render(); return;
  }
  if (act === "open"){
    S.ui.backTo = (S.ui.screen === "detail") ? (S.ui.backTo || "home") : S.ui.screen;
    S.ui.detailId = el.getAttribute("data-id");
    go("detail"); return;
  }
  if (act === "back"){ go(S.ui.backTo || "home"); return; }
  if (act === "go"){ go(el.getAttribute("data-screen")); return; }
  if (act === "fav"){
    var id = el.getAttribute("data-id");
    toggleFav(id);
    syncPins(id);
    if (S.ui.screen === "favorites") refreshFavList();
    return;
  }

  /* ---- favorites ---- */
  if (act === "fav-cat"){
    S.ui.favCat = el.getAttribute("data-cat");
    var fcr = el.parentElement;
    if (fcr) fcr.innerHTML = catChips(S.ui.favCat, "fav-cat");
    refreshFavList(); return;
  }
  if (act === "fav-clear"){ S.ui.favQ = ""; S.ui.favCat = "all"; render(); return; }

  /* ---- profile ---- */
  if (act === "profile-edit"){
    var p = prof();
    S.ui.profileDraft = {
      name: p.name || "", age: p.age || "", grade: p.grade || "", area: p.area || "",
      topics: (p.topics || []).slice(), kinds: (p.kinds || []).slice()
    };
    S.ui.profileEdit = true; render(); return;
  }
  if (act === "pe-topic"){
    var pv = el.getAttribute("data-v");
    var pt = S.ui.profileDraft.topics || [];
    S.ui.profileDraft.topics = pt.indexOf(pv) !== -1 ? pt.filter(function(x){ return x !== pv; }) : pt.concat([pv]);
    readProfileInputs();
    render(true); return;
  }
  if (act === "pe-kind"){
    var pk = el.getAttribute("data-v");
    var pks = S.ui.profileDraft.kinds || [];
    S.ui.profileDraft.kinds = pks.indexOf(pk) !== -1 ? pks.filter(function(x){ return x !== pk; }) : pks.concat([pk]);
    readProfileInputs();
    render(true); return;
  }
  if (act === "pe-save"){
    readProfileInputs();
    var d = S.ui.profileDraft;
    S.profile[userKey()] = Object.assign({}, S.profile[userKey()] || {}, {
      name: d.name, age: d.age ? +d.age : "", grade: d.grade, area: d.area,
      topics: d.topics, kinds: d.kinds
    });
    save("profile", S.profile);
    S.ui.profileEdit = false; render(); return;
  }
  if (act === "pe-cancel"){ S.ui.profileEdit = false; render(); return; }

  /* ---- settings ---- */
  if (act === "set-theme"){ S.settings.theme = el.getAttribute("data-v"); save("settings", S.settings); render(true); return; }
  if (act === "set-ts"){ S.settings.ts = el.getAttribute("data-v"); save("settings", S.settings); render(true); return; }
  if (act === "set-lang"){ S.settings.lang = el.getAttribute("data-v"); save("settings", S.settings); render(true); return; }
});

function readProfileInputs(){
  var d = S.ui.profileDraft; if (!d) return;
  var n = document.getElementById("pe-name"); if (n) d.name = n.value.trim();
  var a = document.getElementById("pe-age"); if (a) d.age = a.value;
  var g = document.getElementById("pe-grade"); if (g) d.grade = g.value;
  var ar = document.getElementById("pe-area"); if (ar) d.area = ar.value;
}

document.addEventListener("input", function(ev){
  var el = ev.target;
  if (el.id === "home-q"){ S.ui.q = el.value; refreshFeed(); return; }
  if (el.id === "fav-q"){ S.ui.favQ = el.value; refreshFavList(); return; }
});

document.addEventListener("change", function(ev){
  var el = ev.target;
  if (el.id === "fav-sort"){ S.ui.favSort = el.value; refreshFavList(); return; }
});

document.addEventListener("submit", function(ev){
  var f = ev.target;
  if (!f.matches || !f.matches('[data-act="auth-submit"]')) return;
  ev.preventDefault();
  var mode = f.getAttribute("data-mode");
  var u = (f.elements.username.value || "").trim();
  var pw = f.elements.password.value || "";

  if (!u){ S.ui.err = t("e_user_empty"); render(); return; }
  if (pw.length < 6){ S.ui.err = t("e_pass_short"); render(); return; }

  if (mode === "signup"){
    if (S.users[u]){ S.ui.err = t("e_taken"); render(); return; }
    S.users[u] = { pass: pw };
    save("users", S.users);
    S.auth = { mode:"user", username:u }; save("auth", S.auth);
    S.ui.err = "";
    S.ui.obDraft = { name:"", age:"", grade:"", area:"", topics:[], kinds:[] };
    S.ui.obStep = 0;
    go("onboard");
    return;
  }
  if (!S.users[u]){ S.ui.err = t("e_nouser"); render(); return; }
  if (S.users[u].pass !== pw){ S.ui.err = t("e_wrongpass"); render(); return; }
  S.auth = { mode:"user", username:u }; save("auth", S.auth);
  S.ui.err = "";
  go("home");
});

/* ------------------------------------------------------------------ */
/* boot                                                                */
/* ------------------------------------------------------------------ */
function boot(){
  if (!S.settings || !S.settings.lang) S.settings = { lang:"he", theme:"light", ts:"med" };
  if (!TS_MAP[S.settings.ts]) S.settings.ts = "med";
  if (S.settings.theme !== "dark") S.settings.theme = "light";
  if (!STRINGS[S.settings.lang]) S.settings.lang = "he";
  if (!Array.isArray(S.favs)) S.favs = [];
  if (!S.users || typeof S.users !== "object") S.users = {};
  if (!S.profile || typeof S.profile !== "object") S.profile = {};

  S.ui.screen = S.auth ? "home" : "auth";
  S.ui.backTo = "home";
  render();
}
boot();

})();
</script>
</body>
</html>
