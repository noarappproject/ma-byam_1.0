<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מה בי״ם — Neon Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --scale:1;
  --bg:#0D0D12; --surf:#16161E; --card:#1C1C26; --card2:#23232F;
  --lime:#C4F82A; --limeD:#A8DC12; --violet:#9B8AFB;
  --ink:#F4F4F7; --ink2:#A8AEBD; --ink3:#7C8296;
  --line:#2A2B38;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050508;color:var(--ink);
  font-family:"Heebo",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;min-height:100vh}
::selection{background:var(--lime);color:#0D0D12}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#33344A;border-radius:99px;border:2px solid var(--bg)}
:focus-visible{outline:2.5px solid var(--lime);outline-offset:2px;border-radius:8px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}

.app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;padding-bottom:112px}
.scr{display:none}.scr.on{display:block;animation:in .34s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pad{padding-inline:20px}
h1{font-size:calc(32px*var(--scale));font-weight:900;letter-spacing:-.038em;line-height:1.1;margin:0}
h2{font-size:calc(21px*var(--scale));font-weight:800;letter-spacing:-.03em;margin:0}
h3{font-size:calc(17px*var(--scale));font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.3}
p{margin:0;line-height:1.6}
.mut{color:var(--ink2);font-size:calc(14.5px*var(--scale))}
.sml{color:var(--ink3);font-size:calc(12.5px*var(--scale));font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:99px;
  background:var(--lime);color:#0D0D12;font-weight:800;font-size:calc(16px*var(--scale));letter-spacing:-.02em;
  transition:transform .18s cubic-bezier(.16,1,.3,1),filter .18s}
.btn:active{transform:scale(.975)}.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.34;pointer-events:none}
.btn.v{background:color-mix(in srgb,var(--violet) 22%,var(--card));color:var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;width:auto;padding-inline:22px;font-size:calc(14px*var(--scale))}
.lnk{color:var(--lime);font-weight:700;font-size:calc(14.5px*var(--scale));text-decoration:underline;text-underline-offset:3px}

.fld{margin-bottom:14px}
.fld label{display:block;font-size:calc(13px*var(--scale));font-weight:700;color:var(--ink2);margin-bottom:7px}
.inp{width:100%;min-height:54px;border-radius:15px;border:1px solid var(--line);background:var(--card);
  padding-inline:17px;font-size:calc(15.5px*var(--scale));font-weight:500;transition:border-color .18s}
.inp:focus{outline:none;border-color:var(--lime)}
.inp::placeholder{color:var(--ink3)}
.err{color:#FF7A6E;font-size:calc(13px*var(--scale));font-weight:600;min-height:1.2em;margin-top:6px}

.srch{position:relative;margin-bottom:15px}
.srch svg{position:absolute;inset-inline-start:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2.3;stroke-linecap:round}
.srch input{width:100%;min-height:50px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  padding-inline-start:47px;padding-inline-end:18px;font-size:calc(15px*var(--scale));font-weight:500}
.srch input:focus{outline:none;border-color:var(--lime)}
.srch input::placeholder{color:var(--ink3)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px;padding-bottom:3px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);
  font-size:calc(13.5px*var(--scale));font-weight:700;color:var(--ink2);white-space:nowrap;transition:background .16s,color .16s,border-color .16s}
.chip[aria-pressed="true"]{background:var(--lime);color:#0D0D12;border-color:var(--lime)}
.chips.t .chip{font-weight:600;font-size:calc(12.5px*var(--scale));padding:7px 13px}

.card{display:block;width:100%;text-align:start;border-radius:20px;overflow:hidden;position:relative;
  margin-bottom:15px;background:var(--card);
  box-shadow:0 10px 26px -12px rgba(0,0,0,.85);transition:transform .2s cubic-bezier(.16,1,.3,1)}
.card:active{transform:scale(.985)}
.cmedia{height:196px;position:relative}
.cmedia svg{position:absolute;inset:0;width:100%;height:100%}
.cscrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,14,.94) 8%,rgba(10,10,14,.5) 42%,rgba(10,10,14,.08) 78%)}
.cover{position:absolute;inset-block-end:0;inset-inline:0;padding:16px 17px}
.crow{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:calc(11.5px*var(--scale));font-weight:800;padding:4px 11px;border-radius:99px;color:#0D0D12}
.kind{font-size:calc(11.5px*var(--scale));font-weight:700;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.14);color:var(--ink)}
.cmeta{color:var(--ink2);font-size:calc(12.5px*var(--scale));font-weight:600;margin-top:6px}
.join{position:absolute;inset-block-start:13px;inset-inline-start:13px;background:var(--lime);color:#0D0D12;
  font-size:calc(12.5px*var(--scale));font-weight:800;padding:8px 15px;border-radius:99px}
.fav{position:absolute;inset-block-start:13px;inset-inline-end:13px;width:40px;height:40px;border-radius:50%;
  background:rgba(13,13,18,.72);backdrop-filter:blur(8px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);
  transition:transform .18s cubic-bezier(.16,1,.3,1)}
.fav:active{transform:scale(.88)}
.fav svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linejoin:round}
.fav[aria-pressed="true"] svg{fill:var(--lime);stroke:var(--lime)}

.rail{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding:0 20px 6px}
.rail::-webkit-scrollbar{display:none}
.rc{flex:none;width:210px;border-radius:18px;overflow:hidden;position:relative;background:var(--card);text-align:start}
.rc .cmedia{height:132px}
.rc h3{font-size:calc(14.5px*var(--scale))}

.nav{position:fixed;bottom:20px;inset-inline:0;margin:0 auto;width:min(370px,calc(100% - 44px));z-index:40;
  background:rgba(22,22,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:99px;padding:8px;display:flex;
  box-shadow:0 14px 40px -12px rgba(0,0,0,.9)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--ink3);font-size:calc(10px*var(--scale));font-weight:700;border-radius:99px}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--ink)}
.nav button[aria-current="true"] .np{background:var(--lime);color:#0D0D12}
.np{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .2s}

.sheet{position:fixed;inset:0;z-index:60;display:none}.sheet.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(3,3,6,.72);animation:fade .26s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{position:absolute;inset-inline:0;bottom:0;max-width:430px;margin:0 auto;height:95vh;overflow-y:auto;
  background:var(--bg);border-radius:24px 24px 0 0;animation:up .4s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.close{position:absolute;inset-block-start:16px;inset-inline-end:18px;width:40px;height:40px;border-radius:50%;
  background:rgba(13,13,18,.74);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;z-index:3}
.close svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round}
.stick{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 62%,transparent);padding:16px 20px 22px;display:flex;gap:12px;align-items:center}

.facts{background:var(--card);border-radius:18px;padding:4px 16px;margin:20px 0}
.fact{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.fact:last-child{border-bottom:0}
.fact>svg{width:19px;height:19px;stroke:var(--lime);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:1px}
.fact b{display:block;font-weight:700;font-size:calc(14.5px*var(--scale))}
.fact span{display:block;color:var(--ink2);font-size:calc(12.5px*var(--scale));margin-top:2px}

.rows{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--line);width:100%;text-align:start;font-size:calc(15px*var(--scale));font-weight:600}
.row:last-child{border-bottom:0}
.rv{color:var(--ink2);font-weight:600;font-size:calc(14px*var(--scale))}
.seg{display:flex;gap:5px;background:var(--surf);padding:4px;border-radius:13px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:calc(12.5px*var(--scale));font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--lime);color:#0D0D12}
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:calc(14.5px*var(--scale));font-weight:600;color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--lime);color:#0D0D12;border-color:var(--lime);font-weight:800}
.steps{display:flex;gap:5px;margin-bottom:22px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--lime)}
.empty{text-align:center;padding:56px 26px}
.ava{width:84px;height:84px;border-radius:50%;background:var(--lime);color:#0D0D12;display:grid;place-items:center;font-size:calc(32px*var(--scale));font-weight:900;margin:0 auto 12px}
.top{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 14px;gap:12px}
/* timeline */
.tl{border-inline-start:2px solid var(--line);margin-inline-start:52px;padding-inline-start:18px}
.tlday{margin-bottom:6px;position:relative}
.tlh{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;margin-inline-start:-70px}
.tlh b{width:52px;text-align:center;font-size:calc(20px*var(--scale));font-weight:900;line-height:1}
.tlh span{color:var(--ink3);font-size:calc(12px*var(--scale));font-weight:700}
.tli{background:var(--card);border-radius:14px;padding:13px 15px;margin-bottom:9px;display:flex;gap:12px;align-items:center;width:100%;text-align:start}
.tli .tt{font-size:calc(11.5px*var(--scale));font-weight:800;color:var(--lime);min-width:42px}
</style>
</head>
<body>
<!--
THESIS: Jerusalem's youth listings staged like a night bill — full-bleed artwork, one electric signal, a nav that floats over the show; refuses the pale utility list.
OWN-WORLD: Near-black #0D0D12 with an electric lime signal and violet second voice. Media-forward cards with scrim-set titles, a floating pill nav whose active tab is a lime disc, and generated stage-light artwork per category. Heebo 900 display.
STORY: A teen scans tonight's bill, opens a poster-scale detail, saves it, and leaves through the organizer's own link.
FIRST VIEWPORT: Greeting and location, search, lime category chips, a near-you rail, then the stacked bill.
FORM: Neon Night, direction 3 of 5, client-pinned reference.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<div class="app" id="app">

<section class="scr on" id="sAuth">
  <div class="pad" style="padding-top:70px">
    <h1 style="font-size:calc(46px*var(--scale));line-height:.98">מה<br>בי״ם</h1>
    <p class="mut" style="margin-top:18px;max-width:30ch">כל החוגים, הסדנאות והאירועים לנוער בירושלים. תמצא, תשמור, תגיע.</p>
    <div id="authIntro" style="margin-top:44px">
      <button class="btn" id="goSignup">בואו נתחיל</button>
      <p class="mut" style="text-align:center;margin-top:16px">כבר יש לך חשבון? <button class="lnk" id="goLogin">התחברות</button></p>
      <div style="height:1px;background:var(--line);margin:26px 0"></div>
      <button class="btn ghost" id="goGuest">המשך כאורח</button>
      <p class="sml" style="text-align:center;margin-top:10px">אפשר לעיין בלי חשבון. שמירה דורשת חשבון.</p>
    </div>
    <div id="authForm" style="margin-top:38px" hidden>
      <div class="fld"><label for="au">שם משתמש</label><input class="inp" id="au" autocomplete="username"></div>
      <div class="fld"><label for="ap">סיסמה</label><input class="inp" id="ap" type="password"></div>
      <p class="err" id="aerr"></p>
      <button class="btn" id="aSubmit">המשך</button>
      <p class="mut" style="text-align:center;margin-top:16px"><button class="lnk" id="aSwap"></button></p>
    </div>
  </div>
</section>

<section class="scr" id="sQuiz">
  <div class="pad" style="padding-top:34px">
    <div class="steps" id="qSteps"></div>
    <h2 id="qTtl"></h2><p class="mut" id="qSub" style="margin-top:8px"></p>
    <div id="qBody" style="margin-top:24px"></div>
    <div style="display:flex;gap:10px;margin-top:28px">
      <button class="btn ghost sm" id="qBack" style="flex:0 0 88px">הקודם</button>
      <button class="btn" id="qNext" style="flex:1">הבא</button></div>
    <p style="text-align:center;margin-top:14px"><button class="lnk" id="qSkip">דילוג על השאלון</button></p>
  </div>
</section>

<section class="scr" id="sHome">
  <div class="top">
    <div><p class="sml">ירושלים</p><h2 id="greet" style="margin-top:3px"></h2></div>
    <button class="btn ghost sm" id="guestOut" hidden>יציאה</button>
  </div>
  <div class="pad">
    <div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg><input id="q" type="search" placeholder="חיפוש חוג, ארגון או שכונה…"></div>
    <div class="chips" id="cats"></div>
    <div class="chips t" id="tops" style="margin-top:9px" hidden></div>
    <div id="railWrap" style="margin-top:24px"><h3 style="margin-bottom:12px">הכי קרוב</h3><div class="rail" id="rail"></div></div>
    <h3 id="feedH" style="margin:26px 0 13px">כל הפעילויות</h3>
  </div>
  <div class="pad" id="feed"></div>
</section>

<section class="scr" id="sCal">
  <div class="top"><div><p class="sml">לוח זמנים</p><h2 style="margin-top:3px">מה מתקרב</h2></div></div>
  <div class="pad" id="calBody"></div>
</section>

<section class="scr" id="sFav">
  <div class="top"><div><p class="sml" id="favCount"></p><h2 style="margin-top:3px">שמורים</h2></div></div>
  <div class="pad">
    <div id="favTools">
      <div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg><input id="fq" type="search" placeholder="חיפוש במועדפים…"></div>
      <div class="seg" id="fsortSeg"></div>
      <div class="chips" id="fcats" style="margin-top:13px"></div>
    </div>
  </div>
  <div class="pad" id="favFeed" style="margin-top:18px"></div>
</section>

<section class="scr" id="sProf">
  <div class="pad" style="padding-top:32px">
    <div class="ava" id="pAva"></div>
    <h2 style="text-align:center" id="pName"></h2>
    <p class="sml" style="text-align:center;margin-top:4px" id="pSub"></p>
    <div id="pBody" style="margin-top:26px"></div>
  </div>
</section>

<section class="scr" id="sSet">
  <div class="pad" style="padding-top:32px"><h2>הגדרות</h2><div id="setBody" style="margin-top:22px"></div></div>
</section>

<nav class="nav" id="nav" hidden></nav>
<div class="sheet" id="sheet"><div class="scrim" data-close></div><div class="panel" id="panel"></div></div>
</div>

<script src="activities.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const CAT={sport:{n:"ספורט",c:"#C4F82A"},tech:{n:"טכנולוגיה",c:"#5CC8FF"},art:{n:"אמנות",c:"#FF6FB5"},music:{n:"מוזיקה",c:"#9B8AFB"},stage:{n:"במה",c:"#FF8A4C"},nature:{n:"טבע",c:"#4BE0A8"},volunteer:{n:"התנדבות",c:"#3FD8D8"},leadership:{n:"מנהיגות",c:"#FFD84C"},gaming:{n:"גיימינג",c:"#C77DFF"}};
const MON=["ינו","פבר","מרץ","אפר","מאי","יוני","יולי","אוג","ספט","אוק","נוב","דצמ"];
const DAY=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const AREAS=["מרכז","צפון","דרום","מזרח","מערב"],GRADES=["ז׳","ח׳","ט׳","י׳","י״א","י״ב","לא לומד/ת"];
const TOPICS=["ספורט","אמנות ועיצוב","טכנולוגיה","מוזיקה","בישול","מדעים","קולנוע וצילום","יזמות","חברה וקהילה"];
const TYPES=["קורסים","הרצאות","חוגים","הופעות","התנדבות","תעסוקה"];
const A=window.ACTIVITIES||[];
const LS="mb_neon_";
const store={get(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}};
let S={screen:"sAuth",mode:"signup",guest:false,user:store.get("user",null),
  favs:new Set(store.get("favs",[])),favAt:store.get("favAt",{}),
  quiz:store.get("quiz",{name:"",age:"",grade:"",area:"",topics:[],types:[]}),
  set:store.get("set",{size:"medium"}),
  q:"",cat:null,top:null,fq:"",fcat:null,fsort:"soon",qStep:0,detail:null,pEdit:false};

const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)};
const cat=a=>CAT[a.category]||{n:a.category,c:"#9B8AFB"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtD=iso=>{const d=new Date(iso+"T00:00:00");return d.getDate()+" ב"+MON[d.getMonth()]+" "+d.getFullYear()};
const tRange=a=>{const s=(a.start_time||"").slice(0,5);return a.end_time?s+"–"+a.end_time.slice(0,5):"מ־"+s};
function whenT(a){
  if(a.schedule_type==="recurring"){const d=(a.recurrence_days||[]).map(x=>DAY[x]).join(", ");
    return{m:d?"כל יום "+d:"שבועי",s:tRange(a)+" · ללא תאריך סיום"}}
  const r=a.end_date&&a.end_date!==a.start_date?fmtD(a.start_date)+" – "+fmtD(a.end_date):fmtD(a.start_date);
  return{m:r,s:tRange(a)};
}
const ageT=a=>a.age_min==null&&a.age_max==null?"כל הגילאים":(a.age_min!=null&&a.age_max!=null?"גילאי "+a.age_min+"–"+a.age_max:(a.age_min!=null?"מגיל "+a.age_min:"עד גיל "+a.age_max));
function priceT(a){if(a.price==null)return"המחיר לא פורסם";if(a.price===0)return"חינם";
  const p={total:"לכל התקופה",per_session:"למפגש",monthly:"לחודש"}[a.price_period]||"";return a.price+" ₪"+(p?" · "+p:"")}
const cta=a=>a.registration_url?{h:a.registration_url,l:"להרשמה אצל המארגן"}:(a.source_url?{h:a.source_url,l:"לפרטים ולמקור"}:{h:null,l:"פרטי הרשמה יתפרסמו בקרוב"});
const ts=a=>{const t=new Date(a.start_date+"T"+(a.start_time||"00:00:00")).getTime();return isNaN(t)?Infinity:t};

function media(a){
  const h=hash(a.id),c=cat(a).c,g=[];
  for(let i=0;i<3;i++){
    const x=14+((h>>(i*3))&15)*7,w=20+((h>>i)&7)*7;
    g.push(`<polygon points="${x},-6 ${x+w},-6 ${x+w*1.9},104 ${x-w*.5},104" fill="${c}" opacity="${.3-i*.07}"/>`);
  }
  const pools=[];
  for(let i=0;i<2;i++){
    const cx=22+((h>>(i*4))&15)*6, cy=24+((h>>(i*5))&7)*8;
    pools.push(`<ellipse cx="${cx}" cy="${cy}" rx="${28+i*14}" ry="${20+i*10}" fill="${c}" opacity="${.34-i*.14}"/>`);
  }
  const bands=[];
  for(let i=0;i<5;i++)bands.push(`<rect x="0" y="${((h>>(i*2))&15)*6.4}" width="130" height="1.3" fill="${c}" opacity=".2"/>`);
  return `<svg viewBox="0 0 130 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="130" height="100" fill="#111119"/>${pools.join("")}${g.join("")}${bands.join("")}</svg>`;
}

function show(id){

  window.scrollTo(0,0);
  $("nav").hidden=!["sHome","sCal","sFav","sProf","sSet"].includes(id);
  if(id==="sHome")renderHome();if(id==="sCal")renderCal();if(id==="sFav")renderFav();
  if(id==="sProf")renderProf();if(id==="sSet")renderSet();
  paintNav();

function renderQuiz(){const q=QS[S.qStep];

$("qBody").onclick=e=>{
  const b=e.target.closest("button[data-age],button[data-grade],button[data-area],button[data-topic],button[data-type]");
  if(!b)return;const d=b.dataset;
  if(d.age)S.quiz.age=d.age;
  if(d.grade)S.quiz.grade=S.quiz.grade===d.grade?"":d.grade;
  if(d.area)S.quiz.area=S.quiz.area===d.area?"":d.area;
  if(d.topic){const i=S.quiz.topics.indexOf(d.topic);i<0?S.quiz.topics.push(d.topic):S.quiz.topics.splice(i,1)}
  if(d.type){const i=S.quiz.types.indexOf(d.type);i<0?S.quiz.types.push(d.type):S.quiz.types.splice(i,1)}
  save();renderQuiz()};

function renderFav(){
  const all=A.filter(a=>S.favs.has(a.id));
  $("favCount").textContent=all.length?all.length+" פעילויות":"מועדפים";
  $("favTools").hidden=!all.length;
  if(!all.length){$("favFeed").innerHTML=`<div class="empty"><h3>עדיין ריק</h3>
    <p class="mut" style="margin:8px 0 18px">לחץ על הכוכב בכל פעילות כדי לשמור אותה לכאן.</p>
    <button class="btn sm" data-go="sHome" style="margin:0 auto">לעמוד הפעילויות</button></div>`;return}
  $("fsortSeg").innerHTML=[["soon","קרוב"],["added","נוסף"],["cat","קטגוריה"],["name","שם"]]
    .map(([v,l])=>`<button data-fsort="${v}" aria-pressed="${S.fsort===v}">${l}</button>`).join("");
  if(S.fcat&&!all.some(a=>a.category===S.fcat))S.fcat=null;
  const cs=[...new Set(all.map(a=>a.category))];
  $("fcats").innerHTML=`<button class="chip" data-fcat="" aria-pressed="${!S.fcat}">הכול</button>`+
    cs.map(c=>`<button class="chip" data-fcat="${c}" aria-pressed="${S.fcat===c}">${CAT[c]?CAT[c].n:c}</button>`).join("");
  let list=all.filter(a=>match(a,S.fq)&&(!S.fcat||a.category===S.fcat));
  const col=new Intl.Collator("he"),ORD=Object.keys(CAT);
  if(S.fsort==="added")list.sort((a,b)=>(S.favAt[b.id]||0)-(S.favAt[a.id]||0));
  else if(S.fsort==="name")list.sort((a,b)=>col.compare(a.title,b.title));
  else if(S.fsort==="cat")list.sort((a,b)=>ORD.indexOf(a.category)-ORD.indexOf(b.category)||col.compare(a.title,b.title));
  else list.sort((a,b)=>ts(a)-ts(b));
  $("favFeed").innerHTML=list.length?list.map(a=>card(a)).join(""):`<div class="empty"><p class="mut">אין תוצאות לסינון הזה.</p></div>`;

  if(S.favs.has(id)){S.favs.delete(id);delete S.favAt[id]}else{S.favs.add(id);S.favAt[id]=Date.now()}
  save();
  if(S.screen==="sHome")renderHome();if(S.screen==="sFav")renderFav();
  if(S.detail)openDetail(S.detail);
}
document.addEventListener("click",e=>{
  const t=e.target;
  const fav=t.closest("[data-fav]");if(fav){e.preventDefault();e.stopPropagation();toggleFav(fav.dataset.fav);return}
  if(t.closest("[data-close]")){closeDetail();return}
  const card=t.closest("[data-open]");if(card){openDetail(card.dataset.open);return}
  const go=t.closest("[data-go]");if(go){show(go.dataset.go);return}
  const c=t.closest("[data-cat]");if(c){S.cat=c.dataset.cat||null;S.top=null;renderHome();return}
  const tp=t.closest("[data-top]");if(tp){S.top=tp.dataset.top||null;renderHome();return}
  const fc=t.closest("[data-fcat]");if(fc){S.fcat=fc.dataset.fcat||null;renderFav();return}
  const fs=t.closest("[data-fsort]");if(fs){S.fsort=fs.dataset.fsort;renderFav();return}
  const sz=t.closest("button[data-size]");if(sz){S.set.size=sz.dataset.size;save();applySet();renderSet();return}
  const et=t.closest("[data-etopic]");if(et){const v=et.dataset.etopic,i=S.quiz.topics.indexOf(v);i<0?S.quiz.topics.push(v):S.quiz.topics.splice(i,1);save();renderProf();return}
  if(t.id==="clr"){S.q="";S.cat=null;S.top=null;$("q").value="";renderHome();return}
  if(t.id==="pGo"){S.pEdit=true;renderProf();return}
  if(t.id==="pCancel"){S.pEdit=false;renderProf();return}
  if(t.id==="pSave"){S.quiz.name=$("en").value.trim();S.quiz.age=$("ea").value;S.quiz.grade=$("eg").value;S.quiz.area=$("er").value;save();S.pEdit=false;renderProf();return}
  if(t.id==="out"){S.guest=false;S.user=null;save();show("sAuth");$("authIntro").hidden=false;$("authForm").hidden=true;return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.detail)closeDetail()});
$("q").addEventListener("input",e=>{S.q=e.target.value.trim();renderHome()});
$("fq").addEventListener("input",e=>{S.fq=e.target.value.trim();renderFav()});
applySet();
show(S.user||S.guest?"sHome":"sAuth");
</script>
</body>
</html>
