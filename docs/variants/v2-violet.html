<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מה בי״ם — Violet Native</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --scale:1;
  --violet:#7C3AED; --violetD:#6D28D9; --violetT:#F3EEFF;
  --bg:#F2F2F7; --card:#FFFFFF;
  --ink:#111114; --ink2:#6E6E76; --ink3:#A0A0A8;
  --sep:#E5E5EA; --red:#D93025;
}
html[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E;
  --ink:#F5F5F7; --ink2:#98989F; --ink3:#6E6E76;
  --sep:#2C2C2E; --violetT:#221A3A; --red:#FF6B5E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:#D8D8DE;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Heebo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh;
}
html[data-theme="dark"] body{background:#0A0A0C}
::selection{background:var(--violet);color:#fff}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:2px;border-radius:7px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}

.app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;padding-bottom:92px;box-shadow:0 0 60px -20px rgba(0,0,0,.3)}
.scr{display:none}.scr.on{display:block;animation:in .3s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pad{padding-inline:18px}

/* nav bar */
.navbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 18px;min-height:48px;
}
.navbar .nb{color:var(--violet);font-size:calc(16px*var(--scale));font-weight:500}
.navbar .nb.strong{font-weight:700}
.navbar h3{font-size:calc(16.5px*var(--scale));font-weight:700;margin:0;letter-spacing:-.02em}
.lt{font-size:calc(34px*var(--scale));font-weight:800;letter-spacing:-.038em;margin:0;line-height:1.12}
.lsub{color:var(--ink2);font-size:calc(15px*var(--scale));margin:5px 0 0;line-height:1.5}

/* grouped inset list */
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:22px}
.gr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:13px 16px;text-align:start;font-size:calc(16px*var(--scale));position:relative}
.gr+.gr::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;height:.5px;background:var(--sep)}
.gr .gv{color:var(--ink2);font-size:calc(15.5px*var(--scale));display:flex;align-items:center;gap:6px}
.chev{width:8px;height:13px;flex:none;stroke:var(--ink3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
html[dir="rtl"] .chev{transform:scaleX(-1)}
.ghead{font-size:calc(13px*var(--scale));font-weight:600;color:var(--ink2);text-transform:none;margin:0 0 7px;padding-inline:16px;letter-spacing:.01em}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:50px;border-radius:12px;
  background:var(--violet);color:#fff;font-weight:700;font-size:calc(16px*var(--scale));letter-spacing:-.01em;
  transition:transform .16s cubic-bezier(.16,1,.3,1),background .16s}
.btn:active{transform:scale(.98);background:var(--violetD)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--violet)}
.btn.dstr{background:var(--card);color:var(--red)}
.lnk{color:var(--violet);font-weight:600;font-size:calc(15px*var(--scale))}

.fld{margin-bottom:14px}
.fld label{display:block;font-size:calc(13px*var(--scale));font-weight:600;color:var(--ink2);margin-bottom:6px;padding-inline:4px}
.inp{width:100%;min-height:48px;border-radius:11px;border:0;background:var(--card);padding-inline:15px;
  font-size:calc(16px*var(--scale));transition:box-shadow .16s}
.inp:focus{outline:none;box-shadow:0 0 0 2.5px var(--violet)}
.inp::placeholder{color:var(--ink3)}
.err{color:var(--red);font-size:calc(13.5px*var(--scale));font-weight:500;min-height:1.2em;margin:6px 4px 0}

.srch{position:relative;margin:0 0 14px}
.srch svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:2.4;stroke-linecap:round}
.srch input{width:100%;min-height:40px;border-radius:10px;border:0;background:color-mix(in srgb,var(--ink3) 18%,transparent);
  padding-inline-start:38px;padding-inline-end:14px;font-size:calc(16px*var(--scale))}
.srch input:focus{outline:none;box-shadow:0 0 0 2.5px var(--violet)}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;padding-bottom:3px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:9px;background:var(--card);font-size:calc(14px*var(--scale));font-weight:600;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--violet);color:#fff}

/* prompt banner */
.promo{background:var(--violet);color:#fff;border-radius:14px;padding:16px 17px;display:flex;gap:13px;align-items:center;margin-bottom:20px}
.promo h4{margin:0 0 3px;font-size:calc(15.5px*var(--scale));font-weight:700}
.promo p{margin:0;font-size:calc(13.5px*var(--scale));opacity:.9;line-height:1.45}
.promo .pi{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.promo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.gcard{background:var(--card);border-radius:14px;overflow:hidden;text-align:start;width:100%;
  transition:transform .18s cubic-bezier(.16,1,.3,1);display:block}
.gcard:active{transform:scale(.975)}
.gmedia{height:104px;position:relative;overflow:hidden}
.gmedia svg{position:absolute;inset:0;width:100%;height:100%}
.gdate{position:absolute;inset-block-end:7px;inset-inline-end:7px;background:rgba(255,255,255,.94);border-radius:8px;padding:4px 8px;text-align:center;min-width:38px}
html[data-theme="dark"] .gdate{background:rgba(28,28,30,.92)}
.gdate b{display:block;font-size:calc(14px*var(--scale));font-weight:800;line-height:1;color:var(--ink)}
.gdate span{display:block;font-size:calc(9.5px*var(--scale));font-weight:700;color:var(--ink2);margin-top:1px}
.gfav{position:absolute;inset-block-start:7px;inset-inline-start:7px;width:29px;height:29px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center}
html[data-theme="dark"] .gfav{background:rgba(28,28,30,.92)}
.gfav svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:2.1;stroke-linejoin:round}
.gfav[aria-pressed="true"] svg{fill:var(--violet);stroke:var(--violet)}
.gbody{padding:10px 11px 13px}
.tg{display:inline-block;font-size:calc(10.5px*var(--scale));font-weight:700;padding:3px 7px;border-radius:6px;margin-bottom:6px}
.gt{font-size:calc(14px*var(--scale));font-weight:700;line-height:1.32;margin:0;letter-spacing:-.015em}
.gm{color:var(--ink2);font-size:calc(11.5px*var(--scale));margin:5px 0 0;line-height:1.4}

/* tabbar */
.tabs{position:fixed;bottom:0;inset-inline:0;margin:0 auto;max-width:430px;z-index:40;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;color:var(--ink3);font-size:calc(10px*var(--scale));font-weight:600}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--violet)}
.tabs .mid{flex:0 0 62px}
.tabs .mid .mc{width:44px;height:44px;border-radius:50%;background:var(--violet);display:grid;place-items:center;margin-top:-12px;box-shadow:0 6px 16px -5px rgba(124,58,237,.7)}
.tabs .mid .mc svg{stroke:#fff;width:22px;height:22px;stroke-width:2.3}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{position:absolute;inset-inline:0;bottom:0;max-width:430px;margin:0 auto;height:94vh;overflow-y:auto;
  background:var(--bg);border-radius:14px 14px 0 0;animation:up .4s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 15px;border-radius:10px;background:var(--card);font-size:calc(15px*var(--scale));font-weight:500}
.opt[aria-pressed="true"]{background:var(--violet);color:#fff;font-weight:600}
.steps{display:flex;gap:4px;margin:14px 0 18px}
.steps i{flex:1;height:3px;border-radius:99px;background:var(--sep)}
.steps i.on{background:var(--violet)}
.empty{text-align:center;padding:60px 26px}
.ava{width:78px;height:78px;border-radius:50%;background:var(--violet);display:grid;place-items:center;
  font-size:calc(30px*var(--scale));font-weight:700;color:#fff;margin:0 auto 12px}
.seg{display:flex;background:color-mix(in srgb,var(--ink3) 16%,transparent);padding:2px;border-radius:9px;gap:2px}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:calc(13px*var(--scale));font-weight:600;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14)}
</style>
</head>
<body>
<!--
THESIS: The city's youth catalog rendered as a first-class native phone app; refuses the web-in-a-shell listing page by committing to platform grammar end to end.
OWN-WORLD: iOS convention at full fidelity — collapsing large titles, grouped inset lists with inset separators, translucent bars, segmented controls — carrying one vivid violet and nine low-saturation category tags. System text stack with Heebo for Hebrew weights.
STORY: A teen scans a two-column grid, taps into a sheet that reads like Settings, saves it, and leaves through the organizer's own link.
FIRST VIEWPORT: Translucent bar, 34px large title, search field, category chips, a violet prompt banner, then the grid.
FORM: Violet Native, direction 2 of 5, client-pinned reference.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<div class="app" id="app">

<section class="scr on" id="sAuth">
  <div class="pad" style="padding-top:56px">
    <h1 class="lt">מה בי״ם</h1>
    <p class="lsub">כל החוגים, הסדנאות והאירועים לנוער בירושלים — במקום אחד.</p>
    <div id="authIntro" style="margin-top:38px">
      <button class="btn" id="goSignup">יצירת חשבון</button>
      <button class="btn ghost" id="goLogin" style="margin-top:10px">התחברות</button>
      <p class="ghead" style="text-align:center;margin:26px 0 10px;padding:0">אפשר גם בלי חשבון</p>
      <button class="btn ghost" id="goGuest">המשך כאורח</button>
      <p class="ghead" style="text-align:center;margin-top:10px;padding:0">שמירת מועדפים דורשת חשבון.</p>
    </div>
    <div id="authForm" style="margin-top:34px" hidden>
      <div class="fld"><label for="au">שם משתמש</label><input class="inp" id="au" autocomplete="username"></div>
      <div class="fld"><label for="ap">סיסמה</label><input class="inp" id="ap" type="password"></div>
      <p class="err" id="aerr"></p>
      <button class="btn" id="aSubmit">המשך</button>
      <p style="text-align:center;margin-top:16px"><button class="lnk" id="aSwap"></button></p>
    </div>
  </div>
</section>

<section class="scr" id="sQuiz">
  <div class="navbar"><button class="nb" id="qSkip">דילוג</button><h3>הכרות</h3><button class="nb strong" id="qNext">הבא</button></div>
  <div class="pad" style="padding-top:6px">
    <div class="steps" id="qSteps"></div>
    <h1 class="lt" style="font-size:calc(26px*var(--scale))" id="qTtl"></h1>
    <p class="lsub" id="qSub"></p>
    <div id="qBody" style="margin-top:22px"></div>
    <button class="btn ghost" id="qBack" style="margin-top:24px">הקודם</button>
  </div>
</section>

<section class="scr" id="sHome">
  <div class="navbar"><h3 id="nbTitle">מה בי״ם</h3><button class="nb" id="guestOut" hidden>יציאה</button></div>
  <div class="pad" style="padding-top:10px">
    <h1 class="lt" id="greet"></h1>
    <p class="lsub" id="sub">מה בא לך לעשות השבוע?</p>
    <div class="srch" style="margin-top:18px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg><input id="q" type="search" placeholder="חיפוש"></div>
    <div class="chips" id="cats"></div>
    <div class="chips" id="tops" style="margin-top:8px" hidden></div>
    <div id="promo" style="margin-top:18px"></div>
    <div class="grid" id="feed"></div>
  </div>
</section>

<section class="scr" id="sFav">
  <div class="navbar"><h3>מועדפים</h3></div>
  <div class="pad" style="padding-top:10px">
    <h1 class="lt">שמורים</h1>
    <p class="lsub" id="favCount"></p>
    <div id="favTools" style="margin-top:16px">
      <div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg><input id="fq" type="search" placeholder="חיפוש במועדפים"></div>
      <div class="seg" id="fsortSeg"></div>
      <div class="chips" id="fcats" style="margin-top:12px"></div>
    </div>
    <div class="grid" id="favFeed" style="margin-top:18px"></div>
  </div>
</section>

<section class="scr" id="sProf">
  <div class="navbar"><h3>פרופיל</h3><button class="nb" id="pToggle">עריכה</button></div>
  <div class="pad" style="padding-top:22px">
    <div class="ava" id="pAva"></div>
    <h1 class="lt" style="text-align:center;font-size:calc(22px*var(--scale))" id="pName"></h1>
    <p class="lsub" style="text-align:center" id="pSub"></p>
    <div id="pBody" style="margin-top:26px"></div>
  </div>
</section>

<section class="scr" id="sSet">
  <div class="navbar"><h3>הגדרות</h3></div>
  <div class="pad" style="padding-top:10px"><h1 class="lt">הגדרות</h1><div id="setBody" style="margin-top:22px"></div></div>
</section>

<nav class="tabs" id="tabs" hidden></nav>
<div class="sheet" id="sheet"><div class="scrim" data-close></div><div class="panel" id="panel"></div></div>
</div>

<script src="activities.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const CAT={sport:{n:"ספורט",c:"#E8590C"},tech:{n:"טכנולוגיה",c:"#1971C2"},art:{n:"אמנות",c:"#C2255C"},music:{n:"מוזיקה",c:"#7048E8"},stage:{n:"במה",c:"#E03131"},nature:{n:"טבע",c:"#2F9E44"},volunteer:{n:"התנדבות",c:"#0CA678"},leadership:{n:"מנהיגות",c:"#F08C00"},gaming:{n:"גיימינג",c:"#9C36B5"}};
const MON=["ינו","פבר","מרץ","אפר","מאי","יוני","יולי","אוג","ספט","אוק","נוב","דצמ"];
const DAY=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const AREAS=["מרכז","צפון","דרום","מזרח","מערב"],GRADES=["ז׳","ח׳","ט׳","י׳","י״א","י״ב","לא לומד/ת"];
const TOPICS=["ספורט","אמנות ועיצוב","טכנולוגיה","מוזיקה","בישול","מדעים","קולנוע וצילום","יזמות","חברה וקהילה"];
const TYPES=["קורסים","הרצאות","חוגים","הופעות","התנדבות","תעסוקה"];
const A=window.ACTIVITIES||[];
const LS="mb_vio_";
const store={get(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}};
let S={screen:"sAuth",mode:"signup",guest:false,user:store.get("user",null),
  favs:new Set(store.get("favs",[])),favAt:store.get("favAt",{}),
  quiz:store.get("quiz",{name:"",age:"",grade:"",area:"",topics:[],types:[]}),
  set:store.get("set",{theme:"light",size:"medium"}),
  q:"",cat:null,top:null,fq:"",fcat:null,fsort:"soon",qStep:0,detail:null,pEdit:false};

const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)};
const cat=a=>CAT[a.category]||{n:a.category,c:"#7048E8"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtD=iso=>{const d=new Date(iso+"T00:00:00");return d.getDate()+" ב"+MON[d.getMonth()]+" "+d.getFullYear()};
const tRange=a=>{const s=(a.start_time||"").slice(0,5);return a.end_time?s+"–"+a.end_time.slice(0,5):"מ־"+s};
function whenT(a){
  if(a.schedule_type==="recurring"){const d=(a.recurrence_days||[]).map(x=>DAY[x]).join(", ");
    return{m:d?"כל יום "+d:"שבועי",s:tRange(a)+" · ללא תאריך סיום"}}
  const r=a.end_date&&a.end_date!==a.start_date?fmtD(a.start_date)+" – "+fmtD(a.end_date):fmtD(a.start_date);
  return{m:r,s:tRange(a)};
}
const ageT=a=>a.age_min==null&&a.age_max==null?"כל הגילאים":(a.age_min!=null&&a.age_max!=null?"גילאי "+a.age_min+"–"+a.age_max:(a.age_min!=null?"מגיל "+a.age_min:"עד גיל "+a.age_max));
function priceT(a){if(a.price==null)return"המחיר לא פורסם";if(a.price===0)return"חינם";
  const p={total:"לכל התקופה",per_session:"למפגש",monthly:"לחודש"}[a.price_period]||"";return a.price+" ₪"+(p?" · "+p:"")}
const cta=a=>a.registration_url?{h:a.registration_url,l:"להרשמה אצל המארגן"}:(a.source_url?{h:a.source_url,l:"לפרטים ולמקור"}:{h:null,l:"פרטי הרשמה יתפרסמו בקרוב"});
const ts=a=>{const t=new Date(a.start_date+"T"+(a.start_time||"00:00:00")).getTime();return isNaN(t)?Infinity:t};
const KIND=a=>a.item_kind==="event"?"אירוע":(a.schedule_type==="recurring"?"חוג":"פעילות");

function media(a){
  const h=hash(a.id),c=cat(a).c,r=[];
  for(let i=0;i<4;i++){
    const x=((h>>(i*3))&15)*7,y=((h>>(i*4))&15)*5,w=30+((h>>i)&15)*4,rot=((h>>(i*2))&7)*18;
    r.push(`<rect x="${x}" y="${y}" width="${w}" height="${w*.62}" rx="6" fill="${c}" opacity="${.85-i*.18}" transform="rotate(${rot} ${x+w/2} ${y+w/3})"/>`);
  }
  return `<svg viewBox="0 0 130 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="130" height="90" fill="${c}" opacity=".14"/>${r.join("")}</svg>`;
}
const IC={home:'<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',

    .map(([v,l])=>`<button data-fsort="${v}" aria-pressed="${S.fsort===v}">${l}</button>`).join("");

  let list=all.filter(a=>match(a,S.fq)&&(!S.fcat||a.category===S.fcat));

function toggleFav(id){

}
document.addEventListener("click",e=>{
  const t=e.target;
  const fav=t.closest("[data-fav]");if(fav){e.preventDefault();e.stopPropagation();toggleFav(fav.dataset.fav);return}
  if(t.closest("[data-close]")){closeDetail();return}
  const card=t.closest("[data-open]");if(card){openDetail(card.dataset.open);return}
  const go=t.closest("[data-go]");if(go){show(go.dataset.go);return}
  const c=t.closest("[data-cat]");if(c){S.cat=c.dataset.cat||null;S.top=null;renderHome();return}
  const tp=t.closest("[data-top]");if(tp){S.top=tp.dataset.top||null;renderHome();return}
  const fc=t.closest("[data-fcat]");if(fc){S.fcat=fc.dataset.fcat||null;renderFav();return}
  const fs=t.closest("[data-fsort]");if(fs){S.fsort=fs.dataset.fsort;renderFav();return}
  const th=t.closest("button[data-theme]");if(th){S.set.theme=th.dataset.theme;save();applySet();renderSet();return}
  const sz=t.closest("button[data-size]");if(sz){S.set.size=sz.dataset.size;save();applySet();renderSet();return}
  const et=t.closest("[data-etopic]");if(et){const v=et.dataset.etopic,i=S.quiz.topics.indexOf(v);i<0?S.quiz.topics.push(v):S.quiz.topics.splice(i,1);save();renderProf();return}
  if(t.id==="clr"){S.q="";S.cat=null;S.top=null;$("q").value="";renderHome();return}
  if(t.id==="pToggle"){if(S.pEdit){const e1=$("en");if(e1){S.quiz.name=e1.value.trim();S.quiz.age=$("ea").value;S.quiz.grade=$("eg").value;S.quiz.area=$("er").value;save()}}S.pEdit=!S.pEdit;renderProf();return}
  if(t.id==="pSave"){S.quiz.name=$("en").value.trim();S.quiz.age=$("ea").value;S.quiz.grade=$("eg").value;S.quiz.area=$("er").value;save();S.pEdit=false;renderProf();return}
  if(t.id==="out"){S.guest=false;S.user=null;save();show("sAuth");$("authIntro").hidden=false;$("authForm").hidden=true;return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.detail)closeDetail()});
$("q").addEventListener("input",e=>{S.q=e.target.value.trim();renderHome()});
$("fq").addEventListener("input",e=>{S.fq=e.target.value.trim();renderFav()});
applySet();
show(S.user||S.guest?"sHome":"sAuth");
</script>
</body>
</html>
